}

async function hideBuds() {
  if (!game || game.picks.length !== 3) return;
  game.busy = true; renderGame();
  try {
    const v = await api('POST', '/api/game', { action: 'hide', id: game.id, tiles: game.picks });
    game.busy = false; game.msg = '';
    for (const id of v.mySquad) { const b = budById(id); if (b) b.syv -= 0.15; }
    S.play('giggle');
    applyView(v);
  } catch (e) { game.busy = false; game.msg = e.message; renderGame(); }
}

async function shootAt(t) {
  const yell = game.yell;
  game.busy = true; colorTiles();
  try {
    const v = await api('POST', '/api/game', { action: 'shoot', id: game.id, tile: t, yell });
    game.busy = false; game.yell = false;
    const s = v.last;
    const msg = s.yell != null ? (s.yell ? `${s.yell} hiding within 2 tiles of there!` : 'Nobody’s hiding anywhere near there.')
      : s.hit ? `You found ${budName(s.bud)}!` : s.giggle ? 'Nothing there… but you hear a giggle nearby.' : 'Nothing there but pebbles.';
    applyView(v, s, msg);
  } catch (e) { game.busy = false; game.msg = e.message; renderGame(); }
}

function animateShot(s, board) {
  const p = tilePos(s.t);
  if (s.yell != null) { S.play('alert'); return; }
  if (s.hit) {
    const id = board === 'theirs' ? s.bud : game.v.mySquad[game.v.myHides.indexOf(s.t)];
    const b = budById(id);
    puff(p.x, p.z);
    S.play('sparkle', { gain: 0.8 });
    if (b && b.gamePiece) {
      b.y = 0.01; b.vy = 8; b.syv -= 0.15; b.happyUntil = T + 2.5;
      say(b, board === 'theirs' ? pick(['peekaboo!', 'aw, you found me!', 'how did you know?!']) : pick(['eek, they found me!', 'aw, found!', 'peekaboo…']), 2000);
    }
    return;
  }
  if (s.giggle) setTimeout(() => S.play('giggle'), 150);
}

async function resignGame() {
  if (!game) return;
  game.busy = true; renderGame();
  try { const v = await api('POST', '/api/game', { action: 'resign', id: game.id }); game.busy = false; applyView(v); }
  catch (e) { game.busy = false; game.msg = e.message; renderGame(); }
}

async function rematch() {
  if (!game) return;
  const them = game.v.them;
  game.busy = true; renderGame();
  try { await startGameWith(them); } catch (e) { if (game) { game.busy = false; game.msg = e.message; renderGame(); } }
}

async function startGameWith(them) {
  const res = await api('POST', '/api/game', { action: 'create', opponent: them });
  if (!myGames.some((g) => g.id === res.id)) myGames.push({ id: res.id, them, myTurn: true, status: 'setup' });
  if (game) exitGame();
  await enterGame(res.id);
}

// the card buttons: on a friend's bud, and the list on your own

  const g = myGames.find((x) => x.them === bud.data.id);
  const b = el('button', 'btn primary', g ? (g.myTurn ? 'Your turn in Peekaboo' : 'Open Peekaboo') : 'Play Peekaboo'); b.type = 'button';
  b.addEventListener('click', async () => {
    b.disabled = true;
    try { if (g) await enterGame(g.id); else await startGameWith(bud.data.id); }
    catch (e) { b.disabled = false; b.textContent = e.message; }
  });
  return b;
}
function renderGamesList() {
  if (!myGames.length) return;
  const box = el('section', 'diary games');
  box.append(el('h3', null, 'Peekaboo'));
  const ul = el('ul');
  for (const g of myGames) {
    const other = budById(g.them), who = other ? other.data.ownerName || nameOf(other) : 'a friend';
    const li = el('li', g.myTurn ? 'fresh' : null);
    const open = el('button', 'btn', g.myTurn ? 'Your turn' : 'Open'); open.type = 'button';
    open.addEventListener('click', () => enterGame(g.id));
    li.append(el('span', 'ico', '◆'), el('span', null, `with ${who}`), open);
    ul.append(li);
  }
  box.append(ul);
  cardBody.append(box);
}

gameSeg.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-board]');
  if (!b || !game || b.dataset.board === game.board) return;
  game.board = b.dataset.board; game.yell = false; game.msg = '';
  S.play('click');
  renderGame();
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && game && !game.busy) exitGame(); });

const hint = document.getElementById('hint');
function hideHint() { hint.classList.add('gone'); }
setTimeout(hideHint, 9000);

/* ---------------- labels and bubbles follow the buds on screen ---------------- */
function placeLabels() {
  for (const bud of buds) {
    tmp.set(bud.x, bud.y + bud.hop.position.y - bud.y + bud.height * bud.sy + 0.35, bud.z).project(camera);
    const visible = tmp.z < 1 && bud.placed && !bud.gameHidden;
    const sx = (tmp.x + 1) / 2 * innerWidth, sy = (1 - tmp.y) / 2 * innerHeight;
    const dist = camera.position.distanceTo(bud.root.position);
    const scale = clamp(22 / dist, 0.55, 1.15);
    bud.tag.hidden = !visible;
    if (visible) bud.tag.style.transform = `translate(${sx - bud.tag.offsetWidth / 2}px, ${sy - bud.tag.offsetHeight}px) scale(${scale.toFixed(3)})`;
    if (bud.bubble && !bud.bubble.hidden) {
      if (T > bud.bubbleUntil || !visible) bud.bubble.hidden = true;
      else bud.bubble.style.transform = `translate(${sx - bud.bubble.offsetWidth / 2}px, ${sy - bud.tag.offsetHeight * scale - bud.bubble.offsetHeight - 12}px) scale(${scale.toFixed(3)})`;
    }
  }
}

/* ---------------- loop ---------------- */
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  setClock(T);
  for (const bud of buds) if (bud.placed && !bud.gameHidden) { updateBud(bud, dt); drawFace(bud); animateStickies(bud, dt); }
  separateBuds();
  photoTick();
  gameTick(dt);
  updateSky(dt);
  for (const c of clouds) {
    c.a += c.sp * dt;
    c.g.position.set(Math.cos(c.a) * c.r, c.y + Math.sin(T * 0.2 + c.a) * 0.4, Math.sin(c.a) * c.r);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life += dt;
    p.m.position.x += p.vx * dt; p.m.position.z += p.vz * dt; p.m.position.y += p.vy * dt;
    p.vx *= 0.92; p.vz *= 0.92; p.vy *= 0.9;
    p.m.material.opacity = Math.max(0, 1 - p.life / 0.9); p.m.scale.setScalar(1 + p.life * 1.5);
    if (p.life > 0.9) { scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); puffs.splice(i, 1); }
  }
  placeCamera(dt);
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // pull back on narrow screens so the whole island fits
  camera.fov = innerWidth < innerHeight ? 50 : 38;
  camera.updateProjectionMatrix();
  if (game) camGoal.dist = gameDist();
}
// how far back the camera sits to see the whole island, wide or narrow screen
function fitDist() {
  const half = Math.min(camera.fov / 2, Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect) * 180 / Math.PI);
  return Math.max(R * 2.3, R * 1.12 / Math.tan(half * Math.PI / 180));
}
const maxDist = () => Math.max(R * 3.4, fitDist() * 1.3);
addEventListener('resize', resize);

/* ---------------- start ---------------- */
function showCenter(title, text, linkText, href = '/') {
  document.getElementById('centerTitle').textContent = title;
  document.getElementById('centerText').textContent = text;
  const a = document.getElementById('centerLink'); a.textContent = linkText; a.href = href;
  document.getElementById('center').hidden = false;
}

(async () => {
  resize();
  let world;
  try {
    const res = await fetch('/api/world', { credentials: 'same-origin', cache: 'no-store' });
    if (res.status === 401) { location.replace('/'); return; }
    if (!res.ok) throw new Error(String(res.status));
    world = await res.json();
  } catch (e) {
    buildIsland(0); buildSkyAndSeason(); requestAnimationFrame(frame);
    showCenter('The island is hiding', 'I couldn’t load the buds just now. Try again in a moment.', 'Back to my bud');
    return;
  }

  document.getElementById('whoName').textContent = world.me.name;
  document.getElementById('whoAvatar').src = world.me.avatarUrl;
  document.getElementById('who').hidden = false;

  buildIsland(world.buds.length);
  buildSkyAndSeason();
  updateSky(0);
  const n = world.buds.length;
  document.getElementById('titleSub').textContent = (HALLOWEEN ? 'Happy Halloween! ' : '') + (n === 1 ? 'Just one bud here so far.' : `${n} buds live here.`);
  cam.dist = camGoal.dist = fitDist();

  inbox = world.inbox || [];
  diary = world.diary || [];
  myGames = world.games || [];
  news = world.news || null;
  if (news) {
    document.getElementById('newsBtn').hidden = false;
    document.getElementById('newsDot').hidden = !!news.seen;
    const OPEN_NEWS = params.get('news') === '1';
    if (OPEN_NEWS) setTimeout(openNews, 1200);
    else if (!news.seen && !DROP && !GAME_ID) setTimeout(() => { if (card.hidden && !photo && !composing && !game) openNews(); }, 9500);
  }
  hasProfile = world.me.hasProfile !== false;
  dmsOn = world.me.dms !== false;
  myProfile = world.me.profile || null;
  myWardrobe = world.me.wardrobe || null;
  // seasonal gear that turned up since last time: "a witch hat washed up on the shore!"
  const found = (world.me.found || []).map((id) => myWardrobe?.owned.find((o) => o.id === id)).filter(Boolean);
  if (found.length) setTimeout(() => {
    const me = myBud(); if (!me) return;
    const what = found.map((f) => `a ${f.name.toLowerCase()}`).join(' and ');
    say(me, `${what} washed up on the shore! it’s in my wardrobe`, 4200); me.syv -= 0.15; S.play('sparkle');
  }, 7000);
  for (const d of world.buds) {
    try { buds.push(await makeBud(d)); } catch (e) { console.error('could not build bud', d.id, e); }
  }
  const mine = buds.find((b) => b.data.isMe);
  if (mine) document.getElementById('findMe').hidden = false;
  if (buds.length) document.getElementById('photoBtn').hidden = false;

  // the notes already stuck on everyone: yours on your own bud are the ones you can read
  for (const bud of buds) {
    try {
      if (bud.data.isMe) { for (const n of inbox) addSticky(bud, n.color, n.from); continue; }
      const colors = [...(bud.data.stickies || [])];
      const my = bud.data.myNote;
      if (my && my.status === 'pending') { const i = colors.indexOf(my.color); if (i >= 0) colors.splice(i, 1); }
      for (const c of colors) addSticky(bud, c);
      if (my && my.status === 'pending') addSticky(bud, my.color, 'mine');
    } catch (e) { console.error('could not stick notes on', bud.data.id, e); }
  }
  updateNotesPill();

  // everyone else starts somewhere on the island
  for (const bud of buds) {
    if (DROP && bud === mine) continue;
    const p = freeSpot(2.4); bud.x = p.x; bud.z = p.z; bud.placed = true;
  }

  if (!buds.length) {
    showCenter('No buds here yet', 'Make the first one and it’ll be waiting here when your friends arrive.', 'Make my bud');
  } else if (DROP && mine) {
    // your bud falls in from the sky
    const p = freeSpot(3, null, WALK_R * 0.45);
    Object.assign(mine, { x: p.x, z: p.z, y: 18, vy: 0, state: 'drop', placed: true, heading: Math.atan2(camera.position.x - p.x, camera.position.z - p.z) });
    cam.yaw = Math.atan2(p.x, p.z) + 0.5;
    cam.follow = mine; cam.followUntil = T + 7;
    camGoal.target.set(p.x, 1, p.z); cam.target.set(p.x, 6, p.z);
    camGoal.dist = Math.max(10, R * 1.1); cam.dist = camGoal.dist + 6;
    document.getElementById('titleText').textContent = `Welcome, ${mine.data.nickname || mine.data.trueName}`;
    document.getElementById('titleSub').textContent = 'Your bud just moved in.';
    setTimeout(() => { mine.heading = Math.atan2(camera.position.x - mine.x, camera.position.z - mine.z); say(mine, 'wheeeee!', 1500); }, 200);
  }
  if (mine && !DROP && !GAME_ID && !params.get('bud')) setTimeout(() => welcomeBack(mine, world.me.lastVisit), 1400);
  if (GAME_ID && mine) setTimeout(() => enterGame(GAME_ID), 700);
  const OPEN_BUD = /^\d{5,25}$/.test(params.get('bud') || '') ? buds.find((b) => b.data.id === params.get('bud')) : null;
  if (OPEN_BUD && !GAME_ID) {
    history.replaceState(null, '', location.pathname);
    setTimeout(() => { cam.follow = OPEN_BUD; cam.followUntil = T + 5; camGoal.dist = Math.max(9, R * 0.85); OPEN_BUD.syv -= 0.12; say(OPEN_BUD, pick(HELLOS), 1500); openCard(OPEN_BUD); }, 1500);
  }
  setTimeout(() => document.getElementById('title').classList.add('fade'), DROP ? 9000 : 6000);
  requestAnimationFrame(frame);
})();

S.bindToggle(document.getElementById('soundBtn'));
if (!window.BudSound) document.getElementById('soundBtn').hidden = true;
S.onChange(() => S.ambient(!S.muted));   // wind and birds once sound is allowed, off when muted
S.ambient(true);

document.getElementById('findMe').addEventListener('click', () => {
  const mine = buds.find((b) => b.data.isMe);
  if (!mine) return;
  cam.follow = mine; cam.followUntil = T + 6;
  camGoal.dist = Math.max(9, R * 0.9);
  mine.lookCameraUntil = T + 3; mine.happyUntil = T + 1; mine.syv -= 0.1;
  say(mine, 'over here!', 1600);
});
</script>
