/* ---------------- the island ---------------- */
let R = 12;              // island radius, set once we know how many buds live here
let WALK_R = R * 0.78;   // how far from the middle buds wander
const obstacles = [];    // trees and rocks buds walk around: { x, z, r }
const clouds = [];

const toLinear = (hex) => new THREE.Color(hex).convertSRGBToLinear();

function islandEdge(a, seed) {
  return 1 + 0.05 * Math.sin(3 * a + seed) + 0.035 * Math.sin(5 * a + seed * 2.3) + 0.02 * Math.sin(9 * a + seed * 0.7);
}

function buildIsland(nBuds) {
  R = clamp(9 + Math.sqrt(nBuds) * 2.2, 11, 30);
  WALK_R = R * 0.78;
  const seed = 2.1;
  const group = new THREE.Group();

  // grassy top with a soft rounded rim
  const shape = new THREE.Shape();
  const N = 96;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2, r = R * islandEdge(a, seed);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? shape.lineTo(x, y) : shape.moveTo(x, y);
  }
  const depth = 0.9, bevel = 0.5;
  const topGeo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: 0.55, bevelSegments: 5, curveSegments: 64 });
  topGeo.rotateX(-Math.PI / 2);
  topGeo.translate(0, -(depth + bevel), 0);
  const grass = new THREE.MeshStandardMaterial({ color: toLinear('#86CF86'), roughness: 0.95, envMapIntensity: 0.35 });
  const grassSide = new THREE.MeshStandardMaterial({ color: toLinear('#6DB774'), roughness: 0.95, envMapIntensity: 0.35 });
  group.add(new THREE.Mesh(topGeo, [grass, grassSide]));

  // rocky underside, a lumpy upside-down cone
  const h = R * 0.85;
  const cone = new THREE.ConeGeometry(R * 1.0, h, 30, 7, true);
  cone.rotateX(Math.PI);
  const pos = cone.attributes.position, colors = [];
  const soilTop = new THREE.Color('#C9A27A'), soilTip = new THREE.Color('#7F6250');
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const t = (h / 2 - y) / h;   // 0 at the top ring, 1 at the tip
    const a = Math.atan2(z, x), rr = Math.hypot(x, z);
    const edge = islandEdge(a, seed);
    const jitter = t > 0.02 ? 1 + 0.12 * Math.sin(a * 7 + t * 9) + (Math.random() - 0.5) * 0.12 : 1;
    pos.setXYZ(i, Math.cos(a) * rr * edge * jitter, y + (t > 0.05 && t < 0.98 ? (Math.random() - 0.5) * 0.5 : 0), Math.sin(a) * rr * edge * jitter);
    const c = soilTop.clone().lerp(soilTip, t);
    colors.push(c.r, c.g, c.b);
  }
  cone.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const rock = cone.toNonIndexed(); rock.computeVertexNormals();
  const under = new THREE.Mesh(rock, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  under.position.y = -(depth + bevel) - h / 2 + 0.05;
  group.add(under);

  // trees and rocks near the rim
  const trunkMat = new THREE.MeshStandardMaterial({ color: toLinear('#A47551'), roughness: 1 });
  const leafCols = ['#7FCB8A', '#A6E3A1', '#6BBF7A', '#B9E8B0'].map((c) => new THREE.MeshStandardMaterial({ color: toLinear(c), roughness: 0.9, flatShading: true }));
  const rockMat = new THREE.MeshStandardMaterial({ color: toLinear('#B7B5C6'), roughness: 1, flatShading: true });
  const place = (minR, maxR, clear) => {
    for (let tries = 0; tries < 40; tries++) {
      const a = Math.random() * Math.PI * 2, r = R * islandEdge(a, seed) * rand(minR, maxR);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (obstacles.every((o) => Math.hypot(o.x - x, o.z - z) > o.r + clear)) return { x, z };
    }
    return null;
  };
  const trees = Math.round(R * 0.55);
  for (let i = 0; i < trees; i++) {
    const p = place(0.74, 0.92, 2.2); if (!p) continue;
    const s = rand(0.8, 1.35), t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.1 * s, 7), trunkMat); trunk.position.y = 0.55 * s; t.add(trunk);
    const m = leafCols[i % leafCols.length];
    for (let k = 0; k < 3; k++) {
      const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry((0.85 - k * 0.2) * s, 0), m);
      leaf.position.set(rand(-0.15, 0.15) * s, (1.25 + k * 0.5) * s, rand(-0.15, 0.15) * s); leaf.rotation.y = Math.random() * 3;
      t.add(leaf);
    }
    t.position.set(p.x, 0, p.z); group.add(t);
    obstacles.push({ x: p.x, z: p.z, r: 0.9 * s });
  }
  for (let i = 0; i < Math.round(R * 0.4); i++) {
    const p = place(0.35, 0.9, 1.2); if (!p) continue;
    const s = rand(0.25, 0.55), rk = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rk.position.set(p.x, s * 0.45, p.z); rk.rotation.set(Math.random(), Math.random(), Math.random()); group.add(rk);
    obstacles.push({ x: p.x, z: p.z, r: s + 0.2 });
  }
  // little flowers, just for looks
  const petal = ['#FFB3C7', '#FFE08A', '#FFFFFF', '#C9B8FF'].map((c) => new THREE.MeshStandardMaterial({ color: toLinear(c), roughness: 0.8 }));
  const stem = new THREE.MeshStandardMaterial({ color: toLinear('#5FA868') });
  for (let i = 0; i < Math.round(R * 2.5); i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R * 0.92;
    const f = new THREE.Group();
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 4), stem); st.position.y = 0.11; f.add(st);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), petal[i % petal.length]); head.position.y = 0.24; f.add(head);
    f.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); group.add(f);
  }

  // clouds drifting around the island
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92, emissive: 0xffffff, emissiveIntensity: 0.15 });
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 4; k++) {
      const s = rand(0.9, 1.8);
      const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 14, 10), cloudMat);
      puff.position.set(k * 1.3 - 2, rand(-0.3, 0.3), rand(-0.6, 0.6)); c.add(puff);
    }
    const d = { g: c, a: Math.random() * Math.PI * 2, r: R * rand(1.5, 2.3), y: rand(-R * 0.6, R * 0.3), sp: rand(0.015, 0.04) * (Math.random() < 0.5 ? -1 : 1) };
    c.scale.setScalar(rand(0.7, 1.2));
    scene.add(c); clouds.push(d);
  }

  scene.add(group);
}

/* ---------------- buds ---------------- */
const buds = [];
const FACE_W = 256, FACE_H = 175, BUD_SIZE = 1.9;

const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(20,20,40,0.35)'); gr.addColorStop(1, 'rgba(20,20,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function loadImage(src) {
  return new Promise((resolve) => {
    if (!src) return resolve(null);
    const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null); img.src = src;
  });
}

// Pick an eye color that stands out from the paint under the eyes, the same way the maker does.
function eyeColorFor(img, b) {
  if (!img) return '#15161F';
  const c = document.createElement('canvas'); c.width = c.height = 8;
  const g = c.getContext('2d', { willReadFrequently: true });
  const W = img.width, H = img.height, er = b.eyeR;
  const sx = (b.eyeRel.x - er * 1.2 - b.minX) / b.w * W, sy = (b.eyeRel.y - er * 0.7 - b.minY) / b.h * H;
  g.drawImage(img, clamp(sx, 0, W - 1), clamp(sy, 0, H - 1), Math.max(1, er * 2.4 / b.w * W), Math.max(1, er * 1.4 / b.h * H), 0, 0, 8, 8);
  const d = g.getImageData(0, 0, 8, 8).data; let r = 0, gg = 0, bb = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; bb += d[i + 2]; }
  const n = d.length / 4, lum = (0.2126 * r + 0.7152 * gg + 0.0722 * bb) / n / 255;
  return lum < 0.42 ? '#F3F4F8' : '#15161F';
}

async function makeBud(data) {
  const b = setExtents({ r: data.r.map(([x, y]) => ({ x, y })), eyeRel: data.eyeRel, eyeR: data.eyeR });
  const { geom, face } = buildMesh(b);
  const img = await loadImage(data.paint);
  const s = BUD_SIZE / Math.max(b.w, b.h);

  const paintTex = img ? new THREE.Texture(img) : null;
  if (paintTex) { paintTex.encoding = THREE.sRGBEncoding; paintTex.anisotropy = 4; paintTex.needsUpdate = true; }
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: paintTex ? 0xffffff : toLinear('#EEE8DF'), map: paintTex,
    roughness: 0.58, clearcoat: 0.3, clearcoatRoughness: 0.42, envMapIntensity: 0.55,
  });
  const fc = document.createElement('canvas'); fc.width = FACE_W; fc.height = FACE_H;
  const faceTex = new THREE.CanvasTexture(fc); faceTex.encoding = THREE.sRGBEncoding;
  const faceMat = new THREE.MeshStandardMaterial({
    map: faceTex, transparent: true, depthWrite: false, roughness: 0.55, envMapIntensity: 0.12,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });

  const root = new THREE.Group(), hop = new THREE.Group(), squash = new THREE.Group(), inner = new THREE.Group();
  root.add(hop); hop.add(squash); squash.add(inner);
  inner.scale.setScalar(s); inner.position.y = b.maxY * s;
  const bodyMesh = new THREE.Mesh(geom, bodyMat);
  const faceMesh = new THREE.Mesh(face, faceMat); faceMesh.renderOrder = 2;
  inner.add(bodyMesh, faceMesh);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; shadow.scale.set(b.w * s * 1.1, b.w * s * 0.75, 1);
  root.add(shadow);
  scene.add(root);

  const tag = document.createElement('div');
  tag.className = 'tag' + (data.isMe ? ' me' : '') + (data.friend ? ' friend' : '');
  tag.textContent = data.nickname || data.trueName;
  labels.appendChild(tag);

  const bud = {
    data, b, s, root, hop, squash, inner, stickies: [], spots: null, bodyMesh, faceMesh, shadow, faceTex, fctx: fc.getContext('2d'), faceKey: '',
    eyeCol: eyeColorFor(img, b), height: b.h * s, width: b.w * s,
    x: 0, z: 0, y: 0, vy: 0, heading: Math.random() * Math.PI * 2, state: 'idle', timer: rand(0.5, 3),
    target: null, speed: rand(0.9, 1.4), hopPhase: 0, sy: 1, syv: 0,
    blinkAt: rand(0.5, 4), blinkStart: -9, happyUntil: 0, look: null, lookUntil: 0, lx: 0, ly: 0,
    greetCooldown: rand(2, 8), partner: null, tag, bubble: null, bubbleUntil: 0,
  };
  bodyMesh.userData.bud = bud; faceMesh.userData.bud = bud;
  return bud;
}

/* ---------------- sticky notes on buds ---------------- */
const NOTE_HEX = { lemon: '#FFE98A', peach: '#FFC6A5', mint: '#BDEFCF', sky: '#BFDFFF', lilac: '#DCCBFF' };
const NOTE_COLORS = Object.keys(NOTE_HEX);
const Z = new THREE.Vector3(0, 0, 1);
const noteTextures = {};
function noteTexture(color) {
  if (noteTextures[color]) return noteTextures[color];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = NOTE_HEX[color] || NOTE_HEX.lemon; g.fillRect(0, 0, 128, 128);
  const gr = g.createLinearGradient(0, 0, 0, 128);
  gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(60,40,0,.08)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  // squiggles: there's writing on it, but you can't read it from out here
  g.strokeStyle = 'rgba(43,42,51,.42)'; g.lineWidth = 5; g.lineCap = 'round';
  for (const [y, w] of [[42, 84], [64, 72], [86, 50]]) {
    g.beginPath(); g.moveTo(24, y);
    for (let i = 0; i <= w; i += 6) g.lineTo(24 + i, y + Math.sin(i * 0.45 + y) * 2.6);
    g.stroke();
  }
  // a strip of tape across the top
  g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(40, 0, 48, 14);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return (noteTextures[color] = t);
}

// Same bud, same spots, every visit.
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}

// Places on the front of the body where a note can go: inside the outline, off the face, not too close together.
const probeRay = new THREE.Raycaster();
const probeMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
function stickySpots(bud) {
  const { b } = bud, rnd = seeded(String(bud.data.id || bud.data.trueName)), spots = [];
  const probe = new THREE.Mesh(bud.bodyMesh.geometry, probeMat);
  const size = Math.min(b.w, b.h), er = b.eyeR;
  const onFace = (x, y) => Math.abs(x - b.eyeRel.x) < er * 2.5 && Math.abs(y - b.eyeRel.y) < er * 1.8;
  for (let tries = 0; tries < 400 && spots.length < 8; tries++) {
    const loose = tries > 250;
    const x = b.minX + rnd() * b.w, y = b.minY + rnd() * b.h;
    if (!inPoly(b.r, x, y) || distToPoly(b.r, x, y) < size * (loose ? 0.1 : 0.15) || onFace(x, y)) continue;
    if (spots.some((p) => Math.hypot(p.x - x, p.y - y) < size * (loose ? 0.12 : 0.22))) continue;
    probeRay.set(new THREE.Vector3(x, -y, 1e4), new THREE.Vector3(0, 0, -1));
    const hit = probeRay.intersectObject(probe, false)[0];
    if (!hit) continue;
    const normal = hit.face.normal.clone(); if (normal.z < 0) normal.negate();
    spots.push({ x, y, point: hit.point.clone(), normal, spin: (rnd() - 0.5) * 0.8 });
  }
  return { probe, list: spots };
}

// A small square that hugs the curve of the body, so it looks stuck on rather than floating.
function stickyGeometry(bud, sp, size) {
  const g = new THREE.PlaneGeometry(1, 1, 4, 4);
  const q = new THREE.Quaternion().setFromUnitVectors(Z, sp.normal).multiply(new THREE.Quaternion().setFromAxisAngle(Z, sp.spin));
  const pos = g.attributes.position, v = new THREE.Vector3(), down = sp.normal.clone().negate();
  for (let i = 0; i < pos.count; i++) {
    v.set(pos.getX(i) * size, pos.getY(i) * size, 0).applyQuaternion(q).add(sp.point).addScaledVector(sp.normal, size);
    probeRay.set(v, down);
    const hit = probeRay.intersectObject(bud.spots.probe, false)[0];
    const p = hit ? hit.point.addScaledVector(sp.normal, size * 0.035) : v.addScaledVector(sp.normal, -size * 0.965);
    pos.setXYZ(i, p.x - sp.point.x, p.y - sp.point.y, p.z - sp.point.z);
  }
  g.computeVertexNormals();
  return g;
}

function addSticky(bud, color, tag = null, delay = -1) {
  if (!bud.spots) bud.spots = stickySpots(bud);
  const used = new Set(bud.stickies.map((st) => st.slot));
  const slot = bud.spots.list.findIndex((_, i) => !used.has(i));
  if (slot < 0) return null;   // no room left; the count on the card still tells the truth
  const sp = bud.spots.list[slot], size = 0.3 / bud.s;
  const mesh = new THREE.Mesh(stickyGeometry(bud, sp, size), new THREE.MeshStandardMaterial({
    map: noteTexture(color), roughness: 0.85, envMapIntensity: 0.3, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }));
  mesh.position.copy(sp.point);
  mesh.renderOrder = 1;
  const st = { mesh, slot, color, tag, grow: delay < 0 ? 1 : 0, wait: Math.max(0, delay), dying: false };
  mesh.scale.setScalar(st.grow || 0.001);
  bud.inner.add(mesh); bud.stickies.push(st);
  return st;
}
function removeSticky(bud, test) {
  const st = bud.stickies.find((x) => !x.dying && test(x));
  if (st) st.dying = true;
}
function animateStickies(bud, dt) {
  for (let i = bud.stickies.length - 1; i >= 0; i--) {
    const st = bud.stickies[i];
    if (st.wait > 0) { st.wait -= dt; continue; }
    if (st.dying) {
      st.grow -= dt * 4;
      if (st.grow <= 0) { bud.inner.remove(st.mesh); st.mesh.geometry.dispose(); st.mesh.material.dispose(); bud.stickies.splice(i, 1); continue; }
      st.mesh.scale.setScalar(st.grow);
    } else if (st.grow < 1) {
      st.grow = Math.min(1, st.grow + dt * 3.5);
      const t = st.grow, k = 2.2;   // ease out with a little overshoot, like slapping it on
      st.mesh.scale.setScalar(Math.max(0.001, 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2)));
    }
  }
}
// Where a sticky slot sits on screen, for the note flying onto it.
function slotOnScreen(bud) {
  if (!bud.spots) bud.spots = stickySpots(bud);
  const used = new Set(bud.stickies.map((st) => st.slot));
  const sp = bud.spots.list.find((_, i) => !used.has(i));
  const v = sp ? bud.inner.localToWorld(sp.point.clone()) : new THREE.Vector3(bud.x, bud.height * 0.5, bud.z);
  v.project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
}

function freeSpot(minDistFromOthers = 2.2, near = null, spread = WALK_R) {
  for (let tries = 0; tries < 60; tries++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * spread;
    const x = (near ? near.x : 0) + Math.cos(a) * r, z = (near ? near.z : 0) + Math.sin(a) * r;
    if (Math.hypot(x, z) > WALK_R) continue;
    if (obstacles.some((o) => Math.hypot(o.x - x, o.z - z) < o.r + 0.9)) continue;
    if (buds.some((b) => b.placed && Math.hypot(b.x - x, b.z - z) < minDistFromOthers)) continue;
    return { x, z };
  }
  return { x: 0, z: 0 };
}

function say(bud, text, ms = 1800) {
  if (!bud.bubble) { bud.bubble = document.createElement('div'); bud.bubble.className = 'bubble'; labels.appendChild(bud.bubble); }
  bud.bubble.textContent = text; bud.bubble.hidden = false;
  bud.bubble.classList.remove('pop'); void bud.bubble.offsetWidth; bud.bubble.classList.add('pop');
  bud.bubbleUntil = T + ms / 1000;
}

/* ---------------- behaviour ---------------- */
const tmp = new THREE.Vector3();

function startGreeting(a, b) {
  for (const [me, other] of [[a, b], [b, a]]) {
    me.state = 'greet'; me.partner = other; me.timer = 2.4; me.greetCooldown = rand(14, 24);
    me.happyUntil = T + 1.2; me.syv -= 0.09; me.target = null;
  }
  say(a, pick(HELLOS), 1600);
  setTimeout(() => { if (b.state === 'greet') say(b, pick(HELLOS), 1500); }, 500);
}

function updateBud(bud, dt) {
  // spring for squash and stretch (tuned at 60fps, scaled to frame time)
  const f = dt * 60;
  bud.syv = (bud.syv + (1 - bud.sy) * 0.13 * f) * Math.pow(0.8, f); bud.sy += bud.syv * f;
  bud.greetCooldown -= dt;

  if (bud.state === 'drop') {
    bud.vy -= 22 * dt; bud.y += bud.vy * dt;
    if (bud.y <= 0) {
      bud.y = 0; bud.vy = 0; bud.sy = 0.5; bud.syv = 0.04; bud.state = 'idle'; bud.timer = 2.5;
      bud.happyUntil = T + 1.6; puff(bud.x, bud.z);
      say(bud, 'hi everyone!', 2600);
      welcome(bud);
    }
  } else if (bud.state === 'idle') {
    if (!bud.held) bud.timer -= dt;
    if (T > bud.lookUntil && Math.random() < dt * 0.5) {
      const other = nearestBud(bud, 6);
      bud.look = other && Math.random() < 0.6 ? other : { x: bud.x + rand(-4, 4), z: bud.z + rand(-4, 4), y: rand(0, 2) };
      bud.lookUntil = T + rand(1, 2.6);
    }
    if (bud.timer <= 0 && !bud.held) {
      bud.target = freeSpot(1.6, Math.random() < 0.6 ? bud : null, Math.random() < 0.6 ? rand(3, 7) : WALK_R);
      bud.state = 'walk'; bud.look = null;
    }
  } else if (bud.state === 'walk') {
    const dx = bud.target.x - bud.x, dz = bud.target.z - bud.z, d = Math.hypot(dx, dz);
    if (d < 0.25) {
      bud.state = 'idle'; bud.timer = rand(1.5, 5); bud.hopPhase = 0;
      if (bud.greetOnArrive && bud.greetOnArrive.state !== 'drop') { startGreeting(bud, bud.greetOnArrive); bud.greetOnArrive = null; }
    } else {
      // steer toward the target, around trees, and away from other buds
      let mx = dx / d, mz = dz / d;
      for (const o of obstacles) {
        const ox = bud.x - o.x, oz = bud.z - o.z, od = Math.hypot(ox, oz);
        if (od < o.r + 1.3) { mx += ox / od * 1.2; mz += oz / od * 1.2; }
      }
      for (const o of buds) {
        if (o === bud || !o.placed || o.state === 'drop') continue;
        const ox = bud.x - o.x, oz = bud.z - o.z, od = Math.hypot(ox, oz) || 1;
        if (od < 1.5) { mx += ox / od * 1.4; mz += oz / od * 1.4; }
        // bumping into someone: maybe stop and say hi
        if (od < 2.1 && bud.greetCooldown <= 0 && o.greetCooldown <= 0 && o.state !== 'greet' && !o.held && !bud.held && Math.random() < 0.35) {
          startGreeting(bud, o); return;
        }
      }
      const m = Math.hypot(mx, mz) || 1;
      const sp = bud.pose ? bud.speed * 1.7 : bud.speed;
      bud.x += mx / m * sp * dt; bud.z += mz / m * sp * dt;
      const want = Math.atan2(mx, mz);
      bud.heading += angleTo(bud.heading, want) * Math.min(1, dt * 6);
      // little hops
      const before = Math.sin(bud.hopPhase);
      bud.hopPhase += dt * 8.5;
      if (Math.sin(bud.hopPhase) * before < 0) bud.syv -= 0.05 * RM;   // landing squish
    }
  } else if (bud.state === 'greet') {
    bud.timer -= dt;
    const p = bud.partner;
    if (p) bud.heading += angleTo(bud.heading, Math.atan2(p.x - bud.x, p.z - bud.z)) * Math.min(1, dt * 5);
    bud.look = p;
    if (bud.timer <= 0 && !bud.held) { bud.state = 'idle'; bud.timer = rand(1, 3); bud.partner = null; bud.look = null; }
  }

  // turn around to face whoever is looking at it (after a tap, or while you write it a note)
  if (bud.pose && photo && photo.stage !== 'pose') {
    // already snapped to face the lens; don't drift
  } else if (bud.lookCameraUntil > T && (bud.state === 'idle' || bud.state === 'greet' && !bud.partner)) {
    bud.heading += angleTo(bud.heading, Math.atan2(camera.position.x - bud.x, camera.position.z - bud.z)) * Math.min(1, dt * 5);
  }

  // stay on the island
  const rr = Math.hypot(bud.x, bud.z);
  if (rr > WALK_R + 0.5 && bud.state !== 'drop') { bud.x *= (WALK_R + 0.5) / rr; bud.z *= (WALK_R + 0.5) / rr; }

  // blinking
  if (T > bud.blinkAt) { bud.blinkStart = T; bud.blinkAt = T + (Math.random() < 0.15 ? 0.3 : rand(2.5, 6)); }

  // place it
  const hopY = bud.state === 'walk' ? Math.abs(Math.sin(bud.hopPhase)) * 0.22 * RM : 0;
  bud.root.position.set(bud.x, 0, bud.z);
  bud.hop.position.y = bud.y + hopY;
  bud.root.rotation.y = bud.heading;
  const sy = bud.sy;
  bud.squash.scale.set(2 - sy, sy, 2 - sy);
  const airborne = bud.y + hopY;
  bud.shadow.material.opacity = clamp(1 - airborne / 10, 0.15, 1);
  const sh = clamp(1 - airborne / 14, 0.3, 1);
  bud.shadow.scale.set(bud.width * 1.1 * sh, bud.width * 0.75 * sh, 1);
}

function nearestBud(bud, within) {
  let best = null, bd = within;
  for (const o of buds) {
    if (o === bud || !o.placed || o.state === 'drop') continue;
    const d = Math.hypot(o.x - bud.x, o.z - bud.z);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// When a bud arrives, a few buds nearby wander over to say hi.
function welcome(newcomer) {
  const near = buds.filter((o) => o !== newcomer && o.placed).sort((a, b) =>
    Math.hypot(a.x - newcomer.x, a.z - newcomer.z) - Math.hypot(b.x - newcomer.x, b.z - newcomer.z)).slice(0, 3);
  near.forEach((o, i) => {
    o.look = newcomer; o.lookUntil = T + 2;
    setTimeout(() => {
      const a = Math.atan2(o.z - newcomer.z, o.x - newcomer.x);
      o.target = { x: newcomer.x + Math.cos(a) * 1.9, z: newcomer.z + Math.sin(a) * 1.9 };
      o.state = 'walk'; o.greetCooldown = 0; o.greetOnArrive = newcomer;
    }, 900 + i * 700);
  });
}

// eyes: where they look, in the bud's own left/right and up/down
function lookVector(bud) {
  let tx, ty, tz;
  if (bud.look === 'camera' || (bud.lookCameraUntil && T < bud.lookCameraUntil)) { tx = camera.position.x; ty = camera.position.y; tz = camera.position.z; }
  else if (bud.look) { tx = bud.look.x; ty = (bud.look.height ? bud.look.height * 0.6 : bud.look.y || 0.8); tz = bud.look.z; }
  else return { x: 0, y: 0.1 };
  const dx = tx - bud.x, dz = tz - bud.z, dy = ty - (bud.y + bud.height * 0.6);
  // into the bud's own frame: +x is its right as you face it, +z is straight ahead
  const c = Math.cos(bud.heading), s = Math.sin(bud.heading);
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  const d = Math.hypot(lx, lz) || 1;
  return { x: clamp(lx / d * 1.3, -1, 1), y: clamp(-dy / Math.max(1.5, Math.hypot(d, dy)) * 1.4, -1, 1) };
}

function drawFace(bud) {
  const r = bud.b.eyeR, sc = FACE_W / (r * 4.4);
  const want = lookVector(bud);
  bud.lx += (want.x - bud.lx) * 0.2; bud.ly += (want.y - bud.ly) * 0.2;
  const bt = (T - bud.blinkStart) / 0.15, blink = bt >= 0 && bt < 1 ? Math.sin(bt * Math.PI) : 0;
  const happy = T < bud.happyUntil;
  const key = [Math.round(bud.lx * 20), Math.round(bud.ly * 20), Math.round(blink * 8), happy].join('|');
  if (key === bud.faceKey) return;
  bud.faceKey = key;
  const g = bud.fctx;
  g.clearRect(0, 0, FACE_W, FACE_H);
  drawEyeStyle(g, bud.data.eyes, FACE_W / 2, FACE_H / 2, r * sc, blink, happy, bud.eyeCol, { x: bud.lx, y: bud.ly });
  bud.faceTex.needsUpdate = true;
}

/* landing dust */
const puffs = [];
const puffMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true });
function puff(x, z) {
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(rand(0.12, 0.25), 8, 6), puffMat.clone());
    const a = i / 12 * Math.PI * 2 + rand(-0.2, 0.2);
    m.position.set(x, 0.15, z);
    scene.add(m);
    puffs.push({ m, vx: Math.cos(a) * rand(1.5, 3), vz: Math.sin(a) * rand(1.5, 3), vy: rand(0.6, 1.6), life: 0 });
  }
}

/* ---------------- camera: drag to orbit, scroll or pinch to zoom ---------------- */
const cam = { yaw: 0.6, pitch: 0.55, dist: 30, target: new THREE.Vector3(0, 0.8, 0), lastInput: -99, follow: null, followUntil: 0 };
const camGoal = { target: new THREE.Vector3(0, 0.8, 0), dist: 30 };
function placeCamera(dt) {
  if (cam.follow && T < cam.followUntil) {
    camGoal.target.set(cam.follow.x, cam.follow.y * 0.5 + 0.9, cam.follow.z);
  } else if (cam.follow) {
    cam.follow = null; camGoal.target.set(0, 0.8, 0); camGoal.dist = Math.max(camGoal.dist, fitDist() * 0.9);
  }
  const k = 1 - Math.pow(0.04, dt);
  cam.target.lerp(camGoal.target, k);
  cam.dist += (camGoal.dist - cam.dist) * k;
  if (camGoal.pitch != null) cam.pitch += (camGoal.pitch - cam.pitch) * k;
  if (camGoal.yaw != null) cam.yaw += angleTo(cam.yaw, camGoal.yaw) * k;
  if (T - cam.lastInput > 6 && !cam.follow) cam.yaw += dt * 0.035 * RM;
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.yaw) * cp * cam.dist,
  );
  camera.lookAt(cam.target);
  // With a card or note pad open at the bottom, slide the picture up so the bud you're looking at sits above it.
  const panel = [document.getElementById('card'), document.getElementById('composer')].find((e) => !e.hidden);
  const want = panel && cam.follow ? Math.min(panel.getBoundingClientRect().height * 0.5, innerHeight * 0.3) : 0;
  cam.shift = (cam.shift || 0) + (want - (cam.shift || 0)) * (1 - Math.pow(0.02, dt));
  if (Math.abs(cam.shift) > 0.5) camera.setViewOffset(innerWidth, innerHeight, 0, cam.shift, innerWidth, innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
}

const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: camGoal.dist }; drag = null;
  } else {
    drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: false };
  }
  cam.lastInput = T;
});
canvas.addEventListener('pointermove', (e) => {
  hoverAt(e.clientX, e.clientY);
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.lastInput = T;
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    camGoal.dist = clamp(pinch.dist * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), R * 0.7, maxDist());
    return;
  }
  if (!drag || framing()) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 4) { drag.moved = true; canvas.classList.add('dragging'); hideHint(); }
  cam.yaw = drag.yaw - dx * 0.006;
  cam.pitch = clamp(drag.pitch + dy * 0.004, 0.18, 1.25);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && !drag.moved && pointers.size === 0) clickAt(e.clientX, e.clientY);
  if (pointers.size === 0) drag = null;
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (framing()) return;
  camGoal.dist = clamp(camGoal.dist * Math.exp(e.deltaY * 0.0012), R * 0.7, maxDist());
  cam.lastInput = T; hideHint();
}, { passive: false });

/* ---------------- clicking a bud ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function budAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(buds.map((b) => b.bodyMesh), false)[0];
  return hit ? hit.object.userData.bud : null;
}
let hoverT = 0;
function hoverAt(x, y) {
  if (drag && drag.moved) return;
  if (T - hoverT < 0.06) return; hoverT = T;
  canvas.classList.toggle('over-bud', !!budAt(x, y));
}
const card = document.getElementById('card');
const cardBody = document.getElementById('cardBody');
let inbox = [];        // notes stuck on my bud: { from, fromName, fromBud, text, color }
let cardBud = null;
const nameOf = (bud) => bud.data.nickname || bud.data.trueName;
const myBud = () => buds.find((b) => b.data.isMe);

async function api(method, path, body) {
  const res = await fetch(path, {
    method, credentials: 'same-origin', cache: 'no-store',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { location.replace('/'); throw new Error('signed out'); }
  if (!res.ok) throw new Error(data.error || 'something went wrong');
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function noteEl(text, color, small = false) {
  const n = el('div', 'note' + (small ? ' small' : ''));
  n.style.background = `var(--n-${NOTE_COLORS.includes(color) ? color : 'lemon'})`;
  n.append(el('p', 'text', text));
  return n;
}

function clickAt(x, y) {
  const bud = budAt(x, y);
  if (photo) { if (photo.stage === 'pick' && bud) togglePicked(bud); return; }
  if (!bud) { if (!composing) closeCard(); return; }
  if (composing) return;
  bud.syv -= 0.12; bud.happyUntil = T + 1.1; bud.lookCameraUntil = T + 2.5;
  if (bud.state === 'walk') { bud.state = 'idle'; bud.timer = 1.6; }
  const notes = bud.data.isMe ? inbox.length : 0;
  say(bud, bud.data.isMe ? (notes ? pick(['look, notes!', 'someone wrote to us!']) : pick(['that’s me!', 'hi, it’s me!', 'hehe, hi']))
    : bud.data.friend ? pick(['hi friend!', 'oh hey, it’s you!']) : pick(POKED), 1500);
  openCard(bud);
}

function openCard(bud) {
  cardBud = bud;
  const nick = bud.data.nickname, tn = bud.data.trueName;
  document.getElementById('cardName').textContent = nick || tn;
  const owner = bud.data.isMe ? 'Your bud' : bud.data.ownerName ? `${bud.data.ownerName}’s bud` : 'Someone’s bud';
  const sub = document.getElementById('cardSub');
  sub.textContent = '';
  sub.append(owner);
  if (nick && nick !== tn) {
    sub.append(' · real name ');
    sub.append(el('span', 'tn', tn));
  }
  renderCardBody();
  card.hidden = false; hideHint();
}
function closeCard() { card.hidden = true; cardBud = null; }

function renderCardBody() {
  const bud = cardBud;
  cardBody.textContent = '';
  if (!bud) return;
  const d = bud.data;
  if (d.isMe) {
    if (!inbox.length) {
      cardBody.append(el('p', 'muted', `No notes yet. When someone sticks a note on ${nameOf(bud)} asking to be friends, you’ll read it here.`));
      return;
    }
    cardBody.append(el('p', 'muted', inbox.length === 1 ? `Someone stuck a note on ${nameOf(bud)}.` : `${inbox.length} notes are stuck on ${nameOf(bud)}.`));
    for (const n of inbox) {
      const note = noteEl(n.text, n.color);
      note.append(el('p', 'from', `from ${n.fromName}${n.fromBud ? ` (${n.fromBud}’s owner)` : ''}`));
      const r = el('div', 'row');
      const yes = el('button', 'btn primary', 'Be friends'); yes.type = 'button';
      const no = el('button', 'btn', 'Not now'); no.type = 'button';
      yes.addEventListener('click', () => answer(n, 'yes', [yes, no]));
      no.addEventListener('click', () => answer(n, 'no', [yes, no]));
      r.append(yes, no); note.append(r);
      cardBody.append(note);
    }
    return;
  }
  const others = bud.stickies.filter((st) => !st.dying && st.tag !== 'mine').length;
  if (d.friend) {
    cardBody.append(el('span', 'friends', `You and ${d.ownerName || 'them'} are friends`));
    return;
  }
  if (d.myNote && d.myNote.status === 'pending') {
    cardBody.append(el('p', 'muted', `Your note is stuck on ${nameOf(bud)}. ${d.ownerName || 'They'} will see it next time they visit.`));
    cardBody.append(noteEl(d.myNote.text, d.myNote.color, true));
    const r = el('div', 'row');
    const back = el('button', 'btn', 'Take it back'); back.type = 'button';
    back.addEventListener('click', () => takeBack(bud, back));
    r.append(back); cardBody.append(r);
    return;
  }
  if (d.myNote && d.myNote.status === 'declined' && d.myNote.retryAt > Date.now()) {
    cardBody.append(el('p', 'muted', `${d.ownerName || 'They'} said not now. Maybe later.`));
    return;
  }
  if (others) cardBody.append(el('p', 'muted', others === 1 ? 'Someone already stuck a note here.' : `${others} notes are stuck here already.`));
  if (!myBud()) {
    const a = el('a', 'btn primary', 'Make your bud to stick notes'); a.href = '/';
    cardBody.append(a);
    return;
  }
  const stick = el('button', 'btn primary', 'Stick a note'); stick.type = 'button';
  stick.addEventListener('click', () => openComposer(bud));
  const r = el('div', 'row'); r.append(stick); cardBody.append(r);
}

/* ---------------- writing a note ---------------- */
const composer = document.getElementById('composer');
const noteText = document.getElementById('noteText'), noteDraft = document.getElementById('noteDraft');
const noteError = document.getElementById('noteError'), noteSend = document.getElementById('noteSend');
const swatches = document.getElementById('swatches');
let composing = null, noteColor = 'lemon';
for (const c of NOTE_COLORS) {
  const b = el('button', 'swatch'); b.type = 'button';
  b.setAttribute('role', 'radio'); b.setAttribute('aria-label', c); b.dataset.color = c;
  b.style.background = `var(--n-${c})`;
  b.addEventListener('click', () => setNoteColor(c));
  swatches.append(b);
}
function setNoteColor(c) {
  noteColor = c;
  noteDraft.style.background = `var(--n-${c})`;
  swatches.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.color === c)));
}
noteText.addEventListener('input', () => { document.getElementById('noteCount').textContent = `${[...noteText.value].length} / 120`; });

function openComposer(bud) {
  composing = bud;
  closeCard();
  document.getElementById('composerTitle').textContent = `A note for ${nameOf(bud)}`;
  noteText.value = ''; noteText.dispatchEvent(new Event('input'));
  setNoteColor(NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)]);
  noteError.hidden = true; noteSend.disabled = false;
  composer.hidden = false;
  // the bud waits patiently, facing you, while you write
  bud.held = true; bud.state = 'idle'; bud.target = null; bud.lookCameraUntil = T + 9999; bud.happyUntil = T + 1;
  cam.follow = bud; cam.followUntil = T + 9999; camGoal.dist = Math.max(8, R * 0.7); cam.lastInput = T;
  setTimeout(() => noteText.focus(), 60);
}
function closeComposer() {
  if (!composing) return;
  const bud = composing;
  composing = null; composer.hidden = true;
  bud.held = false; bud.timer = rand(1.5, 3); bud.lookCameraUntil = T + 1;
  cam.followUntil = T + 1.5;
}
document.getElementById('noteCancel').addEventListener('click', () => { const b = composing; closeComposer(); if (b) openCard(b); });

composer.addEventListener('submit', async (e) => {
  e.preventDefault();
  const bud = composing;
  if (!bud) return;
  noteSend.disabled = true; noteError.hidden = true;
  const text = noteText.value.trim() || noteText.placeholder;
  try {
    const res = await api('POST', '/api/notes', { to: bud.data.id, text, color: noteColor });
    // the note flies off the pad and slaps onto the bud
    const from = noteDraft.getBoundingClientRect(), to = slotOnScreen(bud);
    const flyer = noteEl(text, noteColor);
    flyer.classList.add('flying');
    Object.assign(flyer.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', boxSizing: 'border-box' });
    document.body.append(flyer);
    const color = noteColor;
    closeComposer();
    cam.followUntil = T + 3;
    const dx = to.x - (from.left + from.width / 2), dy = to.y - (from.top + from.height / 2);
    const anim = flyer.animate([
      { transform: 'rotate(-2deg) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 60}px) rotate(8deg) scale(.5)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) rotate(-6deg) scale(.08)`, opacity: 0.4 },
    ], { duration: 640 * Math.max(RM, 0.5), easing: 'cubic-bezier(.45, 0, .8, .6)' });
    anim.onfinish = () => flyer.remove();
    addSticky(bud, color, 'mine', 0.6 * Math.max(RM, 0.5));
    setTimeout(() => {
      bud.syv -= 0.14; bud.happyUntil = T + 1.6;
      if (res.friends) becameFriends(bud, true);
      else say(bud, pick(['ooh, a note!', 'for me?', 'hehe, it’s sticky']), 1800);
    }, 640);
    bud.data.myNote = res.note;
    if (res.friends) bud.data.myNote = null;
  } catch (err) {
    noteError.textContent = err.message; noteError.hidden = false; noteSend.disabled = false;
  }
});

async function takeBack(bud, btn) {
  btn.disabled = true;
  try {
    await api('DELETE', `/api/notes?to=${encodeURIComponent(bud.data.id)}`);
    removeSticky(bud, (st) => st.tag === 'mine');
    bud.data.myNote = null;
    renderCardBody();
  } catch (err) { btn.disabled = false; say(bud, 'it’s stuck! try again?', 1600); }
}

async function answer(n, ans, btns) {
  btns.forEach((b) => { b.disabled = true; });
  const mine = myBud();
  try {
    await api('PATCH', '/api/notes', { from: n.from, answer: ans });
    inbox = inbox.filter((x) => x !== n);
    updateNotesPill();
    if (mine) removeSticky(mine, (st) => st.tag === n.from);
    if (ans === 'yes') {
      const theirs = buds.find((b) => b.data.id === n.from);
      if (theirs) becameFriends(theirs, false);
      if (mine) { mine.happyUntil = T + 2; mine.syv -= 0.14; say(mine, 'a new friend!', 2000); }
    } else if (mine) say(mine, 'maybe another time', 1600);
    renderCardBody();
  } catch (err) {
    btns.forEach((b) => { b.disabled = false; });
    if (mine) say(mine, 'hmm, that didn’t work. try again?', 1800);
  }
}

// Friends now: hearts on the name tag, and their bud comes over to say hi.
function becameFriends(bud, viaNote) {
  bud.data.friend = true; bud.data.myNote = null;
  bud.tag.classList.add('friend');
  removeSticky(bud, (st) => st.tag === 'mine');
  bud.happyUntil = T + 2.4; bud.syv -= 0.12;
  say(bud, viaNote ? 'we’re friends now!' : 'yay, friends!', 2200);
  const mine = myBud();
  if (mine && mine.placed && bud.placed && bud.state !== 'drop') {
    setTimeout(() => {
      const a = Math.atan2(bud.z - mine.z, bud.x - mine.x);
      bud.target = { x: mine.x + Math.cos(a) * 1.9, z: mine.z + Math.sin(a) * 1.9 };
      bud.state = 'walk'; bud.greetCooldown = 0; bud.greetOnArrive = mine;
    }, 900);
  }
  if (cardBud === bud) renderCardBody();
}

const notesPill = document.getElementById('notesPill');
function updateNotesPill() {
  notesPill.hidden = !inbox.length;
  document.getElementById('notesCount').textContent = inbox.length;
  notesPill.setAttribute('aria-label', `${inbox.length} ${inbox.length === 1 ? 'note' : 'notes'} on your bud`);
}
function showMyNotes() {
  const mine = myBud();
  if (!mine || photo) return;
  closeComposer();
  cam.follow = mine; cam.followUntil = T + 6; camGoal.dist = Math.max(9, R * 0.8);
  mine.lookCameraUntil = T + 3; mine.happyUntil = T + 1; mine.syv -= 0.1;
  if (mine.state === 'walk') { mine.state = 'idle'; mine.timer = 3; }
  openCard(mine);
}
notesPill.addEventListener('click', showMyNotes);

document.getElementById('cardClose').addEventListener('click', closeCard);
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (photo) { if (!document.getElementById('booth').hidden || photo.stage === 'pick') exitPhoto(); return; }
  if (composing) { closeComposer(); } else closeCard();
});

/* ---------------- photo booth ---------------- */
const MAX_IN_PHOTO = 6, PHOTO_W = 1600, PHOTO_H = 1200;
const photoBar = document.getElementById('photoBar'), photoText = document.getElementById('photoText');
const photoGo = document.getElementById('photoGo'), countdownEl = document.getElementById('countdown');
const booth = document.getElementById('booth'), boothImg = document.getElementById('boothImg');
const boothCaption = document.getElementById('boothCaption'), boothMsg = document.getElementById('boothMsg');
const boothPost = document.getElementById('boothPost');
let photo = null;   // { stage: 'pick' | 'pose' | 'shoot' | 'review', picked: [bud], shot, savedPitch, savedYaw }
const framing = () => photo && photo.stage !== 'pick';

function enterPhoto() {
  if (photo) return;
  closeComposer(); closeCard(); hideHint();
  photo = { stage: 'pick', picked: [], savedPitch: cam.pitch };
  const mine = myBud();
  if (mine && mine.placed && mine.state !== 'drop') togglePicked(mine, true);
  photoBar.hidden = false;
  updatePhotoBar();
}
function togglePicked(bud, quiet = false) {
  if (!bud.placed || bud.state === 'drop') return;
  const i = photo.picked.indexOf(bud);
  if (i >= 0) { photo.picked.splice(i, 1); bud.tag.classList.remove('picked'); if (!quiet) say(bud, pick(['aw', 'next time!', 'ok!']), 1000); }
  else if (photo.picked.length < MAX_IN_PHOTO) {
    photo.picked.push(bud); bud.tag.classList.add('picked'); bud.syv -= 0.1; bud.happyUntil = T + 1;
    if (!quiet) say(bud, pick(['ooh, a photo!', 'me too!', 'say cheese!', 'yay!']), 1200);
  } else say(bud, 'it’s full in there!', 1200);
  updatePhotoBar();
}
function updatePhotoBar() {
  const n = photo.picked.length;
  photoText.innerHTML = '';
  const b = el('b', null, n ? `${n} of ${MAX_IN_PHOTO} buds` : 'Pick who’s in it.');
  photoText.append(b, ' ', n ? 'Tap buds to add or remove them.' : 'Tap buds on the island to invite them into the photo.');
  photoGo.disabled = !n;
  photoGo.textContent = n ? `Line up (${n})` : 'Line up';
}

// Everyone gets a spot in a row (two rows for 5 or more), facing the camera.
function lineUp() {
  if (!photo || !photo.picked.length) return;
  photo.stage = 'pose';
  photoBar.hidden = true;
  const picked = photo.picked;
  let cx = 0, cz = 0;
  for (const b of picked) { cx += b.x; cz += b.z; }
  cx /= picked.length; cz /= picked.length;
  const lim = WALK_R * 0.5, cr = Math.hypot(cx, cz);
  if (cr > lim) { cx *= lim / cr; cz *= lim / cr; }
  // keep the photo spot clear of trees and rocks
  for (let tries = 0; tries < 30 && obstacles.some((o) => Math.hypot(o.x - cx, o.z - cz) < o.r + 3.2); tries++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * lim;
    cx = Math.cos(a) * r; cz = Math.sin(a) * r;
  }
  const yaw = cam.yaw, f = { x: Math.sin(yaw), z: Math.cos(yaw) }, rt = { x: Math.cos(yaw), z: -Math.sin(yaw) };
  const n = picked.length, rows = n > 4 ? [Math.ceil(n / 2), Math.floor(n / 2)] : [n];
  const spots = [];
  rows.forEach((count, ri) => {
    const back = rows.length > 1 && ri === 0 ? -1.0 : rows.length > 1 ? 0.9 : 0;
    for (let i = 0; i < count; i++) {
      const off = (i - (count - 1) / 2) * 2.4 + (rows.length > 1 && ri === 1 ? 1.2 * (count < rows[0] ? 1 : 0) : 0);
      spots.push({ x: cx + rt.x * off + f.x * back, z: cz + rt.z * off + f.z * back });
    }
  });
  picked.forEach((b, i) => {
    b.pose = spots[i];
    b.held = true; b.partner = null; b.greetOnArrive = null; b.look = null;
    b.state = 'walk'; b.target = spots[i]; b.lookCameraUntil = Infinity;
  });
  const width = (Math.max(...rows) - 1) * 2.4 + 2.4;
  const dist = Math.max(6, width * 1.3);
  // Nobody gets shooed away: whoever wanders past during the countdown ends up in the photo.
  photo.zone = { f };
  photo.focus = { x: cx, y: 0, z: cz };
  cam.follow = photo.focus; cam.followUntil = Infinity;
  camGoal.dist = dist; camGoal.pitch = 0.22; camGoal.yaw = yaw;
  photo.readyBy = performance.now() + 6000;   // real time, so a slow device doesn't keep everyone waiting
  photo.waiting = true;
}

// called every frame: start the countdown once everyone is in place (or it's taking too long)
function photoTick() {
  if (!photo || photo.stage !== 'pose' || !photo.waiting) return;
  const arrived = photo.picked.every((b) => b.state === 'idle' && Math.hypot(b.x - b.pose.x, b.z - b.pose.z) < 0.5);
  if (arrived || performance.now() > photo.readyBy) { photo.waiting = false; setTimeout(countdown, arrived ? 500 : 0); }
}

function countdown() {
  if (!photo) return;
  photo.stage = 'shoot';
  // anyone still wandering over just hops into place
  for (const b of photo.picked) {
    if (Math.hypot(b.x - b.pose.x, b.z - b.pose.z) > 0.5) b.syv -= 0.12;
    b.x = b.pose.x; b.z = b.pose.z;
    b.state = 'idle'; b.target = null;
  }
  const lookAt = { x: photo.focus.x + photo.zone.f.x * 100, z: photo.focus.z + photo.zone.f.z * 100 };
  for (const b of photo.picked) b.heading = Math.atan2(lookAt.x - b.x, lookAt.z - b.z);
  countdownEl.hidden = false;
  const steps = ['3', '2', '1'];
  steps.forEach((t, i) => setTimeout(() => {
    if (!photo) return;
    countdownEl.innerHTML = ''; countdownEl.append(el('span', null, t));
    if (t === '1') for (const b of photo.picked) { say(b, 'cheese!', 900); b.happyUntil = T + 2.5; b.syv -= 0.08; }
  }, i * 800));
  setTimeout(snap, steps.length * 800);
}

function snap() {
  if (!photo) return;
  countdownEl.hidden = true;
  for (const b of photo.picked) { b.happyUntil = T + 2; drawFace(b); }
  const shot = capture();
  const fl = el('div', 'flash'); document.body.append(fl); setTimeout(() => fl.remove(), 800);
  photo.shot = shot;
  photo.stage = 'review';
  boothCaption.value = '';
  boothMsg.hidden = true; boothPost.disabled = false; boothPost.textContent = 'Post to #photo-booth';
  renderPolaroid();
  booth.hidden = false;
  setTimeout(() => boothCaption.focus(), 50);
}

// Render one frame at photo size, then put the sky behind it and name tags on top.
function capture() {
  const prevView = camera.view && camera.view.enabled;
  if (prevView) camera.clearViewOffset();
  renderer.setPixelRatio(1);
  renderer.setSize(PHOTO_W, PHOTO_H, false);
  camera.aspect = PHOTO_W / PHOTO_H; camera.fov = 38; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const c = document.createElement('canvas'); c.width = PHOTO_W; c.height = PHOTO_H;
  const g = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const sky = g.createLinearGradient(0, 0, 0, PHOTO_H);
  sky.addColorStop(0, css.getPropertyValue('--sky-top').trim() || '#BFD9FF');
  sky.addColorStop(1, css.getPropertyValue('--sky-bottom').trim() || '#FBE3EF');
  g.fillStyle = sky; g.fillRect(0, 0, PHOTO_W, PHOTO_H);
  g.drawImage(renderer.domElement, 0, 0, PHOTO_W, PHOTO_H);
  // name tags
  g.font = '500 30px Fredoka, ui-rounded, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const b of photo.picked) {
    const v = new THREE.Vector3(b.x, b.hop.position.y + b.height * b.sy + 0.3, b.z).project(camera);
    if (v.z > 1) continue;
    const x = (v.x + 1) / 2 * PHOTO_W, y = (1 - v.y) / 2 * PHOTO_H;
    const name = nameOf(b), w = g.measureText(name).width + 30;
    g.fillStyle = b.data.isMe ? 'rgba(29,28,43,.92)' : 'rgba(255,255,255,.92)';
    g.beginPath(); g.roundRect(x - w / 2, y - 44, w, 44, 13); g.fill();
    g.fillStyle = b.data.isMe ? '#fff' : '#1D1C2B'; g.fillText(name, x, y - 21);
  }
  resize();
  return c;
}

function wrapLines(g, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines.slice(0, 2);
}
// The polaroid: photo on cream paper, the caption underneath in big round letters, and the date.
function renderPolaroid() {
  if (!photo || !photo.shot) return;
  const pad = 56, W = PHOTO_W + pad * 2, H = PHOTO_H + pad + 300;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#FBF8F2'; g.fillRect(0, 0, W, H);
  g.drawImage(photo.shot, pad, pad);
  g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(pad, pad, PHOTO_W, PHOTO_H);
  const cap = boothCaption.value.trim();
  g.textAlign = 'center'; g.fillStyle = '#2B2A33';
  const base = PHOTO_H + pad;
  if (cap) {
    g.font = '500 58px Fredoka, ui-rounded, system-ui, sans-serif';
    const lines = wrapLines(g, cap, PHOTO_W - 80);
    lines.forEach((l, i) => g.fillText(l, W / 2, base + 105 + i * 68 - (lines.length - 1) * 30));
  }
  g.font = '400 32px Fredoka, ui-rounded, system-ui, sans-serif'; g.fillStyle = 'rgba(43,42,51,.55)';
  const date = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  g.fillText(`bud island · ${date}`, W / 2, H - 52);
  const url = c.toDataURL('image/jpeg', 0.88);
  photo.jpeg = url;
  boothImg.src = url;
  boothImg.alt = `Photo of ${photo.picked.map(nameOf).join(', ')} on bud island${cap ? `: ${cap}` : ''}`;
  document.getElementById('boothSave').href = url;
}
let capTimer = 0;
boothCaption.addEventListener('input', () => { clearTimeout(capTimer); capTimer = setTimeout(renderPolaroid, 180); });
boothCaption.addEventListener('keydown', (e) => { if (e.key === 'Enter') boothPost.click(); });

boothPost.addEventListener('click', async () => {
  if (!photo || boothPost.disabled) return;
  clearTimeout(capTimer); renderPolaroid();
  boothPost.disabled = true; boothPost.textContent = 'Posting…'; boothMsg.hidden = true;
  try {
    const res = await api('POST', '/api/photos', { image: photo.jpeg, caption: boothCaption.value.trim(), buds: photo.picked.map((b) => b.data.id) });
    boothMsg.className = 'msg'; boothMsg.textContent = '';
    const a = el('a', null, 'See it in Discord'); a.href = res.url; a.target = '_blank'; a.rel = 'noopener';
    boothMsg.append('Posted to #photo-booth. ', a);
    boothMsg.hidden = false;
    boothPost.textContent = 'Done';
    boothPost.disabled = false;
    boothPost.onclick = () => { boothPost.onclick = null; exitPhoto(); };
    for (const b of photo.picked) { b.syv -= 0.12; b.happyUntil = T + 1.5; }
  } catch (err) {
    boothMsg.className = 'msg err'; boothMsg.textContent = err.message; boothMsg.hidden = false;
    boothPost.disabled = false; boothPost.textContent = 'Post to #photo-booth';
  }
});
document.getElementById('boothRetake').addEventListener('click', () => {
  if (!photo) return;
  booth.hidden = true; boothPost.onclick = null;
  photo.stage = 'pose'; photo.waiting = false;
  setTimeout(countdown, 400);
});
document.getElementById('photoBtn').addEventListener('click', () => (photo ? exitPhoto() : enterPhoto()));
document.getElementById('photoCancel').addEventListener('click', exitPhoto);
photoGo.addEventListener('click', lineUp);

function exitPhoto() {
  if (!photo) return;
  for (const b of photo.picked) {
    b.tag.classList.remove('picked');
    b.pose = null; b.held = false; b.lookCameraUntil = T + 1; b.timer = rand(1, 3);
    if (b.state === 'walk') { b.state = 'idle'; b.target = null; }
  }
  cam.followUntil = T; camGoal.pitch = null; camGoal.yaw = null;
  cam.pitch = Math.max(cam.pitch, 0.3);
  if (photo.savedPitch != null) camGoal.pitch = photo.savedPitch;
  setTimeout(() => { if (!photo) camGoal.pitch = null; }, 1500);
  photoBar.hidden = true; booth.hidden = true; countdownEl.hidden = true;
  boothPost.onclick = null;
  photo.zone = null;
  photo = null;
}

const hint = document.getElementById('hint');
function hideHint() { hint.classList.add('gone'); }
setTimeout(hideHint, 9000);

/* ---------------- labels and bubbles follow the buds on screen ---------------- */
function placeLabels() {
  for (const bud of buds) {
    tmp.set(bud.x, bud.y + bud.hop.position.y - bud.y + bud.height * bud.sy + 0.35, bud.z).project(camera);
    const visible = tmp.z < 1 && bud.placed;
    const sx = (tmp.x + 1) / 2 * innerWidth, sy = (1 - tmp.y) / 2 * innerHeight;
    const dist = camera.position.distanceTo(bud.root.position);
    const scale = clamp(22 / dist, 0.55, 1.15);
    bud.tag.hidden = !visible;
    if (visible) bud.tag.style.transform = `translate(${sx - bud.tag.offsetWidth / 2}px, ${sy - bud.tag.offsetHeight}px) scale(${scale.toFixed(3)})`;
    if (bud.bubble && !bud.bubble.hidden) {
      if (T > bud.bubbleUntil || !visible) bud.bubble.hidden = true;
      else bud.bubble.style.transform = `translate(${sx - bud.bubble.offsetWidth / 2}px, ${sy - bud.tag.offsetHeight * scale - bud.bubble.offsetHeight - 12}px) scale(${scale.toFixed(3)})`;
    }
  }
}

/* ---------------- loop ---------------- */
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  setClock(T);
  for (const bud of buds) if (bud.placed) { updateBud(bud, dt); drawFace(bud); animateStickies(bud, dt); }
  photoTick();
  for (const c of clouds) {
    c.a += c.sp * dt;
    c.g.position.set(Math.cos(c.a) * c.r, c.y + Math.sin(T * 0.2 + c.a) * 0.4, Math.sin(c.a) * c.r);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life += dt;
    p.m.position.x += p.vx * dt; p.m.position.z += p.vz * dt; p.m.position.y += p.vy * dt;
    p.vx *= 0.92; p.vz *= 0.92; p.vy *= 0.9;
    p.m.material.opacity = Math.max(0, 1 - p.life / 0.9); p.m.scale.setScalar(1 + p.life * 1.5);
    if (p.life > 0.9) { scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); puffs.splice(i, 1); }
  }
  placeCamera(dt);
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // pull back on narrow screens so the whole island fits
  camera.fov = innerWidth < innerHeight ? 50 : 38;
  camera.updateProjectionMatrix();
}
// how far back the camera sits to see the whole island, wide or narrow screen
function fitDist() {
  const half = Math.min(camera.fov / 2, Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect) * 180 / Math.PI);
  return Math.max(R * 2.3, R * 1.12 / Math.tan(half * Math.PI / 180));
}
const maxDist = () => Math.max(R * 3.4, fitDist() * 1.3);
addEventListener('resize', resize);

/* ---------------- start ---------------- */
function showCenter(title, text, linkText, href = '/') {
  document.getElementById('centerTitle').textContent = title;
  document.getElementById('centerText').textContent = text;
  const a = document.getElementById('centerLink'); a.textContent = linkText; a.href = href;
  document.getElementById('center').hidden = false;
}

(async () => {
  resize();
  let world;
  try {
    const res = await fetch('/api/world', { credentials: 'same-origin', cache: 'no-store' });
    if (res.status === 401) { location.replace('/'); return; }
    if (!res.ok) throw new Error(String(res.status));
    world = await res.json();
  } catch (e) {
    buildIsland(0); requestAnimationFrame(frame);
    showCenter('The island is hiding', 'I couldn’t load the buds just now. Try again in a moment.', 'Back to my bud');
    return;
  }

  document.getElementById('whoName').textContent = world.me.name;
  document.getElementById('whoAvatar').src = world.me.avatarUrl;
  document.getElementById('who').hidden = false;

  buildIsland(world.buds.length);
  const n = world.buds.length;
  document.getElementById('titleSub').textContent = n === 1 ? 'Just one bud here so far.' : `${n} buds live here.`;
  cam.dist = camGoal.dist = fitDist();

  inbox = world.inbox || [];
  for (const d of world.buds) {
    try { buds.push(await makeBud(d)); } catch (e) { console.error('could not build bud', d.id, e); }
  }
  const mine = buds.find((b) => b.data.isMe);
  if (mine) document.getElementById('findMe').hidden = false;
  if (buds.length) document.getElementById('photoBtn').hidden = false;

  // the notes already stuck on everyone: yours on your own bud are the ones you can read
  for (const bud of buds) {
    try {
      if (bud.data.isMe) { for (const n of inbox) addSticky(bud, n.color, n.from); continue; }
      const colors = [...(bud.data.stickies || [])];
      const my = bud.data.myNote;
      if (my && my.status === 'pending') { const i = colors.indexOf(my.color); if (i >= 0) colors.splice(i, 1); }
      for (const c of colors) addSticky(bud, c);
      if (my && my.status === 'pending') addSticky(bud, my.color, 'mine');
    } catch (e) { console.error('could not stick notes on', bud.data.id, e); }
  }
  updateNotesPill();

  // everyone else starts somewhere on the island
  for (const bud of buds) {
    if (DROP && bud === mine) continue;
    const p = freeSpot(2.4); bud.x = p.x; bud.z = p.z; bud.placed = true;
  }

  if (!buds.length) {
    showCenter('No buds here yet', 'Make the first one and it’ll be waiting here when your friends arrive.', 'Make my bud');
  } else if (DROP && mine) {
    // your bud falls in from the sky
    const p = freeSpot(3, null, WALK_R * 0.45);
    Object.assign(mine, { x: p.x, z: p.z, y: 18, vy: 0, state: 'drop', placed: true, heading: Math.atan2(camera.position.x - p.x, camera.position.z - p.z) });
    cam.yaw = Math.atan2(p.x, p.z) + 0.5;
    cam.follow = mine; cam.followUntil = T + 7;
    camGoal.target.set(p.x, 1, p.z); cam.target.set(p.x, 6, p.z);
    camGoal.dist = Math.max(10, R * 1.1); cam.dist = camGoal.dist + 6;
    document.getElementById('titleText').textContent = `Welcome, ${mine.data.nickname || mine.data.trueName}`;
    document.getElementById('titleSub').textContent = 'Your bud just moved in.';
    setTimeout(() => { mine.heading = Math.atan2(camera.position.x - mine.x, camera.position.z - mine.z); say(mine, 'wheeeee!', 1500); }, 200);
  }
  if (OPEN_NOTES && mine && !DROP) setTimeout(showMyNotes, 600);
  else if (inbox.length && mine && !DROP) setTimeout(() => say(mine, inbox.length === 1 ? 'psst, someone left us a note' : `psst, we have ${inbox.length} notes`, 2600), 1800);
  setTimeout(() => document.getElementById('title').classList.add('fade'), DROP ? 9000 : 6000);
  requestAnimationFrame(frame);
})();

document.getElementById('findMe').addEventListener('click', () => {
  const mine = buds.find((b) => b.data.isMe);
  if (!mine) return;
  cam.follow = mine; cam.followUntil = T + 6;
  camGoal.dist = Math.max(9, R * 0.9);
  mine.lookCameraUntil = T + 3; mine.happyUntil = T + 1; mine.syv -= 0.1;
  say(mine, 'over here!', 1600);
});
</script>
