<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* no zooming on phones (see /js/nozoom.js) */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
</style>
<script src="/js/nozoom.js"></script>
<title>At home · the buddie system</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<meta name="description" content="Inside a bud's home: doodles on the walls, finds on the shelves.">
<meta name="theme-color" content="#A9D8F3">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink: #1D1C2B; --soft: #5F5868; --glass: rgba(255,253,248,.82); --sky1: #A9D8F3; --sky2: #EAF5EC; --head: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif; --body: 'Nunito', system-ui, sans-serif; }
body[data-tod="golden"] { --sky1: #F4B183; --sky2: #FCE6C6; }
body[data-tod="night"] { --sky1: #1B2040; --sky2: #414674; --ink: #F3F1FA; --soft: #C9C6DC; --glass: rgba(40,42,74,.78); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); color: var(--ink); background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 62%, var(--sky2) 100%); user-select: none; -webkit-user-select: none; transition: background .4s; }
/* soft clouds by day, stars by night: one layer of dots and blobs behind the room */
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background:
  radial-gradient(60px 22px at 18% 16%, rgba(255,255,255,.75), transparent 70%), radial-gradient(90px 28px at 30% 19%, rgba(255,255,255,.6), transparent 70%),
  radial-gradient(80px 24px at 78% 11%, rgba(255,255,255,.7), transparent 70%), radial-gradient(50px 18px at 66% 14%, rgba(255,255,255,.55), transparent 70%); }
body[data-tod="night"]::before { background:
  radial-gradient(1.6px 1.6px at 12% 9%, #fff, transparent), radial-gradient(1.4px 1.4px at 27% 21%, #fff, transparent), radial-gradient(1.8px 1.8px at 44% 7%, #fff, transparent),
  radial-gradient(1.3px 1.3px at 61% 17%, #fff, transparent), radial-gradient(1.7px 1.7px at 79% 10%, #fff, transparent), radial-gradient(1.3px 1.3px at 91% 24%, #fff, transparent),
  radial-gradient(1.4px 1.4px at 8% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 53% 27%, #fff, transparent), radial-gradient(26px 26px at 84% 15%, #FFF3C9 46%, transparent 52%); }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.top { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px); display: flex; align-items: center; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 6px 18px -10px rgba(29,28,43,.55), inset 0 0 0 1px rgba(255,255,255,.35); border-radius: 999px; color: var(--ink); }
.back { width: 46px; height: 46px; flex: none; display: grid; place-items: center; text-decoration: none; }
.back svg { width: 22px; height: 22px; }
.where { padding: 7px 18px 8px; min-width: 0; }
.where h1 { font-family: var(--head); font-weight: 700; font-size: 18px; line-height: 1.15; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where p { margin: 0; font-weight: 700; font-size: 12.5px; color: var(--soft); line-height: 1.2; }
#hint { position: fixed; z-index: 3; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translate(-50%, 12px); width: max-content; max-width: calc(100% - 32px); padding: 11px 18px; text-align: center; font-weight: 800; font-size: 14.5px; line-height: 1.3; text-wrap: balance; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; border-radius: 22px; }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(40,28,24,.38); padding: 18px; animation: fade .18s ease-out; }
.sheet .box { position: relative; background: #FFFDF8; color: #1D1C2B; border-radius: 26px; padding: 22px 18px 18px; max-width: 420px; width: 100%; max-height: 100%; overflow: auto; text-align: center; display: grid; gap: 12px; box-shadow: 0 24px 50px -20px rgba(29,28,43,.65); animation: rise .26s cubic-bezier(.2,.9,.3,1.15); }
.sheet h2 { font-family: var(--head); font-weight: 700; font-size: 22px; margin: 0 34px; }
.sheet p { margin: 0; color: #6B6170; font-weight: 700; font-size: 14px; line-height: 1.45; }
.sheet p:empty { display: none; }
#sBody { display: grid; gap: 12px; justify-items: center; }
#sBody:empty { display: none; }
.big { width: min(250px, 64vw); aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 10px solid #8A5A3C; background: #fff; box-shadow: 0 10px 22px -12px rgba(29,28,43,.6), inset 0 0 0 2px rgba(0,0,0,.08); transform: rotate(-1.2deg); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.pick { font: inherit; color: #1D1C2B; background: #F5EEE1; border: 0; border-radius: 16px; padding: 7px 7px 6px; display: grid; gap: 4px; justify-items: center; cursor: pointer; transition: transform .12s; }
.pick:active { transform: scale(.95); }
.pick img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.pick small { font-weight: 800; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick small::before { content: 'from '; font-weight: 700; color: #8A8090; }
.pick .ico { font-size: 36px; line-height: 1.35; }
.pick.find small { white-space: normal; line-height: 1.15; }
.pick.find small::before { content: none; }
.btn { font: inherit; font-family: var(--head); font-weight: 700; font-size: 17px; color: #fff; background: #1D1C2B; border: 0; border-radius: 999px; padding: 12px 22px; text-decoration: none; display: inline-block; cursor: pointer; }
.btn.quiet { background: #EFE7DA; color: #1D1C2B; font-size: 15.5px; }
#sClose { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; padding: 0; font-size: 0; display: grid; place-items: center; }
#sClose::before { content: '\00d7'; font-size: 24px; line-height: 1; font-family: var(--body); font-weight: 700; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
/* on a phone the sheet comes up from the bottom, where your thumb is */
@media (max-width: 560px) {
  .sheet { place-items: end center; padding: 0; }
  .sheet .box { max-width: none; border-radius: 28px 28px 0 0; padding: 26px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); max-height: 82dvh; }
  .sheet .box::before { content: ''; position: absolute; top: 9px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: #DDD3C2; }
  #gate { place-items: center; padding: 18px; } #gate .box { border-radius: 26px; }
  #gate .box::before { content: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .sheet .box { animation: none; } #hint { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="top">
  <a class="pill back" href="/world" aria-label="Back outside"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="pill where"><h1 id="title">A home</h1><p id="sub"></p></div>
</div>
<div id="hint" class="pill" aria-live="polite"></div>
<div class="sheet" id="gate"><div class="box"><h2>Knock knock…</h2><p id="gateText">Opening the door.</p><div id="gateBtns"></div></div></div>
<div class="sheet" id="sheet" hidden><div class="box"><h2 id="sTitle"></h2><div id="sBody"></div><p id="sNote"></p><button type="button" class="btn quiet" id="sClose" aria-label="Close">Close</button></div></div>
<script src="/js/sound.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const gate = (text, btns = []) => { $('gate').hidden = false; $('gateText').textContent = text; $('gateBtns').textContent = ''; for (const [label, href] of btns) { const a = document.createElement('a'); a.className = 'btn'; a.textContent = label; a.href = href; $('gateBtns').append(a); } };
async function call(url, body) {
  const res = await fetch(url, body ? { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { credentials: 'same-origin', cache: 'no-store' });
  if (res.status === 401) { location.href = '/api/auth/login?next=' + encodeURIComponent(location.pathname + location.search); await new Promise(() => {}); }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw Object.assign(new Error(data.error || `error ${res.status}`), { status: res.status });
  return data;
}
try {
  const q = new URLSearchParams(location.search), of = q.get('of') || 'me';
  const { runHouse, KINDS } = await import('/js/house-room.js');
  const kind = KINDS.includes(q.get('k')) ? q.get('k') : 'cottage';
  let who = of;
  if (of === 'me') { const w = await call('/api/world?away=1'); who = w.me.id; }
  const data = await call('/api/world?house=' + encodeURIComponent(who));
  for (const src of ['/js/vendor/three.r128.min.js', '/js/vendor/delaunator-5.0.1.min.js']) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => no(new Error('couldn’t load the 3D picture')); document.head.append(sc); });
  window.__house = await runHouse(data, kind, (house) => call('/api/world', { house }));
  $('gate').hidden = true;
} catch (e) {
  console.error(e);
  gate(e.status === 404 ? 'Nobody lives there.' : `The door’s stuck (${e.message}).`, [['Back outside', '/world']]);
}
</script>
</body>
</html>
