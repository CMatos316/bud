<style>
/* Prankster: the host bud up top, everyone's buds in the middle (tap one to pick), and what to do at the

}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }

  background: linear-gradient(180deg, var(--day-top), var(--day-bottom)); transition: background 1s; }

  background: linear-gradient(180deg, var(--night-top), var(--night-bottom)); color-scheme: dark; }
.app { height: 100%; display: grid; grid-template-rows: auto auto auto 1fr auto; max-width: 900px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

.bubble::before { content: ""; position: absolute; left: -7px; top: 16px; width: 12px; height: 12px; background: inherit; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble .kicker { margin: 0; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.pl { position: relative; display: grid; justify-items: center; border: 0; background: none; color: inherit; font: inherit; padding: 4px 2px; border-radius: 16px; cursor: default; transition: transform .2s, opacity .4s; }
.pl canvas { width: 66px; height: 66px; display: block; }
.pl .name { margin-top: 2px; font-size: 12.5px; font-weight: 600; background: var(--card); border: 1px solid var(--line); padding: 1px 8px; border-radius: 999px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl.me .name { background: var(--ink); color: var(--card); }
.pl.can { cursor: pointer; }
.pl.can:hover { transform: translateY(-3px); }
.pl.picked { background: rgba(255, 111, 145, .18); outline: 3px solid var(--pick); }

.pl .tag.team { background: var(--bad); color: #fff; }
.pl .tag.done { background: var(--good); color: #fff; }
.pl .tag.role { background: var(--paper); color: #2B2A3A; border: 1px solid rgba(0,0,0,.1); }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 18px 40px -26px var(--shadow); margin: 6px 0 10px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

.panel p { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; line-height: 1.45; }

.roles .ic { font-size: 20px; width: 26px; text-align: center; flex: none; }

.rolecard { text-align: center; padding: 22px 16px; }
.rolecard .big { font-size: 56px; line-height: 1; margin-bottom: 6px; }
.rolecard h2 { font-size: 30px; }
.rolecard.pranksters { background: linear-gradient(160deg, rgba(232,80,91,.25), var(--card)); }
.msg { font-size: 13.5px; color: var(--bad); margin: 6px 0 0; min-height: 1em; text-align: center; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.center { display: grid; place-items: center; text-align: center; height: 100%; padding: 16px; }
.center .panel { max-width: 420px; }

@media (min-width: 640px) and (min-height: 600px) {
  .crowd { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
  .pl canvas { width: 84px; height: 84px; }
}
@media (max-height: 520px) {
  .app { padding-top: 6px; padding-bottom: 6px; }
  .host { margin: 4px 0; } .host img { width: 34px; height: 34px; }
  .bubble { padding: 5px 12px; min-height: 0; } .bubble .say { font-size: 15px; }
  .crowd { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  .pl canvas { width: 46px; height: 46px; }
  .panel { padding: 10px 14px; } .panel h2 { font-size: 20px; } .panel p { font-size: 13px; margin-bottom: 6px; }
  .rolecard .big { font-size: 40px; } .rolecard { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .pl, .pl .sign { transition: none; } .host img.talk { animation: none; } }
</style>

<body>
<div class="app" id="app" hidden>
  <header class="top">
    <a class="brand" href="/world" id="brand"><img src="/img/favicon.svg" alt=""><span>Prankster</span></a>
    <span class="day" id="dayLabel"></span>
    <button class="pill" id="gamesBtn" type="button" hidden>Games</button>
    <button class="icon-btn" id="soundBtn" type="button"></button>
  </header>
  <div class="host" id="host">
    <img src="/img/favicon.svg" alt="" id="hostImg">

  </div>

</div>

<script type="module">
import { drawEyeStyle } from '/js/bud-core.js';

const APP_ID = '1563361979316445264';
const params = new URLSearchParams(location.search);
const IN_DISCORD = params.has('frame_id') && params.has('instance_id');
const S = window.BudSound || { play() {}, bindToggle() {}, onChange() {}, muted: true };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const ROLE_ICON = { prankster: '😈', snoop: '🔍', guardian: '🛡️', islander: '🌴' };
const ROLE_NAME = { prankster: 'Prankster', snoop: 'Snoop', guardian: 'Guardian', islander: 'Islander' };

let sdk = null, sessionToken = null, room = null, view = null, skew = 0, me = null, busy = false;
const buds = {}, asking = new Set(), tiles = new Map();

async function api(method, path, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (sessionToken) headers['x-bud-session'] = sessionToken;
  const t0 = Date.now();
  const res = await fetch(path, { method, headers, credentials: 'same-origin', cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw Object.assign(new Error(data.error || 'something went wrong'), { status: res.status });
  if (data.now) skew = data.now - (t0 + Date.now()) / 2;
  return data;
}
const now = () => Date.now() + skew;
function openLink(url) { if (sdk) sdk.commands.openExternalLink({ url: new URL(url, 'https://bud.oqw.one').href }).catch(() => {}); else location.href = url; }

/* ---------- drawing buds flat (same outline, paint and eyes as on the island) ---------- */
const paintCache = new Map();
function loadPaint(src) {
  if (!src) return Promise.resolve(null);
  if (!paintCache.has(src)) paintCache.set(src, new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }));
  return paintCache.get(src);
}
function eyeColor(img, b, box) {
  if (!img) return '#15161F';
  const c = document.createElement('canvas'); c.width = c.height = 6;
  const g = c.getContext('2d', { willReadFrequently: true }), W = img.width, H = img.height, er = b.eyeR;
  const sx = (b.eyeRel.x - er * 1.2 - box.x0) / box.w * W, sy = (b.eyeRel.y - er * 0.7 - box.y0) / box.h * H;
  g.drawImage(img, Math.max(0, sx), Math.max(0, sy), Math.max(1, er * 2.4 / box.w * W), Math.max(1, er * 1.4 / box.h * H), 0, 0, 6, 6);
  const d = g.getImageData(0, 0, 6, 6).data; let l = 0;
  for (let i = 0; i < d.length; i += 4) l += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  return l / (d.length / 4) / 255 < 0.42 ? '#F3F4F8' : '#15161F';
}
async function drawBud(canvas, b, { happy = false, sleepy = false } = {}) {
  const dpr = Math.min(2, devicePixelRatio || 1), size = canvas.clientWidth || 66;
  canvas.width = canvas.height = Math.round(size * dpr);
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, size, size);
  if (!b || !b.r || b.r.length < 8) {
    g.fillStyle = '#D8D6E6'; g.beginPath(); g.ellipse(size / 2, size * 0.58, size * 0.38, size * 0.33, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#5E5D75'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(size / 2 + s * size * 0.1, size * 0.55, size * 0.035, size * 0.06, 0, 0, Math.PI * 2); g.fill(); }
    return;
  }
  const pts = b.r.map((p) => ({ x: p[0], y: p[1] }));
  const box = pts.reduce((m, p) => ({ x0: Math.min(m.x0, p.x), y0: Math.min(m.y0, p.y), x1: Math.max(m.x1, p.x), y1: Math.max(m.y1, p.y) }), { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });
  box.w = box.x1 - box.x0; box.h = box.y1 - box.y0;
  const k = (size * 0.9) / Math.max(box.w, box.h), ox = (size - box.w * k) / 2 - box.x0 * k, oy = size - 2 - box.h * k - box.y0 * k;
  const X = (x) => ox + x * k, Y = (y) => oy + y * k;
  const path = () => { g.beginPath(); pts.forEach((p, i) => { const n = pts[(i + 1) % pts.length]; if (!i) g.moveTo(X((pts[pts.length - 1].x + p.x) / 2), Y((pts[pts.length - 1].y + p.y) / 2)); g.quadraticCurveTo(X(p.x), Y(p.y), X((p.x + n.x) / 2), Y((p.y + n.y) / 2)); }); g.closePath(); };
  g.fillStyle = 'rgba(30,25,60,.16)'; g.beginPath(); g.ellipse(size / 2, size - 3, box.w * k * 0.36, 3.5, 0, 0, Math.PI * 2); g.fill();
  const img = await loadPaint(b.paint);
  g.save(); path(); g.clip();
  g.fillStyle = '#E8E6F2'; g.fillRect(0, 0, size, size);
  if (img) g.drawImage(img, X(box.x0), Y(box.y0), box.w * k, box.h * k);
  const hi = g.createRadialGradient(X(box.x0 + box.w * 0.3), Y(box.y0 + box.h * 0.22), 2, X(box.x0 + box.w * 0.45), Y(box.y0 + box.h * 0.5), box.w * k * 0.75);

}
async function ensureBuds(ids) {
  const want = ids.filter((id) => !(id in buds) && !asking.has(id));
  if (!want.length) return;
  want.forEach((id) => asking.add(id));
  try {
    const { buds: got } = await api('GET', `/api/game?room=${encodeURIComponent(room)}&buds=${want.join(',')}`);
    for (const id of want) { buds[id] = got[id] || null; const t = tiles.get(id); if (t) t.drawn = null; }
    renderCrowd();
  } catch (e) { want.forEach((id) => asking.delete(id)); }
}

/* ---------- who's who on screen ---------- */
const nameOf = (id) => (id === me ? 'you' : (view.players.find((p) => p.id === id) || {}).name || 'someone');
const alive = (id) => (view.players.find((p) => p.id === id) || {}).alive;
function myAction() {
  // what tapping a bud does right now, or null
  const v = view;
  if (v.phase !== 'play' || !v.alive) return null;
  if (v.stage === 'night' && ['prankster', 'snoop', 'guardian'].includes(v.role)) return 'night';
  if (v.stage === 'vote') return 'vote';
  return null;
}
function canTarget(id) {
  const v = view, a = myAction();
  if (!a || !alive(id)) return false;
  if (a === 'night') {
    if (v.role === 'prankster') return !(v.team || []).includes(id);
    if (v.role === 'snoop') return id !== me;
    if (v.role === 'guardian') return id !== v.cantGuard;
  }
  return a === 'vote';
}
function renderCrowd() {
  const v = view, crowd = $('crowd'), list = v.phase === 'lobby' ? v.players : v.players.filter((p) => p.playing);   // late joiners watch
  const verdict = v.stage === 'verdict' ? v.events.at(-1) : null;
  const tally = {};
  if (verdict && verdict.votes) for (const t of Object.values(verdict.votes)) if (t !== 'skip') tally[t] = (tally[t] || 0) + 1;
  for (const p of list) {
    let t = tiles.get(p.id);
    if (!t) {
      const root = el('button', 'pl'); root.type = 'button';
      const canvas = el('canvas'); canvas.setAttribute('aria-hidden', 'true');
      const name = el('span', 'name'), tag = el('span', 'tag'), sign = el('span', 'sign'), votes = el('span', 'votes');
      tag.hidden = true; votes.hidden = true;
      root.append(sign, canvas, name, tag, votes);
      root.addEventListener('click', () => tapBud(p.id));
      t = { root, canvas, name, tag, sign, votes, drawn: null };
      tiles.set(p.id, t);
    }
    if (t.root.parentNode !== crowd) crowd.append(t.root);
    t.root.classList.toggle('me', p.id === me);
    t.name.textContent = p.id === me ? 'you' : p.name || 'someone';
    const ghost = p.playing && p.alive === false;
    t.root.classList.toggle('ghost', ghost);
    t.root.classList.toggle('away', !p.here && !ghost);
    const can = canTarget(p.id);
    t.root.classList.toggle('can', can);
    t.root.disabled = !can;
    const chosen = v.stage === 'night' ? v.myPick : v.stage === 'vote' ? v.myVote : null;
    t.root.classList.toggle('picked', chosen === p.id);
    // little tags: fellow Pranksters (only Pranksters see these), who has voted, everyone's role at the end
    let tag = null, cls = '';
    if (v.phase === 'done' && v.roles?.[p.id]) { tag = `${ROLE_ICON[v.roles[p.id]]} ${ROLE_NAME[v.roles[p.id]]}`; cls = 'role'; }
    else if (v.role === 'prankster' && (v.team || []).includes(p.id) && p.id !== me) { tag = '😈 team'; cls = 'team'; }
    else if (v.stage === 'vote' && (v.voted || []).includes(p.id)) { tag = '✓ voted'; cls = 'done'; }
    else if (v.stage === 'day' && (v.ready || []).includes(p.id)) { tag = '✓ ready'; cls = 'done'; }
    else if (ghost) {
      const e = v.events.find((x) => x.who === p.id && (x.kind === 'pranked' || x.kind === 'out'));
      if (e) { tag = `${ROLE_ICON[e.role]} ${ROLE_NAME[e.role]}`; cls = 'role'; }
    }
    t.tag.hidden = !tag; if (tag) { t.tag.textContent = tag; t.tag.className = 'tag ' + cls; }
    // the voting signs flip up at the verdict
    const myVoteSign = verdict && verdict.votes ? verdict.votes[p.id] : undefined;
    if (myVoteSign !== undefined) { t.sign.textContent = myVoteSign === 'skip' ? 'skip' : nameOf(myVoteSign); }
    t.sign.classList.toggle('up', myVoteSign !== undefined);
    t.votes.hidden = !tally[p.id]; t.votes.textContent = tally[p.id] || '';
    const sleepy = v.stage === 'night' && p.id !== me && !ghost;
    const happy = v.phase === 'done' && v.roles && teamWon(v.roles[p.id]);
    const key = `${p.id in buds}|${sleepy}|${happy}`;
    if (t.drawn !== key) { t.drawn = key; drawBud(t.canvas, buds[p.id], { sleepy, happy }); }
  }
  for (const [id, t] of tiles) if (!list.some((p) => p.id === id)) { t.root.remove(); tiles.delete(id); }
}
const teamWon = (role) => view.winner && ((view.winner === 'island') === (role !== 'prankster'));

/* ---------- each stage ---------- */
let lastKey = '';
function hostSays(kicker, text) {
  if ($('say').textContent !== text) { const h = $('hostImg'); h.classList.remove('talk'); void h.offsetWidth; h.classList.add('talk'); }
  $('kicker').textContent = kicker; $('say').textContent = text;
}
function render() {
  const v = view; if (!v) return;
  $('gate').hidden = true; $('app').hidden = false;
  document.body.classList.toggle('night', v.stage === 'night');
  $('dayLabel').textContent = v.phase === 'play' ? `${v.stage === 'night' ? 'night' : 'day'} ${v.day}` : '';
  const key = `${v.phase}|${v.stage}|${v.day}|${v.game}`, changed = key !== lastKey; lastKey = key;
  $('timer').hidden = !(v.phase === 'play' && v.stageEnds && ['night', 'day', 'vote'].includes(v.stage));
  const panel = $('panelArea'), bar = $('bar');
  if (changed) { panel.textContent = ''; }
  bar.textContent = '';
  if (v.phase === 'lobby') renderLobby(panel, bar, changed);
  else if (v.phase === 'done') renderDone(panel, bar, changed);
  else renderPlay(panel, bar, changed);
  renderCrowd();
  if (changed) onStage(v);
}

function rolesList(n) {
  const ul = el('ul', 'roles');
  const add = (icon, name, text) => { const li = el('li'); li.append(el('span', 'ic', icon)); const d = el('div'); d.append(el('b', null, name), text); li.append(d); ul.append(li); };
  add('😈', 'Pranksters', 'Secretly pick someone to prank each night. Blend in during the day. (1 Prankster for 4 to 5 players, 2 for 6 to 8, 3 for 9 or more.)');
  add('🔍', 'Snoop', 'Each night, peek at one bud to find out if they’re a Prankster. (5 or more players.)');
  add('🛡️', 'Guardian', 'Each night, protect one bud from pranks. (6 or more players.)');
  add('🌴', 'Islanders', 'Talk it out on the call and vote the Pranksters off the island.');
  return ul;
}
function renderLobby(panel, bar, changed) {
  const here = view.players.filter((p) => p.here).length, need = Math.max(0, 4 - here);
  hostSays('Prankster', need ? `waiting for ${need} more ${need === 1 ? 'player' : 'players'}…` : `${here} players! ready when you are`);
  if (changed || !panel.firstChild) {
    panel.textContent = '';
    const p = el('div', 'panel');
    p.append(el('h2', null, 'Someone here is a Prankster…'));
    p.append(el('p', null, 'Everyone gets a secret role. At night the Pranksters prank someone (they become a ghost). In the day, talk it out on the call and vote. The island wins by catching every Prankster; the Pranksters win if they outnumber everyone else. 4 to 12 players.'));
    p.append(rolesList());
    if (!IN_DISCORD) {
      const url = `${location.origin}/prankster?room=${room}`;
      const inv = el('p', null, `Invite link: ${url}`); p.append(inv);
    }
    panel.append(p);
  }
  const r = el('div', 'row'), go = el('button', 'btn primary', need ? `Need ${need} more` : 'Deal the roles!'); go.type = 'button';
  go.disabled = !!need;
  const msg = el('p', 'msg');
  go.addEventListener('click', async () => { go.disabled = true; try { view = await api('POST', '/api/game', { action: 'pk-start', room }); render(); } catch (e) { msg.textContent = e.message; go.disabled = false; } });
  r.append(go); bar.append(r, msg);
}

function eventLine(e) {
  if (!e) return '';
  const who = e.who ? nameOf(e.who) : '', role = e.role ? `${ROLE_ICON[e.role]} ${ROLE_NAME[e.role]}` : '', an = e.role === 'islander' ? 'an' : 'a';
  if (e.kind === 'pranked') return e.who === me ? `oh no, you got pranked! you’re a ghost now 👻 (you were ${an} ${role})` : `oh no! ${who} got pranked overnight 🎉💦 they were ${an} ${role}.`;
  if (e.kind === 'saved') return 'the Pranksters tried something last night… but the Guardian saved them! 🛡️';
  if (e.kind === 'quiet') return 'a quiet night. nobody got pranked!';
  if (e.kind === 'out') return e.who === me ? `the island voted you out! you were ${an} ${role}.` : `${who} is off the island! they were ${an} ${role}.`;
  if (e.kind === 'tie') return 'it’s a tie! nobody leaves today.';
  if (e.kind === 'skipped') return 'the island decided to skip. nobody leaves today.';
  return '';
}
function renderPlay(panel, bar, changed) {
  const v = view, info = v.roleInfo;
  // your role, always one tap away
  const roleBtn = el('button', 'pill mine-role', v.role ? `${ROLE_ICON[v.role]} you’re ${v.role === 'islander' ? 'an' : 'a'} ${ROLE_NAME[v.role]}${v.alive ? '' : ' (ghost)'}` : 'watching'); roleBtn.type = 'button';
  roleBtn.addEventListener('click', () => { showRoleCard(true); });
  if (v.stage === 'roles') {
    hostSays('shh… check your role', 'don’t show anyone! the night begins in a moment');
    if (changed || !panel.firstChild) showRoleCard(false);
    bar.append(el('p', 'hint', 'Remember it. Keep it secret.'));
    return;
  }
  const r = el('div', 'row'); r.append(roleBtn);
  if (v.stage === 'night') {
    if (!v.alive) { hostSays('night falls…', 'you’re a ghost 👻 watch quietly, no hints on the call!'); }
    else if (v.role === 'prankster') {
      const picks = v.teamPicks || {}, others = Object.entries(picks).filter(([id]) => id !== me).map(([id, t]) => `${nameOf(id)} → ${nameOf(t)}`);
      hostSays('night falls… 😈', v.myPick ? `you picked ${nameOf(v.myPick)}.${others.length ? ` (${others.join(', ')})` : ''}` : 'Pranksters, tap the bud you want to prank. Agree with your team!');
    } else if (v.role === 'snoop') hostSays('night falls… 🔍', v.myPick ? `you’re peeking at ${nameOf(v.myPick)}. you’ll find out in the morning.` : 'Snoop, tap a bud to peek at their role.');
    else if (v.role === 'guardian') hostSays('night falls… 🛡️', v.myPick ? `you’re protecting ${v.myPick === me ? 'yourself' : nameOf(v.myPick)} tonight.` : 'Guardian, tap a bud to protect tonight.');
    else hostSays('night falls… 💤', 'islanders are asleep. close your eyes (not really) and wait for morning.');
  } else if (v.stage === 'morning') {
    hostSays('good morning, island! ☀️', eventLine(v.events.at(-1)));
    const peeks = v.role === 'snoop' ? (v.snoops || []).filter((s) => s.day === v.day) : [];
    for (const s of peeks) bar.append(el('p', 'hint', `🔍 Your peek: ${nameOf(s.who)} ${s.prankster ? 'IS a Prankster! 😈' : 'is not a Prankster.'}`));
  } else if (v.stage === 'day') {
    const readyN = (v.ready || []).length, aliveN = v.players.filter((p) => p.alive).length;
    hostSays('talk it out! 🗣️', v.alive ? 'who’s acting suspicious? discuss on the call, then get ready to vote.' : 'you’re a ghost 👻 listen, but no hints!');
    if (v.alive) {
      const ready = el('button', 'btn' + (v.myReady ? '' : ' primary'), v.myReady ? `ready ✓ (${readyN}/${aliveN})` : `Ready to vote (${readyN}/${aliveN})`); ready.type = 'button';
      ready.disabled = v.myReady || busy;
      ready.addEventListener('click', () => send('pk-ready'));
      r.append(ready);
    }
    if (v.role === 'snoop' && (v.snoops || []).length) bar.append(el('p', 'hint', '🔍 ' + v.snoops.map((s) => `${nameOf(s.who)}: ${s.prankster ? 'Prankster!' : 'not a Prankster'}`).join(' · ')));
  } else if (v.stage === 'vote') {
    hostSays('time to vote! 🗳️', v.alive ? (v.myVote ? (v.myVote === 'skip' ? 'you voted to skip.' : `you voted for ${nameOf(v.myVote)}. you can change it until everyone’s in.`) : 'tap the bud you think is a Prankster.') : 'you’re a ghost 👻 ghosts don’t vote.');
    if (v.alive) {
      const skip = el('button', 'btn' + (v.myVote === 'skip' ? ' primary' : ''), 'Skip vote'); skip.type = 'button';
      skip.addEventListener('click', () => send('pk-vote', 'skip'));
      r.append(skip);
    }
  } else if (v.stage === 'verdict') {
    hostSays('the signs are up!', eventLine(v.events.at(-1)));
  }
  bar.prepend(r);
  const msg = el('p', 'msg', ''); msg.id = 'msg'; bar.append(msg);
}
function showRoleCard(dismissable) {
  const v = view, panel = $('panelArea'), info = v.roleInfo;
  panel.textContent = '';
  if (!info) return;
  const p = el('div', 'panel rolecard' + (v.role === 'prankster' ? ' pranksters' : ''));
  p.append(el('div', 'big', ROLE_ICON[v.role]), el('h2', null, `You’re ${v.role === 'islander' ? 'an' : 'a'} ${info.name}`), el('p', null, info.blurb));
  if (v.role === 'prankster') {
    const mates = (v.team || []).filter((id) => id !== me);
    p.append(el('p', null, mates.length ? `Your fellow Pranksters: ${mates.map(nameOf).join(', ')}` : 'You’re the only Prankster. Good luck…'));
  }
  if (dismissable) { const ok = el('button', 'btn', 'Got it'); ok.type = 'button'; ok.addEventListener('click', () => { panel.textContent = ''; }); const r = el('div', 'row'); r.append(ok); p.append(r); }
  panel.append(p);
}

function renderDone(panel, bar, changed) {
  const v = view, island = v.winner === 'island', mine = v.role ? teamWon(v.role) : null;
  hostSays('game over!', island ? 'the island caught every Prankster! 🌴🎉' : 'the Pranksters pranked the whole island! 😈');
  if (changed || !panel.firstChild) {
    panel.textContent = '';
    const p = el('div', 'panel');
    p.append(el('h2', null, island ? 'The island wins!' : 'The Pranksters win!'));
    if (mine != null) p.append(el('p', null, mine ? 'Your team won. Nice!' : 'Your team lost this one. Rematch?'));
    p.append(el('p', null, 'Everyone’s roles are on their buds below.'));
    const log = el('ul', 'log');
    for (const e of v.events) { const t = eventLine(e); if (t) log.append(el('li', null, `${e.kind === 'out' || e.kind === 'tie' || e.kind === 'skipped' ? '☀️ day' : '🌙 night'} ${e.day}: ${t}`)); }
    p.append(log);
    panel.append(p);
    S.play(mine === false ? 'boing' : 'sparkle');
  }
  const r = el('div', 'row'), again = el('button', 'btn primary', 'Play again'); again.type = 'button';
  const msg = el('p', 'msg');
  again.addEventListener('click', async () => { again.disabled = true; try { view = await api('POST', '/api/game', { action: 'pk-start', room }); render(); } catch (e) { msg.textContent = e.message; again.disabled = false; } });
  r.append(again); bar.append(r, msg);
}

function onStage(v) {
  if (v.stage === 'roles') S.play('whoosh');
  if (v.stage === 'night') S.play('snore', { gain: 0.6 });
  if (v.stage === 'morning') { const e = v.events.at(-1); S.play(e && e.kind === 'pranked' ? 'splash' : e && e.kind === 'saved' ? 'chime' : 'ding'); }
  if (v.stage === 'vote') S.play('alert');
  if (v.stage === 'verdict') { S.play('whoosh', { gain: 0.6 }); setTimeout(() => S.play(v.events.at(-1)?.kind === 'out' ? 'thump' : 'boing'), 500); }
}

/* ---------- acting ---------- */
async function send(action, target) {
  if (busy) return;
  busy = true; render();
  try { view = await api('POST', '/api/game', { action, room, target }); S.play('pop'); }
  catch (e) { const m = $('msg'); if (m) m.textContent = e.message; S.play('boing'); }
  busy = false; render();
}
function tapBud(id) {
  if (!canTarget(id) || busy) return;
  const a = myAction();
  if (a === 'night') { if (view.myPick !== id) send('pk-night', id); }
  else if (a === 'vote') { if (view.myVote !== id) send('pk-vote', id); }
}

// the timer bar, smooth between check-ins
let ticked = -1;
function frame() {
  const v = view;
  if (v && v.phase === 'play' && v.stageEnds) {
    const total = v.stageEnds - v.stageAt, left = Math.max(0, v.stageEnds - now());
    $('timerBar').style.transform = `scaleX(${(left / total).toFixed(3)})`;
    $('timer').classList.toggle('low', left < 5000);
    const s = Math.ceil(left / 1000);
    if (['night', 'vote'].includes(v.stage) && s <= 3 && s > 0 && s !== ticked) { ticked = s; S.play('tick', { gain: 0.5 }); }
    if (left <= 0 && !polling) poll(0);
  }
  requestAnimationFrame(frame);
}

/* ---------- checking in ---------- */
let polling = false, pollTimer = null;
async function poll(delay) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (polling) return;
    polling = true;
    try {
      const v = await api('GET', `/api/game?pk=${encodeURIComponent(room)}`);
      if (!busy) { view = v; render(); }
      ensureBuds(v.players.map((p) => p.id));
    } catch (e) {
      if (e.status === 404) return gate('This game ended', 'Start a new one?', [['New game', () => { location.href = '/prankster'; }, true]]);
    } finally { polling = false; }
    poll(view && view.phase === 'lobby' ? 1500 : view && view.phase === 'done' ? 2500 : 900);
  }, delay);
}
function gate(title, text, buttons = []) {
  $('app').hidden = true; $('gate').hidden = false;
  $('gateTitle').textContent = title; $('gateText').textContent = text;
  const row = $('gateRow'); row.textContent = '';
  for (const [label, fn, primary] of buttons) { const b = el('button', 'btn' + (primary ? ' primary' : ''), label); b.type = 'button'; b.addEventListener('click', fn); row.append(b); }
}

/* ---------- start: inside Discord, or from a link ---------- */
async function startInDiscord() {
  const { DiscordSDK } = await import('/js/vendor/discord-sdk.js');
  sdk = new DiscordSDK(APP_ID);
  await sdk.ready();
  const { code } = await sdk.commands.authorize({ client_id: APP_ID, response_type: 'code', state: '', prompt: 'none', scope: ['identify'] });
  const auth = await api('POST', '/api/auth/activity', { code });
  sessionToken = auth.session; me = auth.user.id;
  try { await sdk.commands.authenticate({ access_token: auth.access_token }); } catch (e) {}
  room = ('dc-' + sdk.instanceId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80);
  $('brand').addEventListener('click', (e) => { e.preventDefault(); openLink('/world'); });
  // back to the game picker, keeping Discord's launch parameters
  const games = $('gamesBtn'); games.hidden = false;
  games.addEventListener('click', () => { location.href = '/play' + location.search; });
}
async function startFromLink() {
  room = params.get('room');
  if (room && !/^[A-Za-z0-9_-]{6,80}$/.test(room)) room = null;
  const v = await api('POST', '/api/game', room ? { action: 'pk-join', room } : { action: 'pk-new' });
  room = v.id;
  if (params.get('room') !== room) history.replaceState(null, '', `/prankster?room=${room}`);
  return v;
}

(async () => {
  S.bindToggle($('soundBtn'));
  if (!window.BudSound) $('soundBtn').hidden = true;
  try {
    if (IN_DISCORD) { await startInDiscord(); view = await api('POST', '/api/game', { action: 'pk-join', room }); }
    else view = await startFromLink();
    me = view.me;
    render();
    ensureBuds(view.players.map((p) => p.id));
    poll(900);
    requestAnimationFrame(frame);
  } catch (e) {
    if (e.status === 401 && !IN_DISCORD) {
      const next = encodeURIComponent(location.pathname + location.search);
      return gate('Sign in to play', 'Prankster is for members of the server. Sign in with Discord and you’ll land right back here.', [['Sign in with Discord', () => { location.href = `/api/auth/login?next=${next}`; }, true]]);
    }
    if (e.status === 403) return gate('Members only', 'This game is for members of The Buddie System server.', []);
    gate('Couldn’t start the game', IN_DISCORD ? 'Something went wrong connecting to Discord. Try closing and reopening the Activity.' : e.message, IN_DISCORD ? [] : [['Try again', () => location.reload(), true]]);
    console.error(e);
  }
})();
</script>
