<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>

<title>Island Race · the buddie system</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<meta name="description" content="A board game round the island for everyone on the call. Roll, hop, grab items, first bud back to the campfire wins.">
<meta name="theme-color" content="#BFD9FF">
<style>
/* Island Race: a board game on a little 3D island for everyone on a call (bud's Discord Activity). The server
   rolls every die (lib/race.js); this page plays each turn's hops for everyone at once. */
:root {
  --ink: #1D1C2B; --muted: #5E5D75; --card: rgba(255,255,255,.9); --line: rgba(29,28,43,.1); --shadow: rgba(46,40,90,.22);
  --btn: #1D1C2B; --btn-ink: #fff; --chip: rgba(127,127,160,.12); --bad: #E8505B; --good: #2E9E62; --gold: #F2B300;
  --font: "Fredoka", "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #EDECF6; --muted: #A9A7C4; --card: rgba(30,32,52,.9); --line: rgba(255,255,255,.12); --shadow: rgba(0,0,0,.5); --btn: #EDECF6; --btn-ink: #15161F; --chip: rgba(255,255,255,.08); color-scheme: dark; } }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFD9FF; color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; z-index: 3; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; color: #1D1C2B; text-decoration: none; background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 12px 5px 6px; }
.brand img { width: 24px; height: 24px; }
.pill { background: rgba(255,255,255,.85); color: #1D1C2B; border: 0; border-radius: 999px; padding: 6px 12px; font: 600 13.5px var(--font); cursor: pointer; white-space: nowrap; }
.spacer { flex: 1; }
.icon-btn { border: 0; background: rgba(255,255,255,.85); color: #1D1C2B; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.icon-btn svg { width: 17px; height: 17px; }
/* the racers: whose turn, place, acorns, items */
.racers { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 46px); left: 16px; right: 16px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; pointer-events: none; }
.racer { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.88); color: #1D1C2B; border-radius: 14px; padding: 4px 10px 4px 4px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 14px -10px rgba(30,25,60,.5); border: 2px solid transparent; transition: transform .2s; }
.racer.turn { border-color: #FF7A59; transform: translateY(2px); }
.racer.away { opacity: .55; }
.racer .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.racer small { color: #5E5D75; font-weight: 600; }
/* the panel at the bottom */
.panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(520px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 12px 14px; box-shadow: 0 18px 40px -22px var(--shadow); display: grid; gap: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 3; }
.panel h2 { margin: 0; font-size: 17px; }
.panel p { margin: 0; font-size: 14px; line-height: 1.35; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.row.left { justify-content: flex-start; }
.btn { font: 600 15px var(--font); border-radius: 999px; padding: 10px 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.big { font-size: 18px; padding: 12px 26px; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: inherit; border-radius: 14px; padding: 7px 11px; font: 600 13.5px var(--font); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: currentColor; background: rgba(255,122,89,.18); }
.chip .em { font-size: 17px; line-height: 1; }
.label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lobby { display: flex; flex-wrap: wrap; gap: 6px; }
.lobby span { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 13.5px; font-weight: 600; }
.lobby span.away { opacity: .5; }
.msg { color: var(--bad) !important; font-size: 13.5px; }
/* the race log, at the side */
.log { position: fixed; right: 16px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 8px); width: 240px; display: grid; gap: 4px; z-index: 2; pointer-events: none; }
.log div { background: rgba(255,255,255,.8); color: #2B2A3A; border-radius: 10px; padding: 4px 9px; font-size: 12.5px; animation: in .3s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
@media (max-width: 1080px) { .log { display: none; } }
/* floating things over the board: speech, +1 acorn, item names */
.float { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; font: 700 15px var(--font); color: #fff; -webkit-text-stroke: 1px #1D1C2B; paint-order: stroke fill; text-shadow: 0 2px 0 #1D1C2B; white-space: nowrap; transition: opacity .3s; }
.say { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; background: #fff; color: #2B2A3A; font: 600 13.5px/1.25 var(--font); padding: 6px 10px; border-radius: 12px; max-width: 190px; text-align: center; box-shadow: 0 6px 16px -8px rgba(30,25,60,.45); }
.say::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.6); font: 700 clamp(28px, 8vw, 52px) var(--font); color: #fff; -webkit-text-stroke: 2px #1D1C2B; paint-order: stroke fill; text-shadow: 0 6px 0 #1D1C2B; opacity: 0; pointer-events: none; transition: opacity .25s, transform .45s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; z-index: 4; }
.banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5; }
.gate .panel { position: static; transform: none; max-width: 420px; }
@media (orientation: landscape) and (max-height: 520px) {
  .panel { left: auto; right: max(10px, env(safe-area-inset-right)); transform: none; width: min(320px, 42vw); top: 96px; bottom: auto; max-height: calc(100% - 106px); overflow-y: auto; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="The island, with the race path round it"></canvas>
<header class="top">
  <a class="brand" href="/world" id="brand"><img src="/img/favicon.svg" alt=""><span>Island Race</span></a>
  <span class="spacer"></span>
  <button class="pill" id="gamesBtn" type="button" hidden>Games</button>
  <button class="icon-btn" id="soundBtn" type="button"></button>
</header>
<div class="racers" id="racers"></div>
<div class="log" id="log" aria-live="polite"></div>
<div class="banner" id="banner" aria-live="assertive"></div>
<section class="panel" id="panel" hidden></section>
<div class="gate" id="gate" hidden><div class="panel"><h2 id="gateTitle"></h2><p id="gateText"></p><div class="row" id="gateRow"></div></div></div>

<script type="module">
import { setExtents, buildMesh, drawEyeStyle, clamp } from '/js/bud-core.js';
const APP_ID = '1563361979316445264';
const params = new URLSearchParams(location.search);
const IN_DISCORD = params.has('frame_id') && params.has('instance_id');
const S = window.BudSound || { play() {}, bindToggle() {}, muted: true };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const toLinear = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const ITEMS = { double: ['🎲', 'Double Dice', 'roll two dice'], golden: ['✨', 'Golden Die', 'pick your roll'], banana: ['🍌', 'Banana Peel', 'leave a trap here'], coffee: ['☕', 'Coffee', '+1 to your roll'] };
const COLORS = ['#FF7A59', '#4FB3FF', '#7C6CFF', '#3BB273', '#FF7EB6', '#F2B300'];
let sdk = null, sessionToken = null, room = null, view = null, me = null, busy = false, msg = '';
let board = null;

async function api(method, path, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (sessionToken) headers['x-bud-session'] = sessionToken;
  const res = await fetch(path, { method, headers, credentials: 'same-origin', cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw Object.assign(new Error(data.error || 'something went wrong'), { status: res.status });

}
function openLink(url) { if (sdk) sdk.commands.openExternalLink({ url: new URL(url, 'https://bud.oqw.one').href }).catch(() => {}); else location.href = url; }
const nameOf = (id) => (view && view.players.find((p) => p.id === id)?.name) || 'someone';
const colorOf = (id) => COLORS[Math.max(0, (view?.racers || []).indexOf(id)) % COLORS.length];

/* ---------- the scene: a little island with the path round it ---------- */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#8EC5FF'); gr.addColorStop(0.6, '#D9ECFF'); gr.addColorStop(1, '#FBE3EF');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x8FBF8F, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-8, 16, 10); scene.add(sun);
const M = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: toLinear(hex), roughness: 0.85, ...o });
const IR = 12;
{
  const top = new THREE.Mesh(new THREE.CylinderGeometry(IR, IR * 0.97, 0.6, 64), [M('#6DB774'), M('#86CF86'), M('#6DB774')]); top.position.y = -0.3; scene.add(top);
  const under = new THREE.Mesh(new THREE.ConeGeometry(IR * 0.97, IR * 0.8, 32, 1, true), M('#C9A27A', { flatShading: true })); under.rotation.x = Math.PI; under.position.y = -0.6 - IR * 0.4; scene.add(under);
  const sea = new THREE.Mesh(new THREE.CircleGeometry(160, 48), M('#9FD3F0', { roughness: 0.4 })); sea.rotation.x = -Math.PI / 2; sea.position.y = -9; scene.add(sea);
  // trees round the edge and in the woods (inside the loop)
  const leaf = [M('#5FB36A', { flatShading: true }), M('#7BC67E', { flatShading: true })], trunk = M('#A47551');
  const tree = (x, z, s) => {
    const t = new THREE.Group();
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.1 * s, 7), trunk); tr.position.y = 0.55 * s; t.add(tr);
    for (let k = 0; k < 3; k++) { const l = new THREE.Mesh(new THREE.IcosahedronGeometry((0.85 - k * 0.2) * s, 0), leaf[k % 2]); l.position.y = (1.25 + k * 0.5) * s; t.add(l); }
    t.position.set(x, 0, z); scene.add(t);
  };
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + 0.2; if (Math.abs(Math.sin(a) - 1) < 0.15) continue; tree(Math.cos(a) * 10.9, Math.sin(a) * 10.9, 0.8 + (i % 3) * 0.15); }
  scene.userData.tree = tree;
  // the sea's waves at the beach side, and a few flowers
  for (let i = 0; i < 24; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 4), M(['#FFB3C7', '#FFE08A', '#FFFFFF', '#C9B8FF'][i % 4])); const a = i * 2.39, r = 2 + (i * 7.3) % 9; f.position.set(Math.cos(a) * r, 0.07, Math.sin(a) * r); scene.add(f); }
}

/* ---------- the board ---------- */
const TILE_LOOK = {
  start: ['#FFFFFF', '🏁'], plain: ['#9CC8FF', ''], item: ['#FFD23F', '?'], launch: ['#FF7A59', '↑'], slide: ['#B98B5E', '≈'],
  swap: ['#C9B8FF', '⇄'], nap: ['#E8E6F2', 'z'], fork: ['#9CC8FF', 'Y'],
};
function glyphTexture(text, color) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.font = '700 86px Fredoka, Nunito, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.strokeStyle = 'rgba(29,28,43,.85)'; g.strokeText(text, 64, 70); g.fillStyle = color; g.fillText(text, 64, 70);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const tileMeshes = new Map(), trapMeshes = new Map();
function buildBoard() {
  for (const t of board) {
    const [col, glyph] = TILE_LOOK[t.type] || TILE_LOOK.plain;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.66, 0.12, 28), M(col, { roughness: 0.6 }));
    m.position.set(t.x, 0.06, t.z); scene.add(m); tileMeshes.set(t.id, m);
    if (glyph) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ map: glyphTexture(glyph, '#FFFFFF'), transparent: true, depthWrite: false }));
      p.rotation.x = -Math.PI / 2; p.position.set(t.x, 0.13, t.z); p.renderOrder = 2; scene.add(p);
    }
    // stepping stones to the next tiles
    for (const n of t.next) {
      const o = board[n];
      for (let k = 1; k <= 2; k++) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.05, 10), M('#E8DCC0')); s.position.set(t.x + (o.x - t.x) * k / 3, 0.025, t.z + (o.z - t.z) * k / 3); scene.add(s); }
    }
  }
  // trees in the woods, either side of the shortcut
  const woods = board.filter((t) => t.zone === 'woods');
  woods.forEach((t, i) => {
    if (i % 2) return;
    const o = board[t.next[0]], dx = o.x - t.x, dz = o.z - t.z, l = Math.hypot(dx, dz) || 1, nx = -dz / l, nz = dx / l;
    scene.userData.tree(t.x + nx * 1.5, t.z + nz * 1.5, 0.7); scene.userData.tree(t.x - nx * 1.6, t.z - nz * 1.6, 0.65);
  });
  // the campfire and a balloon arch at the start
  const st = board[0], fire = new THREE.Group();
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.8, 7), M('#8A5A3C')); l.rotation.z = Math.PI / 2; l.rotation.y = i * Math.PI / 3; l.position.y = 0.09; fire.add(l); }
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.7, 8), new THREE.MeshBasicMaterial({ color: 0xFF9A3E, transparent: true, opacity: 0.9 })); flame.position.y = 0.45; fire.add(flame);
  fire.position.set(st.x, 0, st.z - 1.7); scene.add(fire); scene.userData.flame = flame;
  // a checkered flag beside the start, on the sea side of the path
  const flag = new THREE.Group(), pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 8), M('#FFFFFF')); pole.position.y = 1.2; flag.add(pole);
  const fc = document.createElement('canvas'); fc.width = 64; fc.height = 40; const fg = fc.getContext('2d');
  for (let y = 0; y < 5; y++) for (let x = 0; x < 8; x++) { fg.fillStyle = (x + y) % 2 ? '#1D1C2B' : '#FFFFFF'; fg.fillRect(x * 8, y * 8, 8, 8); }
  const ft = new THREE.CanvasTexture(fc); ft.encoding = THREE.sRGBEncoding;
  const cloth = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.62, 8, 1), new THREE.MeshStandardMaterial({ map: ft, side: THREE.DoubleSide, roughness: 0.8 })); cloth.position.set(0.5, 2.05, 0); flag.add(cloth);
  const out = Math.hypot(st.x, st.z) || 1; flag.position.set(st.x + st.x / out * 1.3 - 0.9, 0, st.z + st.z / out * 1.3); scene.add(flag);
  scene.userData.cloth = cloth;
}
function bananaMesh() {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.06, 8, 16, Math.PI * 0.9), M('#FFD23F', { roughness: 0.5 }));
  m.rotation.x = -Math.PI / 2; g.add(m); g.position.y = 0.17; return g;
}
function syncTraps(traps) {
  for (const [id, m] of trapMeshes) if (traps[id] == null) { scene.remove(m); trapMeshes.delete(id); }
  for (const id of Object.keys(traps)) if (!trapMeshes.has(id)) { const t = board[id], m = bananaMesh(); m.position.x = t.x + 0.2; m.position.z = t.z + 0.15; scene.add(m); trapMeshes.set(id, m); }
}

/* ---------- buds as pieces ---------- */
const FACE_W = 256, FACE_H = 175, BUD_W = 1.35;
const pieces = new Map();   // racer id -> { bud, root, at (tile), x, z, y, ... }
async function loadImage(src) { return new Promise((ok) => { if (!src) return ok(null); const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
function eyeColorFor(img, b) {
  if (!img) return '#15161F';
  const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d', { willReadFrequently: true });
  const W = img.width, H = img.height, er = b.eyeR;
  const sx = (b.eyeRel.x - er * 1.2 - b.minX) / b.w * W, sy = (b.eyeRel.y - er * 0.7 - b.minY) / b.h * H;
  g.drawImage(img, clamp(sx, 0, W - 1), clamp(sy, 0, H - 1), Math.max(1, er * 2.4 / b.w * W), Math.max(1, er * 1.4 / b.h * H), 0, 0, 8, 8);
  const d = g.getImageData(0, 0, 8, 8).data; let r = 0, gg = 0, bb = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; bb += d[i + 2]; }
  return (0.2126 * r + 0.7152 * gg + 0.0722 * bb) / (d.length / 4) / 255 < 0.42 ? '#F3F4F8' : '#15161F';
}
const fallbackShape = () => ({ r: Array.from({ length: 36 }, (_, i) => { const a = i / 36 * Math.PI * 2; return [Math.cos(a) * 60, Math.sin(a) * 54]; }), eyeRel: { x: 0, y: -6 }, eyeR: 15, eyes: 'classic', paint: null });
async function makePiece(id, data) {
  data = data && data.r && data.r.length > 8 ? data : fallbackShape();
  const b = setExtents({ r: data.r.map(([x, y]) => ({ x, y })), eyeRel: data.eyeRel, eyeR: data.eyeR });
  const { geom, face } = buildMesh(b);
  const img = await loadImage(data.paint);
  const s = BUD_W / Math.max(b.w, b.h);
  const map = img ? new THREE.Texture(img) : null;
  if (map) { map.encoding = THREE.sRGBEncoding; map.needsUpdate = true; }
  const body = new THREE.Mesh(geom, new THREE.MeshPhysicalMaterial({ color: map ? 0xffffff : toLinear(colorOf(id)), map, roughness: 0.58, clearcoat: 0.3 }));
  const fc = document.createElement('canvas'); fc.width = FACE_W; fc.height = FACE_H;
  const faceTex = new THREE.CanvasTexture(fc); faceTex.encoding = THREE.sRGBEncoding;
  const faceMesh = new THREE.Mesh(face, new THREE.MeshStandardMaterial({ map: faceTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
  faceMesh.renderOrder = 2;
  const inner = new THREE.Group(); inner.add(body, faceMesh); inner.scale.setScalar(s);
  geom.computeBoundingBox(); const bb = geom.boundingBox, c = bb.getCenter(new THREE.Vector3()), h = (bb.max.y - bb.min.y) * s;
  inner.position.set(-c.x * s, -c.y * s + h / 2 + 0.1, -c.z * s);
  const squash = new THREE.Group(), root = new THREE.Group(); squash.add(inner); root.add(squash);
  // a colored ring under each racer, so you can tell them apart from above
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 8, 28), new THREE.MeshBasicMaterial({ color: toLinear(colorOf(id)) })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.14; root.add(ring);
  scene.add(root);
  const p = { id, data, b, root, squash, inner, faceTex, g: fc.getContext('2d'), eyeCol: eyeColorFor(img, b), at: 0, x: 0, z: 0, y: 0, heading: 0, happy: false, sleepy: false, blinkAt: 0, key: '', height: h + 0.1 };
  pieces.set(id, p);

        const f = el('div', 'row left');
        for (const [v, label] of [[0, '🏖️ The beach (safe)'], [1, '🌲 The woods (3 shorter, but sleepy and muddy)']]) {
          const c = el('button', 'chip', label); c.type = 'button'; c.setAttribute('aria-pressed', String(fork === v)); c.addEventListener('click', () => { fork = v; S.play('click'); render(); }); f.append(c);
        }
        p.append(f);
      }
      btn(chosenItem === 'double' ? 'Roll both dice!' : 'Roll!', rollNow, 'primary big');
    }
  }
  if (msg) p.append(el('p', 'msg', msg));
  if (row.childNodes.length) p.append(row);
}
async function start() {
  busy = true; msg = ''; render();
  try { takeView(await api('POST', '/api/game', { action: 'rc-start', room })); } catch (e) { msg = e.message; }
  busy = false; render();
}
async function rollNow() {
  if (busy) return;
  busy = true; msg = ''; render();
  try {
    const v = await api('POST', '/api/game', { action: 'rc-roll', room, item: chosenItem, golden, fork });
    chosenItem = null; S.play('click');
    takeView(v);
  } catch (e) { msg = e.message; }
  busy = false; render();
}

/* ---------- checking in ---------- */
async function poll() {
  setTimeout(poll, 900);
  if (document.hidden || busy) return;
  try { takeView(await api('GET', `/api/game?rc=${encodeURIComponent(room)}${board ? '' : '&full=1'}`)); } catch (e) {}
}

/* ---------- loop ---------- */
let T = 0, lastNow = performance.now();
function loop(now) {
  const dt = Math.min(0.2, (now - lastNow) / 1000); lastNow = now; T += dt;
  piecesTick(dt); diceTick(dt); bitsTick(dt);
  for (const p of pieces.values()) drawFace(p, T);
  if (scene.userData.flame) scene.userData.flame.scale.set(1, 1 + Math.sin(T * 9) * 0.08, 1);
  if (scene.userData.cloth) { const g = scene.userData.cloth.geometry.attributes.position; for (let i = 0; i < g.count; i++) { const x = g.getX(i) + 0.5; g.setZ(i, Math.sin(T * 5 - x * 5) * 0.08 * x); } g.needsUpdate = true; }
  placeCamera(dt);
  renderer.render(scene, camera);
  placeOverlays();
  requestAnimationFrame(loop);
}

/* ---------- start: inside Discord, or from a link ---------- */
function gate(title, text, buttons) {
  $('gate').hidden = false; $('panel').hidden = true;
  $('gateTitle').textContent = title; $('gateText').textContent = text;
  const r = $('gateRow'); r.textContent = '';
  for (const [label, fn, primary] of buttons) { const b = el('button', 'btn' + (primary ? ' primary' : ''), label); b.type = 'button'; b.addEventListener('click', fn); r.append(b); }
}
async function startInDiscord() {
  const { DiscordSDK } = await import('/js/vendor/discord-sdk.js');
  sdk = new DiscordSDK(APP_ID);
  await sdk.ready();
  const { code } = await sdk.commands.authorize({ client_id: APP_ID, response_type: 'code', state: '', prompt: 'none', scope: ['identify'] });
  const auth = await api('POST', '/api/auth/activity', { code });
  sessionToken = auth.session; me = auth.user.id;
  try { await sdk.commands.authenticate({ access_token: auth.access_token }); } catch (e) {}
  room = ('dc-' + sdk.instanceId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80);
  $('brand').addEventListener('click', (e) => { e.preventDefault(); openLink('/world'); });
  const games = $('gamesBtn'); games.hidden = false;
  games.addEventListener('click', () => { location.href = '/play' + location.search; });
}
async function startFromLink() {
  room = params.get('room');
  if (room && !/^[A-Za-z0-9_-]{6,80}$/.test(room)) room = null;
  const v = await api('POST', '/api/game', room ? { action: 'rc-join', room } : { action: 'rc-new' });
  room = v.id;
  if (params.get('room') !== room) history.replaceState(null, '', `/race?room=${room}`);
  return v;
}
(async () => {
  S.bindToggle($('soundBtn')); if (!window.BudSound) $('soundBtn').hidden = true;
  resize(); requestAnimationFrame(loop);
  try {
    let v;
    if (IN_DISCORD) { await startInDiscord(); v = await api('POST', '/api/game', { action: 'rc-join', room }); }
    else v = await startFromLink();
    me = v.me;
    takeView(v);
    setTimeout(poll, 900);
  } catch (e) {
    if (e.status === 401 && !IN_DISCORD) {
      const next = encodeURIComponent(location.pathname + location.search);
      return gate('Sign in to race', 'Island Race is for members of the server. Sign in with Discord and you’ll land right back here.', [['Sign in with Discord', () => { location.href = `/api/auth/login?next=${next}`; }, true]]);
    }
    if (e.status === 403) return gate('Members only', 'This game is for members of The Buddie System server.', []);
    gate('Couldn’t start the race', IN_DISCORD ? 'Something went wrong connecting to Discord. Try closing and reopening the Activity.' : e.message, IN_DISCORD ? [] : [['Try again', () => location.reload(), true]]);
    console.error(e);
  }
})();
</script>
