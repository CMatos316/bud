<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bud island · the buddie system</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#BFD9FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the whole screen is sky with the floating island in the middle; a slim top bar, name tags and
   speech bubbles float over the 3D scene, and a small hint pill sits at the bottom. */
:root {
  --sky-top: #BFD9FF;
  --sky-bottom: #FBE3EF;
  --ink: #1D1C2B;
  --muted: #5E5D75;
  --chip: rgba(255, 255, 255, 0.62);
  --chip-line: rgba(29, 28, 43, 0.08);
  --tag: rgba(255, 255, 255, 0.88);
  --tag-ink: #1D1C2B;
  --me: #1D1C2B;
  --me-ink: #FFFFFF;
  --shadow: rgba(46, 40, 90, 0.2);
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0F1430; --sky-bottom: #2C1F45; --ink: #EDECF6; --muted: #A9A7C4;
    --chip: rgba(30, 32, 52, 0.66); --chip-line: rgba(255, 255, 255, 0.1);
    --tag: rgba(30, 32, 52, 0.85); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F;
    --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0F1430; --sky-bottom: #2C1F45; --ink: #EDECF6; --muted: #A9A7C4;
  --chip: rgba(30, 32, 52, 0.66); --chip-line: rgba(255, 255, 255, 0.1);
  --tag: rgba(30, 32, 52, 0.85); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F;
  --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font-display);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#world.dragging { cursor: grabbing; }
#world.over-bud { cursor: pointer; }

.topbar {
  position: fixed; z-index: 4; top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand .mark { width: 22px; height: 22px; flex: none; overflow: visible; }
.brand .mark-body { fill: #8DB9FF; stroke: rgba(62, 99, 184, .35); stroke-width: 3; }
.brand .mark-eye { fill: #15161F; }
.right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink); text-decoration: none;
  font: 500 14px/1 var(--font-display); white-space: nowrap; cursor: pointer;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.pill:hover { transform: translateY(-1px); }
.pill svg { width: 15px; height: 15px; }
.who { padding: 4px 12px 4px 4px; font-size: 13.5px; cursor: default; }
.who:hover { transform: none; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.who a { color: var(--muted); text-decoration: none; font-size: 12.5px; }
.who a:hover, .who a:focus-visible { color: var(--ink); text-decoration: underline; }
.pill:focus-visible, .card button:focus-visible, .composer button:focus-visible, .composer textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E2557A; color: #fff; font-size: 11.5px; font-weight: 600; display: inline-grid; place-items: center; }

.title {
  position: fixed; z-index: 2; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px));
  text-align: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title h1 { margin: 0; font-size: clamp(24px, 3.6vw, 34px); font-weight: 600; letter-spacing: -0.015em; }
.title p { margin: 6px auto 0; max-width: 44ch; color: var(--muted); font-size: 15px; line-height: 1.45; }
.title.fade { transition: opacity 1.2s ease; opacity: 0; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
  font: 500 12.5px/1 var(--font-display); white-space: nowrap; color: var(--tag-ink);
  background: var(--tag); padding: 5px 9px; border-radius: 9px; box-shadow: 0 6px 14px -10px var(--shadow);
}
.tag.me { background: var(--me); color: var(--me-ink); }
.tag.me::after { content: " \00b7 you"; opacity: .7; font-weight: 400; }
.bubble {
  position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
  background: var(--tag); color: var(--tag-ink); border: 1.5px solid var(--tag-ink);
  border-radius: 14px; padding: 6px 11px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: inherit;
  border-right: 1.5px solid var(--tag-ink); border-bottom: 1.5px solid var(--tag-ink); transform: translateX(-50%) rotate(45deg);
}
.bubble.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { scale: .6; opacity: 0; } to { scale: 1; opacity: 1; } }

.hint {
  position: fixed; z-index: 4; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; text-align: center;
  font-size: 13.5px; color: var(--muted); background: var(--chip); border: 1px solid var(--chip-line);
  padding: 9px 16px; border-radius: 999px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }

.card {
  max-height: min(64vh, 560px); overflow: auto;
  position: fixed; z-index: 5; left: 0; right: 0; margin-inline: auto; width: min(320px, calc(100% - 32px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
  background: var(--tag); color: var(--tag-ink); border: 1px solid var(--chip-line); border-radius: 22px;
  padding: 16px 18px; box-shadow: 0 20px 44px -24px var(--shadow);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 4px 12px;
  animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.card h2 { margin: 0; font-size: 22px; font-weight: 600; }
.card p { margin: 0; grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.card .tn { font-family: var(--font-mono); color: var(--tag-ink); background: rgba(127,127,160,.16); padding: 1px 6px; border-radius: 6px; }
.card .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px; }
.card-body { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; }
.card-body:empty { display: none; }
.card-body .muted { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); cursor: pointer;
  font: 500 14px/1 var(--font-display); padding: 10px 15px; border-radius: 999px; text-decoration: none;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn.primary { background: var(--me); color: var(--me-ink); border-color: transparent; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.friends { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14.5px; }
.friends::before, .tag.friend::before { content: "\2665"; color: #E2557A; }
.tag.friend::before { margin-right: 4px; }

/* Sticky notes: paper colors stay paper-colored in dark mode too. */
:root { --n-lemon: #FFE98A; --n-peach: #FFC6A5; --n-mint: #BDEFCF; --n-sky: #BFDFFF; --n-lilac: #DCCBFF; --paper-ink: #2B2A33; }
.note {
  position: relative; background: var(--n-lemon); color: var(--paper-ink); border-radius: 3px 3px 3px 14px;
  padding: 14px 14px 12px; box-shadow: 0 10px 18px -12px rgba(30, 25, 60, .45); transform: rotate(-1.2deg);
}
.note:nth-child(even) { transform: rotate(1deg); }
.note::before {
  content: ""; position: absolute; top: -7px; left: 50%; width: 46px; height: 14px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255, 255, 255, .55); border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.note .text { margin: 0; font-size: 17px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.note .from { margin: 8px 0 0; font-size: 12.5px; opacity: .7; }
.note .row { margin-top: 10px; }
.note .btn { background: rgba(255,255,255,.6); color: var(--paper-ink); border-color: rgba(43,42,51,.12); padding: 8px 13px; font-size: 13.5px; }
.note .btn.primary { background: var(--paper-ink); color: #fff; }
.note.small .text { font-size: 15px; }

.composer {
  position: fixed; z-index: 6; left: 0; right: 0; margin-inline: auto; width: min(320px, calc(100% - 32px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
  background: var(--tag); color: var(--tag-ink); border: 1px solid var(--chip-line); border-radius: 22px;
  padding: 16px 18px 18px; box-shadow: 0 20px 44px -24px var(--shadow);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  display: grid; gap: 12px; justify-items: center; animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
.composer-title { margin: 0; font-weight: 600; font-size: 17px; justify-self: start; }
.composer .note { width: 220px; height: 200px; box-sizing: border-box; display: grid; padding: 18px 16px 10px; transform: rotate(-2deg); }
.composer textarea {
  appearance: none; border: 0; background: transparent; resize: none; color: var(--paper-ink); width: 100%; height: 100%;
  font: 500 19px/1.3 var(--font-display); padding: 0; border-radius: 4px;
}
.composer textarea::placeholder { color: rgba(43, 42, 51, .45); }
.composer .count { justify-self: end; font: 11.5px var(--font-mono); opacity: .55; }
.swatches { display: flex; gap: 10px; }
.swatch { appearance: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.swatch[aria-checked="true"] { border-color: var(--ink); }
.swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.composer-error { margin: 0; color: #C4385E; font-size: 13.5px; text-align: center; }
.composer .row { justify-content: flex-end; width: 100%; }
.flying { position: fixed; z-index: 7; margin: 0; pointer-events: none; }

/* Photo booth */
.tag.picked { outline: 2.5px solid #F2B33D; outline-offset: 2px; }
.tag.picked::after { content: " \00b7 in the photo"; opacity: .7; font-weight: 400; }
.photo-bar {
  position: fixed; z-index: 5; left: 0; right: 0; margin-inline: auto; width: min(420px, calc(100% - 32px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
  background: var(--tag); color: var(--tag-ink); border: 1px solid var(--chip-line); border-radius: 22px;
  padding: 14px 16px; box-shadow: 0 20px 44px -24px var(--shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
.photo-bar p { margin: 0; flex: 1 1 180px; font-size: 14px; line-height: 1.35; }
.photo-bar p b { font-weight: 600; }
.countdown {
  position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none;
  font: 600 min(30vw, 180px)/1 var(--font-display); color: #fff; text-shadow: 0 6px 30px rgba(30, 20, 60, .45);
}
.countdown span { animation: tick .8s ease-out both; }
@keyframes tick { from { transform: scale(1.5); opacity: 0; } 30% { transform: scale(1); opacity: 1; } to { transform: scale(.85); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 9; background: #fff; pointer-events: none; animation: flash .7s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.booth {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: auto;
  background: rgba(20, 18, 40, .45); padding: 16px; box-sizing: border-box;
}
.booth-card {
  width: min(560px, 100%); display: grid; gap: 12px; background: var(--tag); color: var(--tag-ink);
  border-radius: 22px; padding: 16px; box-sizing: border-box; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6);
  animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
.booth-card img { width: 100%; height: auto; display: block; border-radius: 6px; transform: rotate(-1deg); box-shadow: 0 14px 30px -18px rgba(0,0,0,.6); }
.booth-card input {
  font: 500 16px/1.2 var(--font-display); color: var(--tag-ink); background: transparent; width: 100%; box-sizing: border-box;
  border: 1.5px solid var(--chip-line); border-radius: 12px; padding: 11px 13px;
}
.booth-card input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.booth-card .row { justify-content: flex-end; }
.booth-card .row .spacer { flex: 1; }
.booth-card .msg { margin: 0; font-size: 14px; color: var(--muted); }
.booth-card .msg.err { color: #C4385E; }
@media (prefers-reduced-motion: reduce) { .countdown span, .booth-card, .photo-bar { animation: none; } .flash { animation-duration: .2s; } }

.center {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; text-align: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.center > div { pointer-events: auto; display: grid; gap: 12px; justify-items: center; }
.center h2 { margin: 0; font-size: 26px; font-weight: 600; }
.center p { margin: 0; color: var(--muted); max-width: 36ch; line-height: 1.45; }

@media (max-width: 560px) {
  .who span, .who a { display: none; }
  .who { padding-right: 4px; }
  .pill .label { display: none; }
  .brand span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble.pop, .card, .composer { animation: none; }
}
</style>
</head>
<body>

<canvas id="world" aria-label="The bud world: a floating island where everyone's buds wander around. Drag to look around, tap a bud to say hi."></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7C48 7 58 17 58 33c0 14-4 24-26 24S6 47 6 33C6 17 16 7 32 7z" class="mark-body"/><ellipse cx="21" cy="19" rx="7" ry="4" fill="#fff" opacity=".5" transform="rotate(-25 21 19)"/><ellipse cx="25" cy="34" rx="3.8" ry="5.2" class="mark-eye"/><ellipse cx="39" cy="34" rx="3.8" ry="5.2" class="mark-eye"/></svg><span>the buddie system</span></a>
  <div class="right">
    <button class="pill" id="findMe" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span class="label">Find my bud</span>
    </button>
    <button class="pill" id="photoBtn" type="button" hidden aria-label="Photo booth">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span class="label">Photo</span>
    </button>
    <button class="pill" id="notesPill" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/></svg>
      <span class="label">Notes</span><span class="badge" id="notesCount"></span>
    </button>
    <a class="pill" href="/" id="editLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span class="label">My bud</span>
    </a>
    <div class="pill who" id="who" hidden><img id="whoAvatar" alt="" width="24" height="24"><span id="whoName"></span><a href="/api/auth/logout">Sign out</a></div>
  </div>
</header>

<div class="title" id="title"><h1 id="titleText">Bud island</h1><p id="titleSub">Everyone&rsquo;s buds live here.</p></div>
<div class="hint" id="hint">Drag to look around &middot; scroll to zoom &middot; tap a bud to say hi</div>
<div class="card" id="card" hidden role="dialog" aria-labelledby="cardName">
  <h2 id="cardName"></h2><button type="button" class="x" id="cardClose" aria-label="Close">&times;</button>
  <p id="cardSub"></p>
  <div class="card-body" id="cardBody" aria-live="polite"></div>
</div>
<form class="composer" id="composer" hidden role="dialog" aria-labelledby="composerTitle">
  <p class="composer-title" id="composerTitle"></p>
  <div class="note" id="noteDraft">
    <textarea id="noteText" maxlength="120" placeholder="wanna be friends?" aria-label="Your note"></textarea>
    <span class="count" id="noteCount">0 / 120</span>
  </div>
  <div class="swatches" id="swatches" role="radiogroup" aria-label="Note color"></div>
  <p class="composer-error" id="noteError" role="alert" hidden></p>
  <div class="row"><button class="btn" type="button" id="noteCancel">Cancel</button><button class="btn primary" type="submit" id="noteSend">Stick it on</button></div>
</form>
<div class="photo-bar" id="photoBar" hidden role="region" aria-label="Photo booth">
  <p id="photoText"></p>
  <div class="row"><button class="btn" type="button" id="photoCancel">Cancel</button><button class="btn primary" type="button" id="photoGo">Line up</button></div>
</div>
<div class="countdown" id="countdown" hidden aria-live="assertive"></div>
<div class="booth" id="booth" hidden role="dialog" aria-modal="true" aria-label="Your photo">
  <div class="booth-card">
    <img id="boothImg" alt="">
    <input id="boothCaption" maxlength="100" placeholder="Add a caption (optional)" autocomplete="off" aria-label="Caption">
    <p class="msg" id="boothMsg" hidden></p>
    <div class="row">
      <a class="btn" id="boothSave" download="bud-island.jpg">Save</a>
      <span class="spacer"></span>
      <button class="btn" type="button" id="boothRetake">Retake</button>
      <button class="btn primary" type="button" id="boothPost">Post to #photo-booth</button>
    </div>
  </div>
</div>
<div class="center" id="center" hidden><div><h2 id="centerTitle"></h2><p id="centerText"></p><a class="pill" id="centerLink" href="/"></a></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<script type="module">
import { setExtents, buildMesh, drawEyeStyle, setClock, clamp, inPoly, distToPoly } from '/js/bud-core.js';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.3 : 1;
const canvas = document.getElementById('world');
const labels = document.getElementById('labels');
const params = new URLSearchParams(location.search);
const DROP = params.get('drop') === '1';
const OPEN_NOTES = params.get('notes') === '1';
if (DROP || OPEN_NOTES) history.replaceState(null, '', location.pathname);

const HELLOS = ['hi!', 'hey!', 'oh hi', 'hello!', 'yo', 'hiii'];
const POKED = ['hehe', 'hi there!', 'boop', 'oh! hello', 'that tickles'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const angleTo = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));

/* ---------------- renderer, camera, lights ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 600);
