<style>
/* Layout: the whole screen is sky with the floating island in the middle; a slim top bar, name tags and
   speech bubbles float over the 3D scene, and a small hint pill sits at the bottom. */
:root {
  --sky-top: #BFD9FF;
  --sky-bottom: #FBE3EF;
  --ink: #1D1C2B;
  --muted: #5E5D75;
  --chip: rgba(255, 255, 255, 0.62);
  --chip-line: rgba(29, 28, 43, 0.08);
  --tag: rgba(255, 255, 255, 0.88);
  --tag-ink: #1D1C2B;
  --me: #1D1C2B;
  --me-ink: #FFFFFF;
  --shadow: rgba(46, 40, 90, 0.2);
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0F1430; --sky-bottom: #2C1F45; --ink: #EDECF6; --muted: #A9A7C4;
    --chip: rgba(30, 32, 52, 0.66); --chip-line: rgba(255, 255, 255, 0.1);
    --tag: rgba(30, 32, 52, 0.85); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F;
    --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0F1430; --sky-bottom: #2C1F45; --ink: #EDECF6; --muted: #A9A7C4;
  --chip: rgba(30, 32, 52, 0.66); --chip-line: rgba(255, 255, 255, 0.1);
  --tag: rgba(30, 32, 52, 0.85); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F;
  --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font-display);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#world.dragging { cursor: grabbing; }
#world.over-bud { cursor: pointer; }

.topbar {
  position: fixed; z-index: 4; top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand .mark { width: 22px; height: 22px; flex: none; overflow: visible; }
.brand .mark-body { fill: #8DB9FF; stroke: rgba(62, 99, 184, .35); stroke-width: 3; }
.brand .mark-eye { fill: #15161F; }
.right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink); text-decoration: none;
  font: 500 14px/1 var(--font-display); white-space: nowrap; cursor: pointer;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.pill:hover { transform: translateY(-1px); }
.pill svg { width: 15px; height: 15px; }
.pill.icon-only { padding: 8px 10px; }
.pill.icon-only[aria-pressed="false"] { color: var(--muted); }
.who { padding: 4px 12px 4px 4px; font-size: 13.5px; cursor: default; }
.who:hover { transform: none; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.who a { color: var(--muted); text-decoration: none; font-size: 12.5px; }
.who a:hover, .who a:focus-visible { color: var(--ink); text-decoration: underline; }
.pill:focus-visible, .card button:focus-visible, .composer button:focus-visible, .composer textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E2557A; color: #fff; font-size: 11.5px; font-weight: 600; display: inline-grid; place-items: center; }

.title {
  position: fixed; z-index: 2; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px));
  text-align: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title h1 { margin: 0; font-size: clamp(24px, 3.6vw, 34px); font-weight: 600; letter-spacing: -0.015em; }
.title p { margin: 6px auto 0; max-width: 44ch; color: var(--muted); font-size: 15px; line-height: 1.45; }
.title.fade { transition: opacity 1.2s ease; opacity: 0; }
:root[data-sky="night"] .title h1, :root[data-sky="night"] .brand, :root[data-sky="night"] .center h2 { color: #F1F0FA; }
:root[data-sky="night"] .title p, :root[data-sky="night"] .center p { color: #C9C7E6; }
body { transition: background 2s linear; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
  font: 500 12.5px/1 var(--font-display); white-space: nowrap; color: var(--tag-ink);
  background: var(--tag); padding: 5px 9px; border-radius: 9px; box-shadow: 0 6px 14px -10px var(--shadow);
}
.tag.me { background: var(--me); color: var(--me-ink); }
.tag.me::after { content: " \00b7 you"; opacity: .7; font-weight: 400; }
.bubble {
  position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
  background: var(--tag); color: var(--tag-ink); border: 1.5px solid var(--tag-ink);
  border-radius: 14px; padding: 6px 11px; font-size: 14px; font-weight: 500; line-height: 1.3;
  width: max-content; max-width: 220px; text-align: center;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: inherit;
  border-right: 1.5px solid var(--tag-ink); border-bottom: 1.5px solid var(--tag-ink); transform: translateX(-50%) rotate(45deg);
}
.bubble.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { scale: .6; opacity: 0; } to { scale: 1; opacity: 1; } }

.hint {
  position: fixed; z-index: 4; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; text-align: center;
  font-size: 13.5px; color: var(--muted); background: var(--chip); border: 1px solid var(--chip-line);
  padding: 9px 16px; border-radius: 999px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }

.card {
  max-height: min(64vh, 560px); overflow: auto;
  position: fixed; z-index: 5; left: 0; right: 0; margin-inline: auto; width: min(320px, calc(100% - 32px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
  background: var(--tag); color: var(--tag-ink); border: 1px solid var(--chip-line); border-radius: 22px;
  padding: 16px 18px; box-shadow: 0 20px 44px -24px var(--shadow);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 4px 12px;
  animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.card h2 { margin: 0; font-size: 22px; font-weight: 600; }
.card p { margin: 0; grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.card .tn { font-family: var(--font-mono); color: var(--tag-ink); background: rgba(127,127,160,.16); padding: 1px 6px; border-radius: 6px; }
.card .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px; }
.card-body { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; }
.card-body:empty { display: none; }
.card-body .muted { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); cursor: pointer;
  font: 500 14px/1 var(--font-display); padding: 10px 15px; border-radius: 999px; text-decoration: none;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn.primary { background: var(--me); color: var(--me-ink); border-color: transparent; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.friends { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14.5px; }
.friends::before, .tag.friend::before { content: "\2665"; color: #E2557A; }
.tag.friend::before { margin-right: 4px; }

/* Sticky notes: paper colors stay paper-colored in dark mode too. */
:root { --n-lemon: #FFE98A; --n-peach: #FFC6A5; --n-mint: #BDEFCF; --n-sky: #BFDFFF; --n-lilac: #DCCBFF; --paper-ink: #2B2A33; }
.note {
  position: relative; background: var(--n-lemon); color: var(--paper-ink); border-radius: 3px 3px 3px 14px;
  padding: 14px 14px 12px; box-shadow: 0 10px 18px -12px rgba(30, 25, 60, .45); transform: rotate(-1.2deg);
}
.note:nth-child(even) { transform: rotate(1deg); }
.note::before {
  content: ""; position: absolute; top: -7px; left: 50%; width: 46px; height: 14px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255, 255, 255, .55); border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.note .text { margin: 0; font-size: 17px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.note .from { margin: 8px 0 0; font-size: 12.5px; opacity: .7; }
.note .row { margin-top: 10px; }
.note .btn { background: rgba(255,255,255,.6); color: var(--paper-ink); border-color: rgba(43,42,51,.12); padding: 8px 13px; font-size: 13.5px; }
.note .btn.primary { background: var(--paper-ink); color: #fff; }
.note.small .text { font-size: 15px; }

.composer {
  position: fixed; z-index: 6; left: 0; right: 0; margin-inline: auto; width: min(320px, calc(100% - 32px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
  background: var(--tag); color: var(--tag-ink); border: 1px solid var(--chip-line); border-radius: 22px;
  padding: 16px 18px 18px; box-shadow: 0 20px 44px -24px var(--shadow);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  display: grid; gap: 12px; justify-items: center; animation: rise .35s cubic-bezier(.2, .9, .3, 1.15);
}
.composer-title { margin: 0; font-weight: 600; font-size: 17px; justify-self: start; }
.composer .note { width: 220px; height: 200px; box-sizing: border-box; display: grid; padding: 18px 16px 10px; transform: rotate(-2deg); }
.composer textarea {
  appearance: none; border: 0; background: transparent; resize: none; color: var(--paper-ink); width: 100%; height: 100%;
  font: 500 19px/1.3 var(--font-display); padding: 0; border-radius: 4px;
}
.composer textarea::placeholder { color: rgba(43, 42, 51, .45); }
.composer .count { justify-self: end; font: 11.5px var(--font-mono); opacity: .55; }
.swatches { display: flex; gap: 10px; }
.swatch { appearance: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.swatch[aria-checked="true"] { border-color: var(--ink); }
.swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.composer-error { margin: 0; color: #C4385E; font-size: 13.5px; text-align: center; }
.composer .row { justify-content: flex-end; width: 100%; }
.flying { position: fixed; z-index: 7; margin: 0; pointer-events: none; }
.common { margin: 2px 0 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 210, 90, .18); }
.common h3 { margin: 0 0 6px; font-size: 14px; }
.common.common-lots { background: rgba(255, 190, 60, .28); }
.common .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.common .chip { background: rgba(255,255,255,.55); border-radius: 999px; padding: 3px 10px; font-size: 13.5px; color: #3A2E10; }
.wardrobe { margin: 0 0 10px; }
.wardrobe summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 4px 0; }
.wardrobe h4 { margin: 8px 0 4px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; opacity: .65; }
.wardrobe .items { display: flex; flex-wrap: wrap; gap: 6px; }
.wardrobe .item { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--chip-line); background: rgba(127,127,160,.08); color: inherit; border-radius: 12px; padding: 5px 10px 5px 7px; font: 500 13px var(--font, inherit); cursor: pointer; }
.wardrobe .item .ico { font-size: 17px; line-height: 1; }
.wardrobe .item.on { border-color: currentColor; background: rgba(127,127,160,.2); font-weight: 650; }
.about { margin: 4px 0 10px; }
.about-row { gap: 10px; margin-bottom: 8px; }
.about-row .muted { font-size: 13px; }
.knows summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 4px 0; }
.knows .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.knows .chip { display: inline-flex; align-items: center; gap: 2px; background: rgba(127,127,160,.13); border-radius: 999px; padding: 3px 4px 3px 11px; font-size: 13.5px; }
.knows .chip button { border: 0; background: none; color: inherit; opacity: .6; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; font-size: 15px; }
.knows .chip button:hover { opacity: 1; background: rgba(127,127,160,.2); }
.share-row { justify-content: space-between; gap: 8px; }
.share-row .muted { font-size: 13px; }
.share-row .btn { padding: 7px 12px; font-size: 13px; }
.dm-row { justify-content: space-between; border-top: 1px solid var(--chip-line); padding-top: 10px; }
.dm-row .muted { font-size: 13px; }
.dm-row .btn { padding: 7px 12px; font-size: 13px; }
/* ---------- The Island Times ---------- */
.pill .newdot { width: 8px; height: 8px; border-radius: 50%; background: #E2557A; margin-left: -2px; }
.paper-wrap {
  position: fixed; inset: 0; z-index: 11; display: grid; place-items: start center; overflow-y: auto;
  background: rgba(20, 18, 40, .5); padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 32px; box-sizing: border-box;
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.paper {
  --paper: #FBF7EE; --paper-ink: #2B2A33; --paper-mute: #6E6A79; --paper-rule: rgba(43, 42, 51, .2); --paper-tint: #F2EBDC;
  position: relative; width: min(640px, 100%); box-sizing: border-box; padding: 28px 30px 24px; border-radius: 18px;
  background: var(--paper); color: var(--paper-ink); box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .6);
  background-image: radial-gradient(rgba(120, 100, 60, .05) 1px, transparent 1px); background-size: 4px 4px;
  animation: rise .4s cubic-bezier(.2, .9, .3, 1.1); font-family: var(--font-display);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .paper { --paper: #26232F; --paper-ink: #EEEAF6; --paper-mute: #A9A4BA; --paper-rule: rgba(238, 234, 246, .18); --paper-tint: #302C3B; } }
:root[data-theme="dark"] .paper { --paper: #26232F; --paper-ink: #EEEAF6; --paper-mute: #A9A4BA; --paper-rule: rgba(238, 234, 246, .18); --paper-tint: #302C3B; }
.paper .x { position: absolute; top: 12px; right: 14px; appearance: none; border: 0; background: none; color: var(--paper-mute); font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.paper .x:focus-visible { outline: 2px solid var(--paper-ink); }
.mast { text-align: center; border-bottom: 3px double var(--paper-rule); padding-bottom: 12px; margin-bottom: 16px; }
.mast .kicker { margin: 0; font: 500 11.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); }
.mast h2 { margin: 6px 0 4px; font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(34px, 7vw, 50px); letter-spacing: -0.02em; line-height: 1; }
.mast .dateline { margin: 8px 0 0; display: flex; justify-content: space-between; font: 500 12px var(--font-mono); color: var(--paper-mute); border-top: 1px solid var(--paper-rule); padding-top: 7px; }
.paper.spooky .mast h2 { color: #E0731A; }
.paper .lede { font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 1.45; margin: 0 0 18px; font-style: italic; color: var(--paper-ink); }
.paper .lede::first-letter { font-style: normal; font-weight: 800; font-size: 3em; float: left; line-height: .8; margin: 6px 8px 0 0; }
.paper .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--paper-rule); border-bottom: 1px solid var(--paper-rule); margin-bottom: 18px; }
.paper .stat { text-align: center; padding: 12px 6px; }
.paper .stat + .stat { border-left: 1px solid var(--paper-rule); }
.paper .stat b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 34px; line-height: 1.05; }
.paper .stat span { font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); }
.paper section.col { margin-bottom: 16px; }
.paper h3 { margin: 0 0 10px; font: 600 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); display: flex; align-items: center; gap: 10px; }
.paper h3::after { content: ""; flex: 1; height: 1px; background: var(--paper-rule); }
.paper .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
.por { --c: #CFC8BA; position: relative; display: inline-block; flex: none; width: 34px; height: 30px; background: var(--c) center / cover;
  border-radius: 50% 50% 44% 44% / 58% 58% 42% 42%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 6px -3px rgba(0,0,0,.4); }
.por::before, .por::after { content: ""; position: absolute; top: 44%; width: 4px; height: 6px; border-radius: 50%; background: #15161F; }
.por::before { left: 34%; } .por::after { right: 34%; }
.por.big { width: 76px; height: 66px; }
.por.big::before, .por.big::after { width: 7px; height: 11px; }
.paper .newbuds { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.paper .budtag { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; }
.paper .pairs { display: grid; gap: 8px; }
.paper .pair { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; }
.paper .pair .heart { color: #E2557A; margin: 0 2px; }
.paper .spot { display: flex; gap: 14px; align-items: center; background: var(--paper-tint); border-radius: 14px; padding: 12px 14px; }
.paper .spot h4 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 700; }
.paper .spot p { margin: 2px 0 0; color: var(--paper-mute); font-size: 13.5px; }
.paper .spot blockquote { margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px; color: var(--paper-ink); }
.paper .gossip { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.paper .gossip li { display: flex; gap: 10px; align-items: center; font-size: 15px; line-height: 1.35; }
.paper .gossip b { font-weight: 600; }
.paper .quiet { margin: 0; color: var(--paper-mute); font-size: 14px; }
.paper footer { margin-top: 14px; padding-top: 10px; border-top: 3px double var(--paper-rule); text-align: center; font: 500 11.5px var(--font-mono); color: var(--paper-mute); letter-spacing: .06em; }
@media (max-width: 560px) {
  .paper { padding: 22px 18px 18px; }
  .paper .grid2 { grid-template-columns: 1fr; }
  .paper .lede { font-size: 17px; }
  .paper .stat b { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .paper { animation: none; } }
.diary h3 { margin: 4px 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<script type="module">
import { setExtents, buildMesh, drawEyeStyle, setClock, clamp, inPoly, distToPoly, SPACING as EYE_SPACING } from '/js/bud-core.js';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.3 : 1;
// sound effects and bud voices (js/sound.js); silent stand-in if it didn't load
const S = window.BudSound || { play() {}, babble() {}, ambient() {}, bindToggle() {}, onChange() {}, muted: true };
// buds further from the camera are quieter
const near = (bud, k = 1) => (bud && bud.root ? clamp(14 / Math.max(1, camera.position.distanceTo(bud.root.position)), 0, 1) * k : k);
const canvas = document.getElementById('world');
const labels = document.getElementById('labels');
const params = new URLSearchParams(location.search);
const DROP = params.get('drop') === '1';
const OPEN_NOTES = params.get('notes') === '1';
const GAME_ID = /^[A-Za-z0-9]{10,40}$/.test(params.get('game') || '') ? params.get('game') : null;
if (DROP || OPEN_NOTES || params.get('news') === '1') history.replaceState(null, '', location.pathname);

const HELLOS = ['hi!', 'hey!', 'oh hi', 'hello!', 'yo', 'hiii'];
const POKED = ['hehe', 'hi there!', 'boop', 'oh! hello', 'that tickles'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const angleTo = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));

/* ---------------- renderer, camera, lights ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 600);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8d96b8, 0.45); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6ea, 0.8); sun.position.set(-8, 16, 10); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(10, 4, -6); scene.add(fill);

function makeEnv(k = 1) {
  const s = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 32, 16), pos = g.attributes.position, cols = [];
  for (let i = 0; i < pos.count; i++) { const t = (pos.getY(i) / 10 + 1) / 2; cols.push((0.32 + 0.68 * t) * k, (0.35 + 0.65 * t) * k, (0.42 + 0.58 * t) * k * 1.15); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (x, y, z, w, h, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(-5, 6, 6, 6, 3, 4 * k); panel(7, 1, 3, 2, 6, 2.2 * k); panel(0, -3, -8, 8, 2, 1.2 * k);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.03).texture; pm.dispose();
  return tex;
}
const ENV_DAY = makeEnv(1), ENV_NIGHT = makeEnv(0.28);
scene.environment = ENV_DAY;

/* ---------------- the island ---------------- */
let R = 12;              // island radius, set once we know how many buds live here
let WALK_R = R * 0.78;   // how far from the middle buds wander
const obstacles = [];    // trees and rocks buds walk around: { x, z, r }
const flowers = [];      // where the little flowers are, for buds who like to smell them
const clouds = [];

const toLinear = (hex) => new THREE.Color(hex).convertSRGBToLinear();

function islandEdge(a, seed) {
  return 1 + 0.05 * Math.sin(3 * a + seed) + 0.035 * Math.sin(5 * a + seed * 2.3) + 0.02 * Math.sin(9 * a + seed * 0.7);
}

function buildIsland(nBuds) {
  R = clamp(9 + Math.sqrt(nBuds) * 2.2, 11, 30);
  WALK_R = R * 0.78;
  const seed = 2.1;
  const group = new THREE.Group();

  // grassy top with a soft rounded rim
  const shape = new THREE.Shape();
  const N = 96;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2, r = R * islandEdge(a, seed);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? shape.lineTo(x, y) : shape.moveTo(x, y);
  }
  const depth = 0.9, bevel = 0.5;
  const topGeo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: 0.55, bevelSegments: 5, curveSegments: 64 });
  topGeo.rotateX(-Math.PI / 2);
  topGeo.translate(0, -(depth + bevel), 0);
  const grass = new THREE.MeshStandardMaterial({ color: toLinear('#86CF86'), roughness: 0.95, envMapIntensity: 0.35 });
  const grassSide = new THREE.MeshStandardMaterial({ color: toLinear('#6DB774'), roughness: 0.95, envMapIntensity: 0.35 });
  group.add(new THREE.Mesh(topGeo, [grass, grassSide]));

  // rocky underside, a lumpy upside-down cone
  const h = R * 0.85;
  const cone = new THREE.ConeGeometry(R * 1.0, h, 30, 7, true);
  cone.rotateX(Math.PI);
  const pos = cone.attributes.position, colors = [];
  const ur = seeded('underside');
  const soilTop = new THREE.Color('#C9A27A'), soilTip = new THREE.Color('#7F6250');
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const t = (h / 2 - y) / h;   // 0 at the top ring, 1 at the tip
    const a = Math.atan2(z, x), rr = Math.hypot(x, z);
    const edge = islandEdge(a, seed);
    const jitter = t > 0.02 ? 1 + 0.12 * Math.sin(a * 7 + t * 9) + (ur() - 0.5) * 0.12 : 1;
    pos.setXYZ(i, Math.cos(a) * rr * edge * jitter, y + (t > 0.05 && t < 0.98 ? (ur() - 0.5) * 0.5 : 0), Math.sin(a) * rr * edge * jitter);
    const c = soilTop.clone().lerp(soilTip, t);
    colors.push(c.r, c.g, c.b);
  }
  cone.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const rock = cone.toNonIndexed(); rock.computeVertexNormals();
  const under = new THREE.Mesh(rock, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  under.position.y = -(depth + bevel) - h / 2 + 0.05;
  group.add(under);

  // trees and rocks near the rim
  const trunkMat = new THREE.MeshStandardMaterial({ color: toLinear('#A47551'), roughness: 1 });
  const leafCols = ['#7FCB8A', '#A6E3A1', '#6BBF7A', '#B9E8B0'].map((c) => new THREE.MeshStandardMaterial({ color: toLinear(c), roughness: 0.9, flatShading: true }));
  const rockMat = new THREE.MeshStandardMaterial({ color: toLinear('#B7B5C6'), roughness: 1, flatShading: true });
  const place = (minR, maxR, clear, rnd) => {
    for (let tries = 0; tries < 40; tries++) {
      const a = rnd() * Math.PI * 2, r = R * islandEdge(a, seed) * (minR + rnd() * (maxR - minR));
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (obstacles.every((o) => Math.hypot(o.x - x, o.z - z) > o.r + clear)) return { x, z };
    }
    return null;
  };
  const trees = Math.round(R * 0.55);
  for (let i = 0; i < trees; i++) {
    const tr = seeded('tree:' + i), p = place(0.74, 0.92, 2.2, tr); if (!p) continue;
    const s = 0.8 + tr() * 0.55, t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.1 * s, 7), trunkMat); trunk.position.y = 0.55 * s; t.add(trunk);
    const m = leafCols[i % leafCols.length];
    for (let k = 0; k < 3; k++) {
      const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry((0.85 - k * 0.2) * s, 0), m);
      leaf.position.set((tr() - 0.5) * 0.3 * s, (1.25 + k * 0.5) * s, (tr() - 0.5) * 0.3 * s); leaf.rotation.y = tr() * 3;
      t.add(leaf);
    }
    t.position.set(p.x, 0, p.z); group.add(t);
    obstacles.push({ x: p.x, z: p.z, r: 0.9 * s });
  }
  for (let i = 0; i < Math.round(R * 0.4); i++) {
    const rr = seeded('rock:' + i), p = place(0.35, 0.9, 1.2, rr); if (!p) continue;
    const s = 0.25 + rr() * 0.3, rk = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rk.position.set(p.x, s * 0.45, p.z); rk.rotation.set(rr(), rr(), rr()); group.add(rk);
    obstacles.push({ x: p.x, z: p.z, r: s + 0.2 });
  }
  // little flowers, just for looks
  const petal = ['#FFB3C7', '#FFE08A', '#FFFFFF', '#C9B8FF'].map((c) => new THREE.MeshStandardMaterial({ color: toLinear(c), roughness: 0.8 }));
  const stem = new THREE.MeshStandardMaterial({ color: toLinear('#5FA868') });
  for (let i = 0; i < Math.round(R * 2.5); i++) {
    const fr = seeded('flower:' + i), a = fr() * Math.PI * 2, r = Math.sqrt(fr()) * R * 0.92;
    const f = new THREE.Group();
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 4), stem); st.position.y = 0.11; f.add(st);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), petal[i % petal.length]); head.position.y = 0.24; f.add(head);
    f.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); group.add(f);
    flowers.push({ x: f.position.x, z: f.position.z });
  }

  // clouds drifting around the island
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92, emissive: 0xffffff, emissiveIntensity: 0.15 });
  skyBits.cloudMat = cloudMat;
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 4; k++) {
      const s = rand(0.9, 1.8);
      const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 14, 10), cloudMat);
      puff.position.set(k * 1.3 - 2, rand(-0.3, 0.3), rand(-0.6, 0.6)); c.add(puff);

function makePumpkin(size, glowing) {
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(size, 20, 14), pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), a = Math.atan2(z, x);
    const k = 1 + 0.07 * Math.cos(a * 8);

  }
  geo.computeVertexNormals();
  const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: toLinear('#F08A24'), roughness: 0.7, emissive: toLinear('#FF6A10'), emissiveIntensity: 0 }));
  body.position.y = size * 0.8; g.add(body); g.userData.body = body;

  stem.position.y = size * 1.75; stem.rotation.z = 0.2; g.add(stem);
  if (glowing) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'); x.fillStyle = '#fff';
    x.beginPath(); x.moveTo(28, 52); x.lineTo(48, 30); x.lineTo(58, 56); x.fill();   // eyes
    x.beginPath(); x.moveTo(100, 52); x.lineTo(80, 30); x.lineTo(70, 56); x.fill();
    x.beginPath(); x.moveTo(20, 74); x.lineTo(34, 92); x.lineTo(46, 80); x.lineTo(58, 96); x.lineTo(70, 80); x.lineTo(82, 96); x.lineTo(94, 80); x.lineTo(108, 74); x.lineTo(96, 104); x.lineTo(32, 104); x.closePath(); x.fill();
    const tex = new THREE.CanvasTexture(c);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(size * 1.5, size * 1.5), new THREE.MeshBasicMaterial({ map: tex, transparent: true, color: 0x3A1D08, depthWrite: false }));

  return g;
}

// Halloween gear: handed out at random each season (lib/wardrobe.js), worn from the wardrobe
function halloweenGroup(bud, kind) {
  const b = bud.b, top = b.r.reduce((m, p) => (p.y < m.y ? p : m), b.r[0]);
  const unit = b.w;   // costume sizes in the bud's own pixel units

    const cone = new THREE.Mesh(new THREE.ConeGeometry(unit * 0.15, unit * 0.5, 16), hatMat); cone.position.y = unit * 0.27; cone.rotation.z = 0.22;
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(unit * 0.23, unit * 0.23, unit * 0.02, 24), hatMat);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(unit * 0.172, unit * 0.172, unit * 0.04, 16), new THREE.MeshStandardMaterial({ color: toLinear('#F08A24') }));
    band.position.y = unit * 0.05;

      const m = new THREE.Mesh(geo, mat);

      const near = b.r.filter((p) => Math.abs(p.x - x) < unit * 0.08);

const propMats = {};

function headYAt(b, x, tol) { const near = b.r.filter((p) => Math.abs(p.x - x) < tol); return near.length ? Math.min(...near.map((p) => p.y)) : topOf(b).y; }

  const near = b.r.filter((p) => Math.abs(p.y - y) < tol);
  if (!near.length) return { l: b.minX, r: b.maxX };
  return { l: Math.min(...near.map((p) => p.x)), r: Math.max(...near.map((p) => p.x)) };

function faceGlasses(bud, kind) {

function headRing(bud, hex, extra) {

// what a bud wears: { head, hand } prop ids from the server (or the wardrobe when you change it)
function applyWear(bud) {
  for (const k of ['headProp', 'handProp']) if (bud[k]) { bud.inner.remove(bud[k]); bud[k] = null; }
  bud.pet = null;
  const w = bud.data.wear || {}, u = bud.b.w;
  if (w.head && HEAD[w.head]) { try { bud.headProp = HEAD[w.head](bud); bud.inner.add(bud.headProp); } catch (e) { console.error('prop', w.head, e); } }
  const H = w.hand && HAND[w.hand];
  if (H) {
    try {
      const g = new THREE.Group(), item = H.make(u); g.add(item);
      g.position.copy(H.at === 'held' ? heldSpot(bud) : groundSpot(bud));
      g.scale.setScalar(H.pet ? 1.2 : H.at === 'held' ? 1.7 : 1.5);   // big enough to read from across the island
      if (H.pet) { g.position.x += u * 0.08; bud.pet = item; }
      bud.handProp = g; bud.inner.add(g);
    } catch (e) { console.error('prop', w.hand, e); }
  }
}


function updateSky(dt) {
  if (T >= skyBits.nextSky) {
    skyBits.nextSky = T + 1;
    const k = skyAt(localHour());
    const root = document.documentElement.style;
    root.setProperty('--sky-top', k.top); root.setProperty('--sky-bottom', k.bottom);
    document.documentElement.dataset.sky = k.night > 0.45 ? 'night' : 'day';
    sun.intensity = k.sun; sun.color.set(k.sunColor).convertSRGBToLinear(); hemi.intensity = k.hemi;
    hemi.color.set(mixHex('#FFFFFF', '#8E9CFF', k.night)).convertSRGBToLinear();
    fill.intensity = 0.22 * (1 - k.night * 0.7);
    const h = localHour(), az = (h / 24) * Math.PI * 2;
    sun.position.set(Math.cos(az) * 14, 8 + 10 * Math.max(0.2, Math.sin((h - 6) / 12 * Math.PI)), Math.sin(az) * 14);
    scene.environment = k.night > 0.5 ? ENV_NIGHT : ENV_DAY;
    if (skyBits.cloudMat) { skyBits.cloudMat.color.set(mixHex('#FFFFFF', '#59608F', k.night)).convertSRGBToLinear(); skyBits.cloudMat.emissiveIntensity = 0.15 * (1 - k.night); }
    NIGHT = k.night;
    if (S.setNight) S.setNight(NIGHT > 0.5);
  }
  const n = NIGHT;
  if (skyBits.stars) { skyBits.stars.material.opacity = n; skyBits.stars.rotation.y += dt * 0.003; }
  if (skyBits.moon) skyBits.moon.material.opacity = n;
  const f = skyBits.fire;
  if (f) {
    const lit = clamp((n - 0.15) / 0.5, 0, 1);
    f.flames.forEach((fl, i) => {
      const flick = 1 + Math.sin(T * (9 + i * 3) + i) * 0.12 + Math.sin(T * 23 + i * 2) * 0.06;
      fl.scale.set(lit * (1 + Math.sin(T * 7 + i) * 0.08), lit * flick + 0.0001, lit * (1 + Math.cos(T * 6 + i) * 0.08));
      fl.visible = lit > 0.02;
    });
    f.light.intensity = lit * (1.6 + Math.sin(T * 13) * 0.25);
  }

// Same bud, same spots, every visit.
function seeded(str) {

  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }

const probeRay = new THREE.Raycaster();

  const onFace = (x, y) => Math.abs(x - b.eyeRel.x) < er * 2.5 && Math.abs(y - b.eyeRel.y) < er * 1.8;
  for (let tries = 0; tries < 400 && spots.length < 8; tries++) {

function freeSpot(minDistFromOthers = 2.2, near = null, spread = WALK_R) {
  for (let tries = 0; tries < 60; tries++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * spread;
    const x = (near ? near.x : 0) + Math.cos(a) * r, z = (near ? near.z : 0) + Math.sin(a) * r;

function say(bud, text, ms = 1800) {

  else if (text === '!') S.play('alert', { gain: near(bud, 1.2) });

/* ---------------- behaviour ---------------- */
const tmp = new THREE.Vector3();

function startGreeting(a, b) {
  for (const [me, other] of [[a, b], [b, a]]) {
    me.state = 'greet'; me.partner = other; me.timer = 2.4; me.greetCooldown = rand(14, 24);
    me.happyUntil = T + 1.2; me.syv -= 0.09; me.target = null;
  }
  say(a, pick(HELLOS), 1600);
  setTimeout(() => { if (b.state === 'greet') say(b, pick(HELLOS), 1500); }, 500);
}

function updateBud(bud, dt) {

  bud.greetCooldown -= dt;

    if (bud.y <= 0) {
      bud.y = 0; bud.vy = 0; bud.sy = 0.5; bud.syv = 0.04; bud.state = 'idle'; bud.timer = 2.5;
      bud.happyUntil = T + 1.6; puff(bud.x, bud.z);
      S.play('thump', { gain: near(bud, 1.4) });
      say(bud, 'hi everyone!', 2600);
      welcome(bud);
    }
  } else if (bud.state === 'idle') {
    if (!bud.held) bud.timer -= dt;
    if (T > bud.lookUntil && Math.random() < dt * 0.5) {
      const other = nearestBud(bud, 6);
      bud.look = other && Math.random() < 0.6 ? other : { x: bud.x + rand(-4, 4), z: bud.z + rand(-4, 4), y: rand(0, 2) };
      bud.lookUntil = T + rand(1, 2.6);
    }
    if (bud.timer <= 0 && !bud.held) {
      if (!(Math.random() < 0.5 && startActivity(bud))) {
        bud.target = freeSpot(1.6, Math.random() < 0.6 ? bud : null, Math.random() < 0.6 ? rand(3, 7) : WALK_R);
        bud.state = 'walk'; bud.look = null;

}

/* ---------------- what buds do with their time ---------------- */
// Each bud has a favorite thing (its hobby) and does it more often than the rest.
const ACTS = ['clouds', 'nap', 'explore', 'flowers', 'hop', 'tag', 'fire'];
const HOBBY_ACT = { clouds: 'clouds', stargazing: 'clouds', explore: 'explore', pebbles: 'explore', flowers: 'flowers', hopping: 'hop', naps: 'nap', races: 'tag' };

function startActivity(bud) {

  if (kind === 'nap') {

    const napping = buds.filter((b) => b.state === 'act' && b.act.kind === 'nap').length;
    if (napping >= Math.max(1, Math.floor(buds.length * (NIGHT > 0.5 ? 0.25 : 0.15)))) return false;
    setAct(bud, { kind, until: T + rand(7, 12), tilt: 0.06, next: T + 1 });
  } else if (kind === 'clouds') {
    setAct(bud, { kind, until: T + rand(5, 9), tilt: -0.24, next: T + rand(1.5, 3) });
    bud.look = { x: bud.x + Math.sin(h), z: bud.z + Math.cos(h), y: 30 }; bud.lookUntil = bud.act.until;
  } else if (kind === 'hop') {
    setAct(bud, { kind, until: T + rand(3, 5), next: T + 0.2, said: false });
  } else if (kind === 'fire') {
    const f = skyBits.fire;
    if (!f) return false;
    // a free seat in the circle round the fire
    let seat = null;
    for (let i = 0; i < 10 && !seat; i++) {
      const a = Math.random() * Math.PI * 2, r = rand(1.9, 2.5);
      const p = { x: f.x + Math.cos(a) * r, z: f.z + Math.sin(a) * r };
      if (buds.every((o) => o === bud || Math.hypot(o.x - p.x, o.z - p.z) > 1.5) && obstacles.every((o) => o.x === f.x || Math.hypot(o.x - p.x, o.z - p.z) > o.r + 0.7)) seat = p;
    }
    if (!seat) return false;
    goThenDo(bud, seat, () => {
      bud.heading = Math.atan2(f.x - bud.x, f.z - bud.z);
      setAct(bud, { kind: 'fire', until: T + rand(12, 24), next: T + rand(2, 6), tilt: 0.04 });
      bud.look = { x: f.x, z: f.z, y: 0.6 }; bud.lookUntil = bud.act.until;
    });
  } else if (kind === 'explore') {
    // wander to the edge of the island and peek over
    let spot = null;
    for (let i = 0; i < 12 && !spot; i++) {
      const a = Math.atan2(bud.z, bud.x) + rand(-0.8, 0.8), r = WALK_R * 0.97;
      const p = { x: Math.cos(a) * r, z: Math.sin(a) * r };
      if (!obstacles.some((o) => Math.hypot(o.x - p.x, o.z - p.z) < o.r + 0.9)) spot = p;
    }
    if (!spot) return false;
    goThenDo(bud, spot, () => {
      bud.heading = Math.atan2(bud.x, bud.z);   // face outward
      const pebble = bud.data.hobby === 'pebbles' && Math.random() < 0.6;
      setAct(bud, { kind: 'peek', until: T + rand(3.5, 5), tilt: pebble ? 0.42 : 0.3 });
      bud.look = { x: bud.x * 1.6, z: bud.z * 1.6, y: pebble ? -1 : -6 }; bud.lookUntil = bud.act.until;
      say(bud, pebble ? pick(['found a pebble!', 'ooh, shiny', 'this one’s perfect']) : pick(['woah, it’s high up', 'I can see so far!', 'hello down there!', 'is that the ocean?']), 1800);
    });
  } else if (kind === 'flowers') {
    const near = flowers.filter((f) => Math.hypot(f.x - bud.x, f.z - bud.z) < 7 && Math.hypot(f.x, f.z) < WALK_R)
      .sort((a, b) => Math.hypot(a.x - bud.x, a.z - bud.z) - Math.hypot(b.x - bud.x, b.z - bud.z))[0];
    if (!near) return false;
    const a = Math.atan2(bud.z - near.z, bud.x - near.x);
    goThenDo(bud, { x: near.x + Math.cos(a) * 0.9, z: near.z + Math.sin(a) * 0.9 }, () => {
      bud.heading = Math.atan2(near.x - bud.x, near.z - bud.z);
      setAct(bud, { kind: 'sniff', until: T + 3, tilt: 0.34 });
      bud.look = { x: near.x, z: near.z, y: -2 }; bud.lookUntil = bud.act.until;
      say(bud, pick(['sniff sniff', 'smells nice', 'achoo!', 'mmm, flowers']), 1500);
    });
  } else if (kind === 'tag') {
    const mate = buds.filter((o) => o !== bud && !busy(o) && Math.hypot(o.x - bud.x, o.z - bud.z) < 9)
      .sort((a, b) => Math.hypot(a.x - bud.x, a.z - bud.z) - Math.hypot(b.x - bud.x, b.z - bud.z))[0];
    if (!mate) return false;
    const game = { it: bud, until: T + rand(9, 14), startAt: T + 1.3, tagAt: T };
    for (const b of [bud, mate]) { setAct(b, { kind: 'tag', game, moving: false }); b.look = b === bud ? mate : bud; b.lookUntil = T + 1.3; }
    bud.heading = Math.atan2(mate.x - bud.x, mate.z - bud.z); mate.heading = Math.atan2(bud.x - mate.x, bud.z - mate.z);
    say(bud, pick(['wanna play tag?', 'tag? tag!', 'bet you can’t catch me']), 1300);
    setTimeout(() => { if (mate.act && mate.act.game === game) { say(mate, pick(['ok!', 'you’re on!', 'yes!!']), 1000); mate.happyUntil = T + 1; } }, 600);
  }
  return true;
}
function setAct(bud, act) { bud.state = 'act'; bud.act = act; bud.target = null; bud.partner = null; }
function goThenDo(bud, spot, fn) {
  bud.target = spot; bud.state = 'walk'; bud.look = null;
  bud.onArrive = { target: spot, fn };
}
function endActivity(bud, rest = rand(1.5, 4)) {
  if (bud.state === 'act') { bud.state = 'idle'; }
  bud.act = null; bud.look = null; bud.timer = rest; bud.hopPhase = 0;
}

function updateActivity(bud, dt) {
  const a = bud.act;
  if (!a) { endActivity(bud); return; }
  if (a.kind === 'nap') {
    // slow breathing, and the odd z
    bud.syv += Math.sin(T * 2.2) * 0.0016;
    if (T > a.next) { say(bud, pick(['z', 'zz', 'zzz']), 1200); a.next = T + rand(2, 3.2); }
  } else if (a.kind === 'fire') {
    if (NIGHT < 0.3) { endActivity(bud); return; }
    if (T > a.next) {
      say(bud, pick(HALLOWEEN
        ? ['spooky story time!', 'did you hear that?', 'the fire’s so cozy', 'boo! hehe', 'I saw a bat!']
        : ['so warm…', 'anyone have marshmallows?', 'tell us a story!', 'the stars are out', 'cozy…']), 1900);
      a.next = T + rand(6, 12); bud.happyUntil = T + 1;
    }
  } else if (a.kind === 'clouds') {
    if (T > a.next) {
      say(bud, NIGHT > 0.5 ? pick(['so many stars!', 'is that one twinkling?', 'make a wish!', 'the moon is so round']) : bud.data.hobby === 'stargazing' ? pick(['waiting for stars', 'is that one twinkling?', 'make a wish!']) : pick(['that cloud looks like a fish', 'ooh, a bunny cloud', 'so fluffy…', 'that one looks like me!']), 1800);
      a.next = Infinity;
    }
  } else if (a.kind === 'hop') {
    bud.vy -= 22 * dt; bud.y = Math.max(0, bud.y + bud.vy * dt);
    if (bud.y === 0 && bud.vy < 0) { bud.vy = 0; bud.syv -= 0.08 * RM; }
    if (T > a.next && bud.y === 0) { S.play('boing', { gain: near(bud, 0.5), rate: 1 + (bud.b.h % 5) / 20 }); bud.vy = 5.2 * RM; bud.syv += 0.06; a.next = T + rand(0.55, 0.8); if (!a.said) { a.said = true; say(bud, pick(['hop!', 'hop hop', 'boing!', 'look how high!']), 1200); } }
    if (T > a.until && bud.y === 0) { bud.y = 0; endActivity(bud); }
    return;
  } else if (a.kind === 'tag') {
    const g = a.game, other = buds.find((o) => o !== bud && o.act && o.act.game === g);
    if (!other || other.state !== 'act') { endActivity(bud); return; }
    if (T > g.until) {
      endActivity(bud); endActivity(other);
      bud.happyUntil = other.happyUntil = T + 1.5;
      say(bud, pick(['phew!', 'that was fun!', 'again later?']), 1500);
      return;
    }
    if (T < g.startAt) return;
    const it = g.it === bud;
    if (it && T < g.freezeUntil) {   // counting to three after being tagged
      a.moving = false;
      bud.heading += angleTo(bud.heading, Math.atan2(other.x - bud.x, other.z - bud.z)) * Math.min(1, dt * 5);
      return;
    }
    a.moving = true;
    let mx, mz;
    if (it) { mx = other.x - bud.x; mz = other.z - bud.z; }
    else {
      mx = bud.x - other.x; mz = bud.z - other.z;
      const r = Math.hypot(bud.x, bud.z);
      if (r > WALK_R * 0.75) { mx -= bud.x / r * 2.5; mz -= bud.z / r * 2.5; }   // don't get cornered at the edge
    }
    const d = Math.hypot(mx, mz) || 1;
    [mx, mz] = steerAround(bud, mx / d, mz / d);
    const m = Math.hypot(mx, mz) || 1, sp = (it ? 2.5 : 2.2) * bud.speed;
    moveSmoothly(bud, mx / m * sp, mz / m * sp, dt, 7);
    const before = Math.sin(bud.hopPhase); bud.hopPhase += dt * 11;
    if (Math.sin(bud.hopPhase) * before < 0) bud.syv -= 0.04 * RM;
    const touch = (bud.width + other.width) * 0.5 * 0.85 + 0.25;
    if (it && Math.hypot(other.x - bud.x, other.z - bud.z) < touch && T - g.tagAt > 1.2) {
      g.it = other; g.tagAt = T; g.freezeUntil = T + 1.8;
      S.play('giggle', { gain: near(bud, 0.8) });
      say(bud, pick(['tag! you’re it!', 'got you!', 'tag!']), 1100);
      bud.happyUntil = T + 1; other.syv -= 0.12;
      setTimeout(() => { if (other.act && other.act.game === g) say(other, pick(['no fair!', 'aaah!', 'hey!']), 700); }, 450);
      setTimeout(() => { if (other.act && other.act.game === g && g.it === other) say(other, '1… 2… 3!', 800); }, 1000);
    }
    return;
  }
  if (T > a.until) endActivity(bud);
}

// Steering around trees, rocks and pumpkins: rather than pushing straight back (which can cancel out the
// pull toward the target and leave a bud jittering in place), slide sideways around them, on whichever
// side is closer to where it's headed.
function steerAround(bud, mx, mz) {
  for (const o of obstacles) {
    const ox = bud.x - o.x, oz = bud.z - o.z, od = Math.hypot(ox, oz) || 1, reach = o.r + 1.2;
    if (od >= reach) continue;
    const w = (reach - od) / reach;
    let px = -oz / od, pz = ox / od;
    if (px * mx + pz * mz < 0) { px = -px; pz = -pz; }
    mx += (ox / od) * w * 0.9 + px * w * 1.8;
    mz += (oz / od) * w * 0.9 + pz * w * 1.8;
  }
  return [mx, mz];
}
// Ease the velocity toward where it wants to go, and face the way it's actually moving, so direction
// changes are smooth instead of flipping from frame to frame.
function moveSmoothly(bud, vx, vz, dt, k = 5) {
  const a = Math.min(1, dt * k);
  bud.vx = (bud.vx || 0) + (vx - (bud.vx || 0)) * a;
  bud.vz = (bud.vz || 0) + (vz - (bud.vz || 0)) * a;
  bud.x += bud.vx * dt; bud.z += bud.vz * dt;
  if (Math.hypot(bud.vx, bud.vz) > 0.25) bud.heading += angleTo(bud.heading, Math.atan2(bud.vx, bud.vz)) * Math.min(1, dt * 6);
}

// Buds are solid: if two get closer than their bodies allow, nudge them apart.
// Someone holding still (card open, posing, being written to) stays put and the other one moves.
function separateBuds() {
  for (let i = 0; i < buds.length; i++) {
    const a = buds[i];
    if (!a.placed || a.state === 'drop' || a.y > 1 || a.gameHidden || a.gamePiece) continue;
    for (let j = i + 1; j < buds.length; j++) {
      const b = buds[j];
      if (!b.placed || b.state === 'drop' || b.y > 1 || b.gameHidden || b.gamePiece) continue;
      const dx = b.x - a.x, dz = b.z - a.z, min = (a.width + b.width) * 0.5 * 0.85;
      if (Math.abs(dx) > min || Math.abs(dz) > min) continue;
      const d = Math.hypot(dx, dz);
      if (d >= min) continue;
      const nx = d > 1e-4 ? dx / d : Math.cos(i + j), nz = d > 1e-4 ? dz / d : Math.sin(i + j), push = min - d;
      const aStill = a.held || a.pose, bStill = b.held || b.pose;
      const wa = aStill && !bStill ? 0 : bStill && !aStill ? 1 : 0.5;
      a.x -= nx * push * wa; a.z -= nz * push * wa;
      b.x += nx * push * (1 - wa); b.z += nz * push * (1 - wa);
    }
  }
  // ...and trees, rocks, pumpkins and the campfire are solid too
  for (const b of buds) {
    if (!b.placed || b.state === 'drop' || b.y > 1 || b.gameHidden || b.gamePiece) continue;
    for (const o of obstacles) {
      const dx = b.x - o.x, dz = b.z - o.z, min = o.r + b.width * 0.3;
      if (Math.abs(dx) > min || Math.abs(dz) > min) continue;
      const d = Math.hypot(dx, dz);
      if (d >= min) continue;
      const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0;
      b.x = o.x + nx * min; b.z = o.z + nz * min;
    }
  }
}

function nearestBud(bud, within) {
  let best = null, bd = within;
  for (const o of buds) {
    if (o === bud || !o.placed || o.state === 'drop') continue;
    const d = Math.hypot(o.x - bud.x, o.z - bud.z);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// When a bud arrives, a few buds nearby wander over to say hi.
function welcome(newcomer) {
  const near = buds.filter((o) => o !== newcomer && o.placed && !o.held && !o.pose).sort((a, b) =>
    Math.hypot(a.x - newcomer.x, a.z - newcomer.z) - Math.hypot(b.x - newcomer.x, b.z - newcomer.z)).slice(0, 3);
  near.forEach((o, i) => {
    o.look = newcomer; o.lookUntil = T + 2;
    setTimeout(() => {
      const a = Math.atan2(o.z - newcomer.z, o.x - newcomer.x);
      o.target = { x: newcomer.x + Math.cos(a) * 1.9, z: newcomer.z + Math.sin(a) * 1.9 };
      o.state = 'walk'; o.greetCooldown = 0; o.greetOnArrive = newcomer;
    }, 900 + i * 700);
  });
}

// eyes: where they look, in the bud's own left/right and up/down
function lookVector(bud) {
  let tx, ty, tz;
  if (bud.look === 'camera' || (bud.lookCameraUntil && T < bud.lookCameraUntil)) { tx = camera.position.x; ty = camera.position.y; tz = camera.position.z; }
  else if (bud.look) { tx = bud.look.x; ty = (bud.look.height ? bud.look.height * 0.6 : bud.look.y || 0.8); tz = bud.look.z; }
  else return { x: 0, y: 0.1 };
  const dx = tx - bud.x, dz = tz - bud.z, dy = ty - (bud.y + bud.height * 0.6);
  // into the bud's own frame: +x is its right as you face it, +z is straight ahead
  const c = Math.cos(bud.heading), s = Math.sin(bud.heading);
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  const d = Math.hypot(lx, lz) || 1;
  return { x: clamp(lx / d * 1.3, -1, 1), y: clamp(-dy / Math.max(1.5, Math.hypot(d, dy)) * 1.4, -1, 1) };
}

function drawFace(bud) {
  const r = bud.b.eyeR, sc = FACE_W / (r * 4.4);
  const want = lookVector(bud);
  bud.lx += (want.x - bud.lx) * 0.2; bud.ly += (want.y - bud.ly) * 0.2;
  const bt = (T - bud.blinkStart) / 0.15;
  const napping = bud.state === 'act' && bud.act && bud.act.kind === 'nap';
  const blink = napping ? 1 : bt >= 0 && bt < 1 ? Math.sin(bt * Math.PI) : 0;
  const happy = T < bud.happyUntil;
  const key = [Math.round(bud.lx * 20), Math.round(bud.ly * 20), Math.round(blink * 8), happy].join('|');
  if (key === bud.faceKey) return;
  bud.faceKey = key;
  const g = bud.fctx;
  g.clearRect(0, 0, FACE_W, FACE_H);
  drawEyeStyle(g, bud.data.eyes, FACE_W / 2, FACE_H / 2, r * sc, blink, happy, bud.eyeCol, { x: bud.lx, y: bud.ly });
  bud.faceTex.needsUpdate = true;
}

const puffs = [];
const puffMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true });
function puff(x, z, k = 1) {

}

/* ---------------- camera: drag to orbit, scroll or pinch to zoom ---------------- */
const cam = { yaw: 0.6, pitch: 0.55, dist: 30, target: new THREE.Vector3(0, 0.8, 0), lastInput: -99, follow: null, followUntil: 0 };
const camGoal = { target: new THREE.Vector3(0, 0.8, 0), dist: 30 };
function placeCamera(dt) {
  if (cam.follow && T < cam.followUntil) {
    camGoal.target.set(cam.follow.x, cam.follow.y * 0.5 + 0.9, cam.follow.z);
  } else if (cam.follow) {
    cam.follow = null; camGoal.target.set(0, 0.8, 0); camGoal.dist = Math.max(camGoal.dist, fitDist() * 0.9);
  }
  const k = 1 - Math.pow(0.04, dt);
  cam.target.lerp(camGoal.target, k);
  cam.dist += (camGoal.dist - cam.dist) * k;
  if (camGoal.pitch != null) cam.pitch += (camGoal.pitch - cam.pitch) * k;
  if (camGoal.yaw != null) cam.yaw += angleTo(cam.yaw, camGoal.yaw) * k;
  if (T - cam.lastInput > 6 && !cam.follow && !game) cam.yaw += dt * 0.035 * RM;
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.yaw) * cp * cam.dist,
  );
  camera.lookAt(cam.target);
  // With a card or note pad open at the bottom, slide the picture up so the bud you're looking at sits above it.
  const panel = [document.getElementById('card'), document.getElementById('composer')].find((e) => !e.hidden);
  const want = game ? (gameBar.getBoundingClientRect().height + 24 - 64) / 2 : panel && cam.follow ? Math.min(panel.getBoundingClientRect().height * 0.5, innerHeight * 0.3) : 0;
  cam.shift = (cam.shift || 0) + (want - (cam.shift || 0)) * (1 - Math.pow(0.02, dt));
  if (Math.abs(cam.shift) > 0.5) camera.setViewOffset(innerWidth, innerHeight, 0, cam.shift, innerWidth, innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
}

const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: camGoal.dist }; drag = null;
  } else {
    drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: false };
  }
  cam.lastInput = T;
});
canvas.addEventListener('pointermove', (e) => {
  hoverAt(e.clientX, e.clientY);
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.lastInput = T;
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    camGoal.dist = clamp(pinch.dist * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), R * 0.7, maxDist());
    return;
  }
  if (!drag || framing()) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 4) { drag.moved = true; canvas.classList.add('dragging'); hideHint(); }
  cam.yaw = drag.yaw - dx * 0.006;
  cam.pitch = clamp(drag.pitch + dy * 0.004, 0.18, 1.25);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && !drag.moved && pointers.size === 0) clickAt(e.clientX, e.clientY);
  if (pointers.size === 0) drag = null;
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (framing()) return;
  camGoal.dist = clamp(camGoal.dist * Math.exp(e.deltaY * 0.0012), R * 0.7, maxDist());
  cam.lastInput = T; hideHint();
}, { passive: false });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function budAt(x, y) {

let hoverT = 0;

}

async function api(method, path, body) {
  const res = await fetch(path, {
    method, credentials: 'same-origin', cache: 'no-store',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}

}

const DIARY_ICON = { play: '✦', solo: '•', note: '✎', friend: '♥', photo: '◉', game: '◆' };
const firstPerson = (e) => (e.kind === 'play' || e.kind === 'solo' ? `I ${e.text}` : e.text);
function whenLabel(ms) {
  const now = new Date(), t = new Date(ms), mins = (now - t) / 60e3;
  if (mins < 60) return 'just now';
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const h = t.getHours(), part = h < 5 ? 'last night' : h < 12 ? 'this morning' : h < 17 ? 'this afternoon' : 'this evening';
  if (ms >= dayStart) return part;
  if (ms >= dayStart - 864e5) return h < 5 || h >= 21 ? 'last night' : 'yesterday';
  return `${Math.round((dayStart - ms) / 864e5) + 1} days ago`;
}

/* ---------------- writing a note ---------------- */
const composer = document.getElementById('composer');
const noteText = document.getElementById('noteText'), noteDraft = document.getElementById('noteDraft');
const noteError = document.getElementById('noteError'), noteSend = document.getElementById('noteSend');
const swatches = document.getElementById('swatches');
let composing = null, noteColor = 'lemon';
for (const c of NOTE_COLORS) {
  const b = el('button', 'swatch'); b.type = 'button';
  b.setAttribute('role', 'radio'); b.setAttribute('aria-label', c); b.dataset.color = c;

}
function setNoteColor(c) {
  noteColor = c;
  noteDraft.style.background = `var(--n-${c})`;
  swatches.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.color === c)));
}
noteText.addEventListener('input', () => { document.getElementById('noteCount').textContent = `${[...noteText.value].length} / 120`; });

function openComposer(bud, draft = '') {
  composing = bud;
  closeCard();
  document.getElementById('composerTitle').textContent = `A note for ${nameOf(bud)}`;
  noteText.value = draft; noteText.dispatchEvent(new Event('input'));
  setNoteColor(NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)]);
  noteError.hidden = true; noteSend.disabled = false;
  composer.hidden = false;
  // the bud waits patiently, facing you, while you write
  bud.held = true; bud.state = 'idle'; bud.target = null; bud.lookCameraUntil = T + 9999; bud.happyUntil = T + 1;
  cam.follow = bud; cam.followUntil = T + 9999; camGoal.dist = Math.max(8, R * 0.7); cam.lastInput = T;
  setTimeout(() => noteText.focus(), 60);
}
function closeComposer() {
  if (!composing) return;
  const bud = composing;
  composing = null; composer.hidden = true;
  bud.held = false; bud.timer = rand(1.5, 3); bud.lookCameraUntil = T + 1;
  cam.followUntil = T + 1.5;
}
document.getElementById('noteCancel').addEventListener('click', () => { const b = composing; closeComposer(); if (b) openCard(b); });

composer.addEventListener('submit', async (e) => {
  e.preventDefault();
  const bud = composing;
  if (!bud) return;
  noteSend.disabled = true; noteError.hidden = true;
  const text = noteText.value.trim() || noteText.placeholder;
  try {
    const res = await api('POST', '/api/notes', { to: bud.data.id, text, color: noteColor });
    // the note flies off the pad and slaps onto the bud
    const from = noteDraft.getBoundingClientRect(), to = slotOnScreen(bud);
    const flyer = noteEl(text, noteColor);
    flyer.classList.add('flying');
    Object.assign(flyer.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', boxSizing: 'border-box' });
    document.body.append(flyer);
    const color = noteColor;
    closeComposer();
    cam.followUntil = T + 3;
    const dx = to.x - (from.left + from.width / 2), dy = to.y - (from.top + from.height / 2);
    const anim = flyer.animate([
      { transform: 'rotate(-2deg) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 60}px) rotate(8deg) scale(.5)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) rotate(-6deg) scale(.08)`, opacity: 0.4 },
    ], { duration: 640 * Math.max(RM, 0.5), easing: 'cubic-bezier(.45, 0, .8, .6)' });
    anim.onfinish = () => { flyer.remove(); S.play('slap'); };
    S.play('whoosh', { gain: 0.6 });
    addSticky(bud, color, 'mine', 0.6 * Math.max(RM, 0.5));
    setTimeout(() => {
      bud.syv -= 0.14; bud.happyUntil = T + 1.6;
      if (res.friends) becameFriends(bud, true);
      else say(bud, pick(['ooh, a note!', 'for me?', 'hehe, it’s sticky']), 1800);
    }, 640);
    bud.data.myNote = res.note;
    if (res.friends) bud.data.myNote = null;
  } catch (err) {
    noteError.textContent = err.message; noteError.hidden = false; noteSend.disabled = false;
  }
});

async function takeBack(bud, btn) {
  btn.disabled = true;
  try {
    await api('DELETE', `/api/notes?to=${encodeURIComponent(bud.data.id)}`);
    removeSticky(bud, (st) => st.tag === 'mine');
    S.play('pop', { rate: 0.7 });
    bud.data.myNote = null;
    renderCardBody();
  } catch (err) { btn.disabled = false; say(bud, 'it’s stuck! try again?', 1600); }
}

async function answer(n, ans, btns) {
  btns.forEach((b) => { b.disabled = true; });
  const mine = myBud();
  try {
    await api('PATCH', '/api/notes', { from: n.from, answer: ans });
    inbox = inbox.filter((x) => x !== n);
    updateNotesPill();
    if (mine) removeSticky(mine, (st) => st.tag === n.from);
    S.play(ans === 'yes' ? 'chime' : 'pop', { rate: ans === 'yes' ? 1 : 0.8 });
    if (ans === 'yes') {
      const theirs = buds.find((b) => b.data.id === n.from);
      if (theirs) becameFriends(theirs, false);
      if (mine) { mine.happyUntil = T + 2; mine.syv -= 0.14; say(mine, 'a new friend!', 2000); }
    } else if (mine) say(mine, 'maybe another time', 1600);
    renderCardBody();
  } catch (err) {
    btns.forEach((b) => { b.disabled = false; });
    if (mine) say(mine, 'hmm, that didn’t work. try again?', 1800);

}

// Friends now: hearts on the name tag, and their bud comes over to say hi.
function becameFriends(bud, viaNote) {
  S.play('chime');
  bud.data.friend = true; bud.data.myNote = null;
  bud.tag.classList.add('friend');
  removeSticky(bud, (st) => st.tag === 'mine');
  bud.happyUntil = T + 2.4; bud.syv -= 0.12;
  say(bud, viaNote ? 'we’re friends now!' : 'yay, friends!', 2200);
  const mine = myBud();
  if (mine && mine.placed && bud.placed && bud.state !== 'drop') {
    setTimeout(() => {
      const a = Math.atan2(bud.z - mine.z, bud.x - mine.x);
      bud.target = { x: mine.x + Math.cos(a) * 1.9, z: mine.z + Math.sin(a) * 1.9 };
      bud.state = 'walk'; bud.greetCooldown = 0; bud.greetOnArrive = mine;
    }, 900);
  }
  if (cardBud === bud) renderCardBody();
}

// Your bud was busy with its own life. Then it notices you're here, and comes running.
function greetingFor(lastVisit) {
  if (!lastVisit) return pick(['oh! hi! welcome to the island!', 'you found the island!']);
  const away = Date.now() - lastVisit, min = 60e3, hr = 60 * min, day = 24 * hr;
  if (away < 10 * min) return pick(['oh, hi again!', 'back already? hehe']);
  if (away < 6 * hr) return pick(['you’re back!', 'hiii, you’re back!', 'there you are!']);
  if (away < 3 * day) return pick(['you’re back!! I missed you', 'hi!! where were you?']);
  return pick(['YOU’RE BACK!! it’s been forever', 'is that really you?! I missed you so much']);
}
function welcomeBack(mine, lastVisit) {
  if (photo || composing || mine.state === 'drop') return;
  // 1. it notices you
  mine.state = 'idle'; mine.target = null; mine.partner = null; mine.held = true;
  mine.lookCameraUntil = T + 30; mine.syv -= 0.12;
  say(mine, '!', 900);
  setTimeout(() => { mine.syv -= 0.16; }, 280);
  setTimeout(() => { mine.syv -= 0.16; mine.happyUntil = T + 1.5; }, 620);
  // 2. it runs to the front of the island, toward you
  setTimeout(() => {
    if (photo || composing) { mine.held = false; return; }
    const yaw = cam.yaw, f = { x: Math.sin(yaw), z: Math.cos(yaw) };
    // a few steps toward you, staying on the island
    let spot = { x: mine.x + f.x * 4.5, z: mine.z + f.z * 4.5 };
    const sr = Math.hypot(spot.x, spot.z);
    if (sr > WALK_R) { spot.x *= WALK_R / sr; spot.z *= WALK_R / sr; }
    if (obstacles.some((o) => Math.hypot(o.x - spot.x, o.z - spot.z) < o.r + 1.2)) spot = freeSpot(1.6, spot, 2.5);
    Object.assign(mine, { state: 'walk', target: spot, rush: true, greetOnArrive: null });
    cam.follow = mine; cam.followUntil = T + 9; camGoal.dist = Math.max(9, R * 0.8);
    cam.lastInput = T;
    mine.onArrive = () => {
      // 3. it says hi, the way you'd expect after however long you've been gone
      mine.lookCameraUntil = T + 6; mine.happyUntil = T + 2.4; mine.syv -= 0.18; mine.timer = 4; mine.held = false;
      say(mine, greetingFor(lastVisit), 2800);
      const fresh = diary.filter((e) => e.fresh);
      if (OPEN_NOTES) setTimeout(showMyNotes, 900);
      else if (!hasProfile) {
        setTimeout(() => say(mine, pick(['hey, I have a few questions for you!', 'psst… can I ask you some stuff?', 'oh! I’ve been wanting to ask you things']), 2800), 3000);
        setTimeout(() => { if (!photo && !composing && card.hidden) openCard(mine); }, 5600);
      }
      else if (fresh.length) {
        // tell you the best bit, then show the whole diary
        const best = fresh.find((e) => e.kind === 'friend' || e.kind === 'note' || e.kind === 'photo') || fresh.find((e) => e.kind === 'play') || fresh[0];
        setTimeout(() => say(mine, `guess what? ${firstPerson(best).replace(/^I /, 'I ')}`, 3200), 3000);
        setTimeout(() => { if (!photo && !composing && card.hidden) openCard(mine); }, 6600);
      } else if (inbox.length) setTimeout(() => say(mine, inbox.length === 1 ? 'psst, someone left us a note' : `psst, we have ${inbox.length} notes`, 2600), 3000);
      // friends' buds notice too, and wander over to say hi
      const friends = buds.filter((b) => b.data.friend && b.placed && b.state !== 'drop' && !b.held)
        .sort((a, b) => Math.hypot(a.x - mine.x, a.z - mine.z) - Math.hypot(b.x - mine.x, b.z - mine.z)).slice(0, 2);
      friends.forEach((fb, i) => setTimeout(() => {
        if (photo || fb.held) return;
        const a = Math.atan2(fb.z - mine.z, fb.x - mine.x);
        fb.look = mine; fb.lookUntil = T + 2; fb.syv -= 0.1;
        say(fb, pick(['oh, they’re here!', 'hey!!', 'hi hi!']), 1400);
        fb.target = { x: mine.x + Math.cos(a) * 2, z: mine.z + Math.sin(a) * 2 };
        fb.state = 'walk'; fb.greetCooldown = 0; fb.greetOnArrive = mine; fb.rush = true;
        fb.onArrive = () => { fb.lookCameraUntil = T + 2; };
      }, 1200 + i * 900));
    };
    // if it gets stuck behind something, it still says hi
    setTimeout(() => { if (mine.onArrive && mine.rush) { mine.state = 'idle'; const done = mine.onArrive; mine.onArrive = null; mine.rush = false; done(); } }, 6000);
  }, 1000);
}

// Everyone gets a spot in a row (two rows for 5 or more), facing the camera.
function lineUp() {
  if (!photo || !photo.picked.length) return;
  photo.stage = 'pose';
  photoBar.hidden = true;
  const picked = photo.picked;
  let cx = 0, cz = 0;
  for (const b of picked) { cx += b.x; cz += b.z; }
  cx /= picked.length; cz /= picked.length;
  const lim = WALK_R * 0.5, cr = Math.hypot(cx, cz);
  if (cr > lim) { cx *= lim / cr; cz *= lim / cr; }
  // keep the photo spot clear of trees and rocks
  for (let tries = 0; tries < 30 && obstacles.some((o) => Math.hypot(o.x - cx, o.z - cz) < o.r + 3.2); tries++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * lim;
    cx = Math.cos(a) * r; cz = Math.sin(a) * r;
  }
  const yaw = cam.yaw, f = { x: Math.sin(yaw), z: Math.cos(yaw) }, rt = { x: Math.cos(yaw), z: -Math.sin(yaw) };
  const n = picked.length, rows = n > 4 ? [Math.ceil(n / 2), Math.floor(n / 2)] : [n];
  const spots = [];
  rows.forEach((count, ri) => {
    const back = rows.length > 1 && ri === 0 ? -1.0 : rows.length > 1 ? 0.9 : 0;
    for (let i = 0; i < count; i++) {
      const off = (i - (count - 1) / 2) * 2.4 + (rows.length > 1 && ri === 1 ? 1.2 * (count < rows[0] ? 1 : 0) : 0);
      spots.push({ x: cx + rt.x * off + f.x * back, z: cz + rt.z * off + f.z * back });
    }
  });
  picked.forEach((b, i) => {
    b.pose = spots[i];
    b.held = true; b.partner = null; b.greetOnArrive = null; b.look = null;
    b.state = 'walk'; b.target = spots[i]; b.lookCameraUntil = Infinity;
  });
  const width = (Math.max(...rows) - 1) * 2.4 + 2.4;
  const dist = Math.max(6, width * 1.3);
  // Nobody gets shooed away: whoever wanders past during the countdown ends up in the photo.
  photo.zone = { f };
  photo.focus = { x: cx, y: 0, z: cz };
  cam.follow = photo.focus; cam.followUntil = Infinity;
  camGoal.dist = dist; camGoal.pitch = 0.22; camGoal.yaw = yaw;
  photo.readyBy = performance.now() + 6000;   // real time, so a slow device doesn't keep everyone waiting
  photo.waiting = true;
}

// called every frame: start the countdown once everyone is in place (or it's taking too long)
function photoTick() {
  if (!photo || photo.stage !== 'pose' || !photo.waiting) return;
  const arrived = photo.picked.every((b) => b.state === 'idle' && Math.hypot(b.x - b.pose.x, b.z - b.pose.z) < 0.5);
  if (arrived || performance.now() > photo.readyBy) { photo.waiting = false; setTimeout(countdown, arrived ? 500 : 0); }
}

function countdown() {
  if (!photo) return;
  photo.stage = 'shoot';
  // anyone still wandering over just hops into place
  for (const b of photo.picked) {
    if (Math.hypot(b.x - b.pose.x, b.z - b.pose.z) > 0.5) b.syv -= 0.12;
    b.x = b.pose.x; b.z = b.pose.z;
    b.state = 'idle'; b.target = null;
  }
  const lookAt = { x: photo.focus.x + photo.zone.f.x * 100, z: photo.focus.z + photo.zone.f.z * 100 };
  for (const b of photo.picked) b.heading = Math.atan2(lookAt.x - b.x, lookAt.z - b.z);
  countdownEl.hidden = false;
  const steps = ['3', '2', '1'];
  steps.forEach((t, i) => setTimeout(() => {
    if (!photo) return;
    countdownEl.innerHTML = ''; countdownEl.append(el('span', null, t));
    S.play('tick', { rate: t === '1' ? 1.5 : 1 });
    if (t === '1') for (const b of photo.picked) { say(b, 'cheese!', 900); b.happyUntil = T + 2.5; b.syv -= 0.08; }
  }, i * 800));
  setTimeout(snap, steps.length * 800);
}

function snap() {

// Render one frame at photo size, then put the sky behind it and name tags on top.
function capture() {
  const prevView = camera.view && camera.view.enabled;
  if (prevView) camera.clearViewOffset();
  renderer.setPixelRatio(1);
  renderer.setSize(PHOTO_W, PHOTO_H, false);
  camera.aspect = PHOTO_W / PHOTO_H; camera.fov = 38; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const c = document.createElement('canvas'); c.width = PHOTO_W; c.height = PHOTO_H;
  const g = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const sky = g.createLinearGradient(0, 0, 0, PHOTO_H);
  sky.addColorStop(0, css.getPropertyValue('--sky-top').trim() || '#BFD9FF');
  sky.addColorStop(1, css.getPropertyValue('--sky-bottom').trim() || '#FBE3EF');
  g.fillStyle = sky; g.fillRect(0, 0, PHOTO_W, PHOTO_H);
  g.drawImage(renderer.domElement, 0, 0, PHOTO_W, PHOTO_H);
  // name tags
  g.font = '500 30px Fredoka, ui-rounded, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const b of photo.picked) {
    const v = new THREE.Vector3(b.x, b.hop.position.y + b.height * b.sy + 0.3, b.z).project(camera);
    if (v.z > 1) continue;
    const x = (v.x + 1) / 2 * PHOTO_W, y = (1 - v.y) / 2 * PHOTO_H;
    const name = nameOf(b), w = g.measureText(name).width + 30;
    g.fillStyle = b.data.isMe ? 'rgba(29,28,43,.92)' : 'rgba(255,255,255,.92)';
    g.beginPath(); g.roundRect(x - w / 2, y - 44, w, 44, 13); g.fill();
    g.fillStyle = b.data.isMe ? '#fff' : '#1D1C2B'; g.fillText(name, x, y - 21);
  }
  resize();
  return c;
}

function wrapLines(g, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines.slice(0, 2);
}
// The polaroid: photo on cream paper, the caption underneath in big round letters, and the date.
function renderPolaroid() {

/* ---------------- Peekaboo: battleship with buds ---------------- */
// Both players use the same island as their board: on yours, your three buds hide on tiles; on theirs, you tap
// tiles to look. The server is the referee, so where they hid only shows up here once you find them.
const gameBar = document.getElementById('gameBar'), gameTitle = document.getElementById('gameTitle');
const gameScore = document.getElementById('gameScore'), gameText = document.getElementById('gameText');
const gameRow = document.getElementById('gameRow'), gameSeg = document.getElementById('gameSeg');
let game = null;     // the game on screen: { id, v (my view from the server), board: 'mine' | 'theirs', picks, yell, ... }
let myGames = [];    // games still going: { id, them, myTurn, status }
const budById = (id) => buds.find((b) => b.data.id === id);
const GN = 7, GCELL = 0.225;
const cellW = () => R * GCELL;
const tilePos = (t) => ({ x: ((t % GN) - 3) * cellW(), z: (Math.floor(t / GN) - 3) * cellW() });
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitPoint = new THREE.Vector3();
const TILE_GEO = new THREE.CircleGeometry(1, 28); TILE_GEO.rotateX(-Math.PI / 2);
const PEBBLE_MAT = new THREE.MeshStandardMaterial({ color: toLinear('#8C889E'), roughness: 1, flatShading: true });

function tileAt(x, y) {
  if (!game) return null;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(groundPlane, hitPoint)) return null;
  let best = null, bd = cellW() * 0.5;
  for (const t of game.v.tiles) { const p = tilePos(t), d = Math.hypot(p.x - hitPoint.x, p.z - hitPoint.z); if (d < bd) { bd = d; best = t; } }
  return best;
}
const theirName = () => (game && game.v.people && game.v.people[game.v.them]) || 'your friend';
const budName = (id) => (game && game.v.buds && game.v.buds[id]) || 'a bud';
const listNames = (ids) => { const n = ids.map(budName); return n.length < 2 ? n.join('') : `${n.slice(0, -1).join(', ')} and ${n[n.length - 1]}`; };
const looked = (t) => game.v.myShots.some((s) => s.t === t && s.yell == null);
const myTurn = () => game && game.v.status === 'playing' && game.v.turn === game.v.me;
const settingUp = () => game && game.v.status === 'setup' && !game.v.ready[game.v.me];
const isOver = () => game && (game.v.status === 'done' || game.v.status === 'resigned');
function tappable(t) {
  if (!game || game.busy || game.pending || t == null) return false;
  if (settingUp()) return game.board === 'mine';
  return myTurn() && game.board === 'theirs' && (game.yell || !looked(t));
}

async function enterGame(id) {
  if (game && game.id === id) return;
  if (game) exitGame();
  if (photo) exitPhoto();
  closeComposer(); closeCard(); hideHint();
  let v;
  try { v = await api('GET', '/api/game?id=' + encodeURIComponent(id)); }
  catch (e) { const m = myBud(); if (m) say(m, 'hmm, I can’t find that game', 2200); return; }
  game = { id, v, board: 'mine', picks: [], yell: false, busy: false, msg: '', hover: null, group: new THREE.Group(), tiles: new Map(), marks: [], key: viewKey(v) };
  game.board = defaultBoard(v);
  scene.add(game.group);
  for (const t of v.tiles) {
    const m = new THREE.Mesh(TILE_GEO, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, depthWrite: false }));
    const p = tilePos(t); m.position.set(p.x, 0.04, p.z); m.scale.setScalar(cellW() * 0.42); m.renderOrder = 1;
    game.group.add(m); game.tiles.set(t, m);
  }
  for (const b of buds) { b.gameHidden = true; b.root.visible = false; }
  game.savedPitch = cam.pitch;

async function pollGame() {
  if (!game || game.busy || game.pending || document.hidden || isOver() || myTurn() || settingUp()) return;
  try {
    const v = await api('GET', '/api/game?id=' + encodeURIComponent(game.id));

// A new view from the server: show what changed. A look is a pebble thrown at a spot: nothing about the

function applyView(v, myShot = null, myMsg = '') {
  const before = game.v, id = game.id;

  const theirNew = v.theirShots.slice(before.theirShots.length);
  clearTimeout(game.flip);
  const finish = () => {
    if (!game || game.id !== id) return;
    if (isOver() && before.status !== v.status) setTimeout(() => S.play(v.winner === v.me ? 'sparkle' : 'boing'), 500);
  };
  const reveal = (s, board, msg, flipTo) => {
    const land = () => {
      if (!game || game.id !== id) return;

      renderGame();
      animateShot(s, board);
      if (v.status === 'playing') game.flip = setTimeout(() => {
        if (game && game.id === id && game.board === board && flipTo()) { game.board = board === 'mine' ? 'theirs' : 'mine'; if (board === 'mine') game.msg = ''; renderGame(); }
      }, 2400);
      finish();

    game.board = board;
    if (s.yell != null) { game.pending = null; return land(); }

    game.msg = '';
    renderGame();

  };
  if (myShot) reveal(myShot, 'theirs', myMsg, () => !myTurn());
  else if (theirNew.length) {
    const s = theirNew[theirNew.length - 1];
    const msg = s.yell != null ? `${theirName()} yelled across your island!` : s.hit ? `${theirName()} found ${budName(v.mySquad[v.myHides.indexOf(s.t)])}!` : `${theirName()} looked and missed.`;
    reveal(s, 'mine', msg, () => myTurn());

}

function renderBoard() {
  clearMarks();

    const flying = (i) => game.pending && game.pending.board === 'mine' && game.pending.idx === i;
    const hits = new Set(v.theirShots.filter((s, i) => s.hit && !flying(i)).map((s) => s.t));
    hides.forEach((t, i) => {
      const found = hits.has(t);
      state.set(t, settingUp() ? 'pick' : found ? 'found' : 'hide');

    });

function renderGame() {
  if (!game) return;

  const pend = game.pending && (game.pending.board === 'theirs' ? v.myShots : v.theirShots)[game.pending.idx];
  const found = v.found - (pend && pend.hit && game.pending.board === 'theirs' ? 1 : 0), lost = v.lost - (pend && pend.hit && game.pending.board === 'mine' ? 1 : 0);
  gameScore.textContent = v.status === 'setup' ? '' : `found ${found}/${v.hiders} · lost ${lost}/${v.hiders}`;
  const showSeg = !settingUp();
  gameSeg.hidden = !showSeg;
  for (const b of gameSeg.querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.board === game.board));

  }

    const b = el('button', 'btn' + (primary ? ' primary' : ''), label); b.type = 'button'; b.disabled = disabled || game.busy;
    b.addEventListener('click', fn); gameRow.append(b); return b;
  };

    btn('Leave', exitGame, true);
  } else if (settingUp()) {
    text = `Hide ${listNames(v.mySquad)}. Tap 3 spots on your island (${game.picks.length}/3).`;
    btn('Leave', exitGame);
    btn('Hide them', hideBuds, true, game.picks.length !== 3);
  } else if (v.status === 'setup') {

    btn('Give up', resignGame); btn('Leave', exitGame, true);
  } else if (v.status === 'playing' && myTurn()) {
    text = game.board === 'theirs'
      ? game.yell ? 'Yell! Tap a spot to hear how many hiders are within 2 tiles of it.' : `Your turn. Tap a spot on ${them}’s island to look there.`
      : `Your turn. Switch to ${them}’s island to look.`;
    if (game.board === 'theirs') {
      const y = btn(v.yelled ? 'Yell used' : game.yell ? 'Cancel yell' : 'Yell (once)', () => { game.yell = !game.yell; S.play('click'); renderGame(); }, false, v.yelled);
      y.setAttribute('aria-pressed', String(game.yell));

      : won ? `You found all ${v.hiders}! ${nameOf(myBud() || { data: { trueName: 'Your bud' } })} gets a crown for a day 👑` : `${them} found all your hiders. So close!`;

function gameTap(x, y) {
  const t = tileAt(x, y);
  if (!tappable(t)) {
    if (t != null && game.board === 'theirs' && myTurn() && looked(t)) S.play('click', { gain: 0.6 });
    return;
  }
  if (settingUp()) {
    const i = game.picks.indexOf(t);
    if (i >= 0) game.picks.splice(i, 1);
    else { if (game.picks.length >= 3) game.picks.shift(); game.picks.push(t); }
    S.play('pop', { rate: i >= 0 ? 0.75 : 1.1 });
    game.msg = '';
    renderGame();
    const b = budById(game.v.mySquad[game.picks.indexOf(t)]);
    if (b && i < 0) { b.syv -= 0.12; say(b, pick(['ooh, good spot', 'here?', 'they’ll never look here', 'shh!']), 1200); }
    return;
  }
