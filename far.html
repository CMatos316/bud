<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Lighthouse Rock · the buddie system</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">

<style>
/* Layout: the whole screen is the 3D island. A slim top bar (Home, the island's name, Finds, sound), speech
   bubbles over the buds, one big "do the thing" button at the bottom, and a card for the finds book. */
:root {
  --ink: #1D1C2B; --muted: #5E5D75; --chip: rgba(255, 255, 255, 0.72); --chip-line: rgba(29, 28, 43, 0.08);
  --tag: rgba(255, 255, 255, 0.94); --tag-ink: #1D1C2B; --me: #1D1C2B; --me-ink: #FFFFFF; --shadow: rgba(46, 40, 90, 0.2);
  --card: #FFFFFF; --slot: #F3F1F8;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #EDECF6; --muted: #A9A7C4; --chip: rgba(30, 32, 52, 0.72); --chip-line: rgba(255, 255, 255, 0.1); --tag: rgba(30, 32, 52, 0.92); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F; --shadow: rgba(0, 0, 0, 0.5); --card: #1E2034; --slot: #2A2C44; color-scheme: dark; }
}
:root[data-theme="dark"] { --ink: #EDECF6; --muted: #A9A7C4; --chip: rgba(30, 32, 52, 0.72); --chip-line: rgba(255, 255, 255, 0.1); --tag: rgba(30, 32, 52, 0.92); --tag-ink: #EDECF6; --me: #EDECF6; --me-ink: #15161F; --shadow: rgba(0, 0, 0, 0.5); --card: #1E2034; --slot: #2A2C44; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFD9FF; color: var(--ink); font-family: var(--font-display); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#rock { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bubble { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; background: var(--tag); color: var(--tag-ink); border: 1.5px solid var(--tag-ink); border-radius: 14px; padding: 6px 11px; font-size: 15px; font-weight: 500; line-height: 1.3; width: max-content; max-width: min(250px, 70vw); text-align: center; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: inherit; border-right: 1.5px solid var(--tag-ink); border-bottom: 1.5px solid var(--tag-ink); transform: translateX(-50%) rotate(45deg); }
.bubble.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
.bubble.keeper { background: #2F3550; color: #F1F0F8; border-color: #F1F0F8; }
@keyframes pop { from { scale: .6; opacity: 0; } to { scale: 1; opacity: 1; } }
.bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.pill { font: inherit; font-weight: 500; font-size: 15px; color: var(--ink); background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.pill svg { width: 18px; height: 18px; }
.pill:focus-visible, .btn:focus-visible, #act:focus-visible { outline: 3px solid #7B6CF6; outline-offset: 2px; }
.place { font-weight: 600; font-size: 16px; padding: 8px 4px; text-shadow: 0 1px 8px rgba(255, 255, 255, .6); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 430px) { .pill { padding: 8px 11px; font-size: 14px; } .place { font-size: 15px; } .bar { gap: 6px; } }
.spacer { flex: 1; }
#act { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); font: inherit; font-weight: 600; font-size: 18px; color: var(--me-ink); background: var(--me); border: 0; border-radius: 999px; padding: 14px 26px; min-height: 52px; cursor: pointer; box-shadow: 0 8px 24px var(--shadow); display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
#act kbd { font: inherit; font-size: 12px; font-weight: 500; opacity: .7; border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; }
@media (hover: none) { #act kbd { display: none; } }
#hint { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--ink); width: max-content; max-width: 92vw; text-align: center; transition: opacity .6s; pointer-events: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#hint.gone { opacity: 0; }
#toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--tag); color: var(--tag-ink); border-radius: 16px; padding: 10px 16px; font-size: 15px; font-weight: 500; box-shadow: 0 8px 24px var(--shadow); max-width: 92vw; text-align: center; transition: opacity .4s, translate .4s; pointer-events: none; }
#toast.gone { opacity: 0; translate: 0 -8px; }
#stick { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .16); pointer-events: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 2px 8px var(--shadow); }
/* talking with the keeper: what you might say (chips), a box to type in, Send and Bye */
#chat { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(520px, calc(100vw - 20px)); background: var(--card); color: var(--ink); border-radius: 20px; padding: 10px; box-shadow: 0 12px 36px var(--shadow); display: flex; flex-direction: column; gap: 8px; touch-action: manipulation; user-select: text; -webkit-user-select: text; }
#chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#chips:empty { display: none; }
#chips button { font: inherit; font-size: 14px; color: var(--ink); background: var(--slot); border: 1px solid var(--chip-line); border-radius: 999px; padding: 7px 12px; min-height: 36px; white-space: nowrap; cursor: pointer; flex: none; }
.chatrow { display: flex; gap: 6px; align-items: center; }
#chatIn { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--slot); border: 1px solid var(--chip-line); border-radius: 999px; padding: 10px 14px; min-height: 44px; }
#chatIn:focus-visible, #chips button:focus-visible { outline: 3px solid #7B6CF6; outline-offset: 1px; }
#chat .btn { padding: 10px 16px; }
#chat .btn:disabled { opacity: .5; cursor: default; }
#chatNote { font-size: 12px; color: var(--muted); padding: 0 6px 2px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
#chatNote button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 4px 0; text-decoration: underline; cursor: pointer; }
#fade { position: fixed; inset: 0; background: #FFFDF8; opacity: 1; transition: opacity .35s; pointer-events: none; }
#fade.clear { opacity: 0; }
#fade.dark { background: #15121C; }
#fade.flash { background: #E9F8FF; transition: opacity .25s; }
.card .paper { background: #FBF5E6; color: #3A2A1E; border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; font-style: italic; margin-top: 12px; }
.journal { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.journal button { font: inherit; font-size: 14px; border: 1px solid var(--chip-line); background: var(--slot); color: var(--ink); border-radius: 999px; padding: 7px 12px; min-height: 36px; cursor: pointer; }
body.inside .place { color: #F1F0F8; text-shadow: none; }
body.inside #act { background: #F1F0F8; color: #15161F; }
.card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); overflow: auto; background: var(--card); color: var(--ink); border-radius: 22px; padding: 20px; box-shadow: 0 20px 60px rgba(20, 16, 50, .35); touch-action: pan-y; }
.card h2 { margin: 0 0 2px; font-size: 22px; font-weight: 600; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
.slot { background: var(--slot); border-radius: 14px; padding: 10px 4px 8px; text-align: center; min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.slot .ic { font-size: 26px; line-height: 1; }
.slot .nm { font-size: 12px; line-height: 1.2; }
.slot .ct { font-size: 11px; color: var(--muted); }
.slot.no .ic { opacity: .28; filter: grayscale(1); }
.slot.no .nm { color: var(--muted); }
button.slot { font: inherit; color: inherit; border: 0; cursor: pointer; }
button.slot:disabled { opacity: .5; }
#shelfList { list-style: none; margin: 10px 0 0; padding: 0; max-height: 30dvh; overflow: auto; display: grid; gap: 4px; font-size: 15px; }
#shelfList span { color: var(--muted); }
.row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
.btn { font: inherit; font-weight: 500; font-size: 16px; border-radius: 999px; padding: 10px 18px; min-height: 44px; border: 1px solid var(--chip-line); background: var(--slot); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--me); color: var(--me-ink); border-color: transparent; }
#center { text-align: center; }
</style>

<body>
<canvas id="rock" aria-label="Lighthouse Rock: steer your bud around the island"></canvas>
<div id="labels" aria-live="polite"></div>
<div class="bar">
  <button class="pill" id="homeBtn" type="button" aria-label="Sail back to bud island"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>Home</button>
  <span class="place" id="place">Lighthouse Rock</span>
  <span class="spacer"></span>
  <button class="pill" id="findsBtn" type="button" hidden>Finds <span id="findsCount"></span></button>
  <button class="pill sound-toggle" id="soundBtn" type="button"></button>
</div>
<div id="toast" class="gone" role="status"></div>
<div id="hint" class="gone"></div>
<button id="act" type="button" hidden></button>
<div id="stick" hidden><i></i></div>
<form id="chat" hidden autocomplete="off">
  <div id="chips"></div>
  <div class="chatrow">
    <input id="chatIn" type="text" maxlength="200" enterkeyhint="send" aria-label="Say something to the keeper" placeholder="Say something…">
    <button class="btn primary" id="chatSend" type="submit">Send</button>
    <button class="btn" id="chatBye" type="button">Bye</button>
  </div>
  <div id="chatNote"><span id="chatNoteText">Gloam remembers a little of what you tell it.</span><button type="button" id="chatForget">Make it forget</button></div>
</form>
<div class="card" id="findsCard" role="dialog" aria-labelledby="findsTitle" hidden>
  <h2 id="findsTitle">Finds</h2>
  <p id="findsSub"></p>
  <div class="grid" id="findsGrid"></div>
  <p>The last three you found sit on your porch back home, where everyone can see them.</p>
  <div id="journalBox" hidden><h2 style="font-size:17px;margin-top:14px">Wick’s journal</h2><p id="journalSub"></p><div class="journal" id="journal"></div></div>
  <div class="row"><button class="btn primary" id="findsClose" type="button">Close</button></div>
</div>
<div class="card" id="shelfCard" role="dialog" aria-labelledby="shelfTitle" hidden>
  <h2 id="shelfTitle">The shelf</h2>
  <p id="shelfSub"></p>
  <ul id="shelfList"></ul>
  <p id="shelfAsk"></p>
  <div class="grid" id="shelfGrid"></div>
  <div class="row"><button class="btn primary" id="shelfClose" type="button">Close</button></div>
</div>
<div class="card" id="pageCard" role="dialog" aria-labelledby="pageTitle" hidden>
  <h2 id="pageTitle"></h2>
  <p id="pageText" class="paper"></p>
  <p id="pageNote"></p>
  <div class="row"><button class="btn primary" id="pageClose" type="button">Close</button></div>
</div>
<div class="card" id="center" hidden><h2 id="centerTitle"></h2><p id="centerText"></p><div class="row" style="justify-content:center"><a class="btn primary" id="centerBtn" href="/"></a></div></div>
<div id="fade"></div>

<script src="/js/sound.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<script type="module">
// Lighthouse Rock: the island the balloon ferry sails to from the dock back home. Here you steer your own bud:
// walk the island, pick up the day's finds (js/away.js decides them, the same for everyone), climb the
// lighthouse, and keep its grumpy keeper company. Saving goes through /api/world (lib/away.js).
import { setExtents, buildMesh, drawEyeStyle, clamp } from '/js/bud-core.js';
import { weatherAt, seasonAt, snowCoverAt, sunTimes } from '/js/seasons.js';
import { FINDS, FIND_KINDS, KEEPER, dailyFinds, dayKey, seededRng, fondLevel, PAGES, LETTER, FAR_TREE, PAGE_COUNT, pageNo, CARVING, SQUIRREL_NOTES, dinnerOn } from '/js/away.js';
import { makeFind } from '/js/finds3d.js';

const S = window.BudSound || { play() {}, babble() {}, ambient() {}, weather() {}, setNight() {}, bindToggle() {}, onChange() {}, muted: true };
const $ = (id) => document.getElementById(id);
const canvas = $('rock'), labels = $('labels');
const params = new URLSearchParams(location.search);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const smooth01 = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const lerp = (a, b, k) => a + (b - a) * k;
const angleTo = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
const toLinear = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const TOUCH = matchMedia('(hover: none)').matches;

/* ---------------- renderer, camera, lights ---------------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { showCenter('This browser can’t draw 3D here', 'Try Chrome or Safari, or turn on hardware acceleration.', 'Back to bud island', '/world'); throw e; }
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 700);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8d96b8, 0.45); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6ea, 0.8); sun.position.set(-8, 16, 10); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.2); fill.position.set(10, 4, -6); scene.add(fill);
function makeEnv(k = 1) {
  const s = new THREE.Scene(), g = new THREE.SphereGeometry(10, 32, 16), pos = g.attributes.position, cols = [];
  for (let i = 0; i < pos.count; i++) { const t = (pos.getY(i) / 10 + 1) / 2; cols.push((0.32 + 0.68 * t) * k, (0.35 + 0.65 * t) * k, (0.42 + 0.58 * t) * k * 1.15); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const pm = new THREE.PMREMGenerator(renderer), tex = pm.fromScene(s, 0.03).texture; pm.dispose();
  return tex;
}
const ENV_DAY = makeEnv(1), ENV_NIGHT = makeEnv(0.28);
function resize() {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const M = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: toLinear(hex), roughness: 0.9, envMapIntensity: 0.35, ...o });
const mats = {};
const mat = (hex, o) => (o ? M(hex, o) : (mats[hex] = mats[hex] || M(hex)));
const up = new THREE.Vector3(0, 1, 0);
function box(w, h, d, m, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; }
function cyl(rt, rb, h, n, m, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, n), m); o.position.set(x, y, z); return o; }
function ball(r, m, x = 0, y = 0, z = 0, d = 12) { const o = new THREE.Mesh(new THREE.SphereGeometry(r, d, Math.max(6, d - 2)), m); o.position.set(x, y, z); return o; }
function signTex(lines, { w = 256, h = 128, bg = '#E9D7B4', ink = '#3A2A1E', size = 40 } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = ink; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach(([text, sz = size], i) => { g.font = `600 ${sz}px Fredoka, ui-rounded, system-ui, sans-serif`; g.fillText(text, w / 2, h * (i + 1) / (lines.length + 1) + (lines.length > 1 ? (i ? 8 : -6) : 0)); });
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

/* ---------------- the shape of the Rock ----------------
   Longer than it is wide, floating in a sea of clouds: the dock at the south tip, a meadow, a pine wood to the
   west, a lagoon to the east, and at the north end a hill with the lighthouse on top. +z is south. */
const EX = 27, EZ = 40, HILL = 5.2;
const LH = { x: 0, z: -27 }, LAG = { x: 12.5, z: 8, r: 6.4 }, WOOD = { x: -13.5, z: -1, r: 9.5 }, ROCKS = { x: 13, z: -19, r: 7.5 }, RING = { x: -15.5, z: -17, r: 2.7 };
const edgeWobble = (a) => 1 + 0.06 * Math.sin(3 * a + 1.3) + 0.04 * Math.sin(5 * a + 0.4) + 0.025 * Math.sin(8 * a + 2);
const edgeR = (a) => edgeWobble(a) / Math.sqrt((Math.cos(a) / EX) ** 2 + (Math.sin(a) / EZ) ** 2);
const relAt = (x, z) => Math.hypot(x, z) / edgeR(Math.atan2(z, x));   // 0 in the middle, 1 at the cliff edge
const SHORE = edgeR(Math.PI / 2);                                     // the south tip, where the dock is
const PATH = [[0, SHORE - 0.5], [-1.5, 30], [-3, 22], [2.5, 13], [-2.5, 3], [-5, -7], [-1.5, -16], [0, LH.z + 4.4]];
function distToPath(x, z) {
  let best = Infinity;
  for (let i = 1; i < PATH.length; i++) {
    const [ax, az] = PATH[i - 1], [bx, bz] = PATH[i], vx = bx - ax, vz = bz - az;
    const t = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz), 0, 1);
    best = Math.min(best, Math.hypot(ax + vx * t - x, az + vz * t - z));
  }
  return best;
}
function height(x, z) {
  const d = Math.hypot(x - LH.x, z - LH.z), hill = 1 - smooth01((d - 5) / 15);
  let h = HILL * hill;
  h += 1.1 * Math.exp(-((x + 11) ** 2 + (z - 19) ** 2) / 46);                                   // a low knoll in the meadow
  const flat = (1 - hill) * (1 - Math.exp(-(x * x + (z - SHORE) ** 2) / 40));                   // level by the dock and on the hilltop
  h += 0.14 * Math.sin(x * 0.36 + 1) * Math.cos(z * 0.31) * flat;
  const dl = Math.hypot(x - LAG.x, z - LAG.z);
  h -= 0.85 * (1 - smooth01((dl - LAG.r * 0.72) / (LAG.r * 0.42)));                             // the lagoon's bowl
  return h;
}
const onPier = (x, z) => Math.abs(x) <= 0.8 && z >= SHORE - 2.2 && z <= SHORE + 4.0;
const groundY = (x, z) => (onPier(x, z) && z > SHORE - 1.4 ? 0.2 : height(x, z));

const out = new THREE.Group(); scene.add(out);       // everything outdoors (hidden while you're inside the lighthouse)
const obstacles = [];                                // { x, z, r } things a bud walks around
const faders = [];                                   // trees and the tower go see-through when they'd hide your bud
const SNOW = snowCoverAt(Date.now()) > 0.5 || params.get('season') === 'winter';
const SEASON = ['winter', 'spring', 'summer', 'fall'].includes(params.get('season')) ? params.get('season') : seasonAt(Date.now());
const GRASS = SNOW ? '#EEF3F8' : SEASON === 'fall' ? '#A9C97A' : '#86CF86', GRASS2 = SNOW ? '#DDE6EE' : SEASON === 'fall' ? '#93B869' : '#74BE79';

let terrain;
function buildTerrain() {
  const NR = 56, NS = 180, pos = [], col = [], idx = [];
  const cGrass = toLinear(GRASS), cGrass2 = toLinear(GRASS2), cPath = toLinear(SNOW ? '#CFC6B8' : '#D9B98A'), cSand = toLinear(SNOW ? '#E6E3DC' : '#EAD9A8'),
    cRock = toLinear('#9AA0AE'), cEarth = toLinear('#8A6A4E'), cDeep = toLinear('#5E5568'), c = new THREE.Color();
  const rings = [];   // [scale of the edge radius, how far below the top]
  for (let i = 0; i <= NR; i++) rings.push([i / NR, 0]);
  rings.push([1.012, 0.45], [1.0, 1.3], [0.93, 3.2], [0.74, 7], [0.42, 11.5], [0.12, 15]);
  for (let i = 0; i < rings.length; i++) {

/* travelling through the stones: they light one after another, your bud hops, and with a flash you're at the other ring */
let beenTree = false;
function travel(to) {

  stones.forEach((s, i) => setTimeout(() => { s.lit = 1; S.play('chime', { gain: 0.5, rate: [1, 1.125, 1.25, 1.5, 1.667, 2][i] }); }, i * 150));
  say(me, to === 'tree' ? pick(['the stones are singing…', 'ooh, tingly…', 'hold on…']) : pick(['back we go…', 'home stones, please…']), 1300);
  setTimeout(() => { me.vy = 7; me.y = 0.01; S.play('boing', { gain: 0.6 }); }, 950);
  setTimeout(() => {
    const f = $('fade'); f.classList.remove('dark', 'clear'); f.classList.add('flash'); S.play('whoosh', { gain: 0.8, rate: 1.4 }); S.play('sparkle', { gain: 0.8 });
    setTimeout(() => {

/* reading a page */

  $('pageText').textContent = sealed ? 'It’s sealed with red wax, and addressed in shaky handwriting: “for gloam”.' : PAGES[n];
  $('pageNote').textContent = sealed ? 'Gloam is at the lighthouse.' : n === LETTER ? 'Gloam let you read it.' : TPAGES[n] ? `Found ${TPAGES[n].where}.` : '';

function takePage(p) {
  me.heading = Math.atan2(p.g.position.x - me.x, p.g.position.z - me.z);
  const first = !away.pages.includes(p.n);

  if (near(RING.x, RING.z, 1.5)) return { label: 'Step through the stones', run: () => travel('tree') };
  if (near(CARVE.x, CARVE.z, 1.05)) return { label: 'Look at the carving', run: () => { me.heading = Math.atan2(RING.x - me.x, RING.z - me.z); openNote('A carving on the stone', CARVING, 'Somebody on Bud Island says the same picture is under the houses on stilts.'); } };
  if (onPier(me.x, me.z) && me.z > SHORE + 1.6) return { label: 'Sail home', run: sailHome };
  return null;
}
function doAction() { if (action && $('findsCard').hidden && $('pageCard').hidden && $('shelfCard').hidden) action.run(); }
/* The keeper's shelf: see what's on it and who left it, and leave something of your own. */
function openShelf() {
  walkTo = null; const list = $('shelfList'), grid = $('shelfGrid'); list.textContent = ''; grid.textContent = '';
  $('shelfTitle').textContent = `${away.met ? KEEPER + '’s' : 'The keeper’s'} shelf`;
  $('shelfSub').textContent = shelf.length ? 'Things visitors have left here.' : 'Three bare boards. Nobody has left anything yet.';
  for (const it of shelf) { if (!FINDS[it.kind]) continue; const li = document.createElement('li'); li.textContent = `${FINDS[it.kind].icon} ${FINDS[it.kind].name}`; const who = document.createElement('span'); who.textContent = it.by === myId ? ' · from you' : ` · from ${it.bud}`; li.append(who); list.append(li); }
  const mine = Object.keys(FINDS).filter((k) => !FINDS[k].gift && away.finds[k] > 0);
  $('shelfAsk').textContent = mine.length ? 'Leave one of your finds? It stays here for everyone to see.' : 'You’ve nothing to leave just now. Things turn up around the rock every day.';
  for (const k of mine) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'slot'; b.innerHTML = '<span class="ic" aria-hidden="true"></span><span class="nm"></span><span class="ct"></span>';
    b.children[0].textContent = FINDS[k].icon; b.children[1].textContent = FINDS[k].name; b.children[2].textContent = away.finds[k] > 1 ? `×${away.finds[k]}` : 'your only one';
    b.addEventListener('click', () => leaveOnShelf(k, b)); grid.append(b);
  }
  $('shelfCard').hidden = false; S.play('pop', { gain: 0.5 });
}
let shelfBusy = false;
async function leaveOnShelf(kind, btn) {
  if (shelfBusy) return; shelfBusy = true; btn.disabled = true;
  const r = await post({ do: 'shelf', kind }); shelfBusy = false;
  if (!r.ok || !r.shelf) { if (r.away) away = { ...r.away }; toast(r.error ? `That didn’t work: ${r.error}.` : 'That didn’t work. Try again in a moment.'); openShelf(); return; }
  away = { ...r.away }; shelf = r.shelf; drawShelf(true); updateFindsPill(); $('shelfCard').hidden = true; S.play('chime', { gain: 0.5 });
  say(me, pick(['for your shelf!', 'this one’s for you.', 'found it out there!']), 1800);
  if (gloam && gloamAt.area === 'in') setTimeout(() => { gloamSay(r.warmed ? pick(['…hm. it can stay.', '…put it straight, at least.', '…that’s a decent one.']) : pick(['…another one.', '…the shelf’s not endless.', '…fine.']), 3000); if (r.warmed) gloam.happyUntil = T + 2; }, 1500);
  toast(`${FINDS[kind].icon} Your ${FINDS[kind].name} is on the shelf now.`, 4200);
  if (r.gift) setTimeout(() => toast(`${FINDS.lantern.icon} ${KEEPER} gave you its old lantern. It’s on your porch now.`, 6000), 5000);
}
$('act').addEventListener('click', doAction);
function showAction() {
  const a = findAction(), el = $('act');
  if ((a && a.label) !== (action && action.label)) { el.hidden = !a; if (a) el.innerHTML = `<span></span>${TOUCH ? '' : '<kbd>Space</kbd>'}`, el.firstChild.textContent = a.label; }
  action = a;
}

/* ---------------- arriving and leaving on the ferry ---------------- */
let cut = null;       // the cutscene in progress: { kind, t }
function sailHome() {
  if (mode === 'leave') return;
  mode = 'leave'; walkTo = null; cut = { kind: 'leave', t: 0, x0: me.x, z0: me.z }; $('act').hidden = true; action = null;
  say(me, pick(['home time!', 'bye, rock!', 'let’s go home!']), 1600); S.play('boing', { gain: 0.6 });
}
$('homeBtn').addEventListener('click', () => {
  if (mode !== 'play') { if (mode === 'load') location.href = '/world'; return; }
  if (area !== 'out' || !(onPier(me.x, me.z) && me.z > SHORE)) { $('fade').classList.remove('clear', 'dark'); mode = 'leave'; setTimeout(() => { location.href = '/world?from=far'; }, 420); return; }
  sailHome();
});
function runCut(dt) {
  cut.t += dt;
  const seat = (k = 1) => { me.x = boat.x; me.z = boat.z; me.heading = 0; return boat.y + 0.12 * k; };
  if (cut.kind === 'arrive') {
    // the ferry floats down out of the sky with your bud aboard, then your bud hops onto the pier
    const u = smooth01(cut.t / 3.4), e = 1 - (1 - u) ** 2;
    boat.x = boat.home.x + (1 - e) * -9; boat.y = boat.home.y + (1 - e) * 13; boat.z = boat.home.z + (1 - e) * 26;
    if (cut.t < 3.6) { cut.gy = seat(); me.moving = 0; }
    else {
      const v = clamp((cut.t - 3.6) / 0.55, 0, 1);
      if (!cut.hopped) { cut.hopped = true; S.play('boing', { gain: 0.7 }); }
      me.x = lerp(boat.home.x, 0.1, v); me.z = lerp(boat.home.z, SHORE + 2.6, v); cut.gy = lerp(boat.home.y + 0.12, 0.2, v) + Math.sin(v * Math.PI) * 1.1; me.heading = lerp(0, -1.2, v);
      if (v >= 1) {
        me.landAt = T; me.heading = Math.PI; cut = null; mode = 'play'; S.play('pop', { gain: 0.6 });
        const hint = $('hint'); hint.textContent = TOUCH ? 'Drag anywhere to walk · tap a spot to go there' : 'WASD or the arrow keys to walk · click a spot to go there'; hint.classList.remove('gone');
        setTimeout(() => say(me, away.trips > 1 ? pick(['back on the rock!', 'what’s new today?', 'let’s look around!']) : 'whoa. a whole other island!', 2400), 500);
      }
    }
  } else {
    // hop aboard, and the ferry lifts off for home
    if (cut.t < 0.55) { const v = cut.t / 0.55; me.x = lerp(cut.x0, boat.home.x, v); me.z = lerp(cut.z0, boat.home.z, v); cut.gy = lerp(0.2, boat.home.y + 0.12, v) + Math.sin(v * Math.PI) * 1.1; me.heading = 1.2; }
    else {
      const u = smooth01((cut.t - 0.9) / 3.2), e = u * u;
      boat.x = boat.home.x + e * -9; boat.y = boat.home.y + e * 13; boat.z = boat.home.z + e * 26; cut.gy = seat();
      if (cut.t > 0.9 && !cut.whoosh) { cut.whoosh = true; S.play('whoosh', { gain: 0.7 }); }
      if (cut.t > 2.5 && !cut.fading) { cut.fading = true; $('fade').classList.remove('clear', 'dark'); }
      if (cut.t > 3.1 && !cut.gone) { cut.gone = true; location.href = '/world?from=far'; }
    }
  }
}

/* ---------------- the camera ---------------- */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
let snapCam = true;
function aimCamera(dt) {
  const portrait = camera.aspect < 0.8;
  if (area === 'in') {
    const d = Math.max(16.5, (RR + 1.1) / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect));
    wantLook.set(0, ROOM_Y + 0.9, 0.5); wantPos.set(0, ROOM_Y + 0.9 + d * 0.62, 0.5 + d * 0.78);
  } else if (area === 'top') {
    const sx = Math.sin(topAngle), sz = Math.cos(topAngle);
    // from high behind the lamp, over its roof: your bud at the rail and the whole view beyond
    wantPos.set(LH.x - sx * 5, GAL_Y + 11, LH.z - sz * 5);
    wantLook.set(LH.x + sx * 20, GAL_Y - 6, LH.z + sz * 20);
  } else {
    const onTree = area === 'tree', D = onTree ? (portrait ? 30 : 23) : portrait ? 23 : 17.5, pitch = onTree ? 0.42 : 0.74, gy = floorY(me.x, me.z), lead = mode === 'arrive' || mode === 'leave' ? 0 : 1.4;
    wantLook.set(me.x, (cut ? cut.gy : gy) + (onTree ? 4.2 : 1), me.z - lead); wantPos.set(wantLook.x, wantLook.y + Math.sin(pitch) * D, wantLook.z + Math.cos(pitch) * D);
  }
  const k = snapCam ? 1 : 1 - Math.exp(-dt * (area === 'top' ? 7 : 5)); snapCam = false;
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
}
// trees (and the tower) between you and the camera go see-through
function fadeBlockers(dt) {
  for (const f of faders) {
    const dz = f.z - me.z, dx = Math.abs(f.x - me.x);
    const hide = f.canopy ? area === 'tree' && Math.abs(me.x - f.x) < 7.5 && f.z - me.z > 1.5 : area === 'out' && (f.behind ? (dz > 0.5 && dz < 9 && dx < f.wide + 0.6) : (dz > 0.4 && dz < f.tall * 1.25 && dx < f.wide + 0.5));
    const want = hide ? 0.22 : 1; f.o = f.o == null ? 1 : f.o + (want - f.o) * Math.min(1, dt * 8);
    const solid = f.o > 0.98;
    for (const m of f.mats) { if (m.transparent === solid) { m.transparent = !solid; m.needsUpdate = true; } m.opacity = solid ? 1 : f.o; m.depthWrite = solid; }
  }
}

/* ---------------- every frame ---------------- */
function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000, dt = Math.min(0.05, t - last || 0.016); last = t; T += dt;
  if (!me) { renderer.render(scene, camera); return; }
  if (cut) runCut(dt); else steer(dt);
  const gy = cut ? cut.gy : floorY(me.x, me.z);
  placeBud(me, dt, gy);

  // the ferry bobs at its mooring
  boat.g.position.set(boat.x, boat.y + Math.sin(T * 1.1) * 0.12, boat.z); boat.g.rotation.z = Math.sin(T * 0.8) * 0.04; boat.g.rotation.x = Math.sin(T * 0.6 + 1) * 0.03;

  // the keeper: turns to look at you (slowly, and at first not at all), mutters if you keep it company
  if (gloam && gloam.root.visible) {
    const d = Math.hypot(me.x - gloam.x, me.z - gloam.z), sameArea = gloamAt.area === area, lvl = away.level;
    const facing = sameArea && d < 6 && (lvl >= 1 || T < (gloam.lookUntil || 0)) ? Math.atan2(me.x - gloam.x, me.z - gloam.z) : gloam.home;
    gloam.heading += angleTo(gloam.heading, facing) * Math.min(1, dt * (1.2 + lvl));
    gloam.look = sameArea && d < 8 ? me : null;
    placeBud(gloam, dt, gloamAt.area === 'in' ? ROOM_Y : height(gloam.x, gloam.z));
    if (gloam.rod.visible) gloam.rod.rotation.z = Math.sin(T * 0.9) * 0.03;
    if (sameArea && d < 7 && (mode === 'play' || mode === 'chat')) {
      stayT += dt;
      if (stayT > 60 && !away.stayed && away.saidHi) { away.stayed = true; if (!chat.open) gloamSay(LINES.stay[lvl], 4200); post({ do: 'stay' }).then((r) => { if (r.away) afterFond(r); }); }
    }
    if (sameArea && d < 9 && !gloam.noticed && mode === 'play') { gloam.noticed = true; if (!away.saidHi) setTimeout(() => { if (!away.saidHi && T > gloam.bubbleUntil) say(gloam, lvl >= 2 ? '…oh. hm.' : '…', 1800); }, 300); }
  }

  if (area !== 'in') {
    farTreeTick(dt);
    // finds glint; one you've picked up flies to your bud
    for (const f of finds) {
      if (!f.g.visible) continue;
      const s = 0.42 + 0.16 * Math.sin(T * 3 + f.i * 1.7); f.spark.scale.set(s, s, 1); f.spark.material.rotation = T * 0.8 + f.i; f.spark.position.y = 1.05 + Math.sin(T * 2 + f.i) * 0.08;
      if (!f.fly && !f.dig) f.model.rotation.y += dt * 0.5;
      if (f.fly) {
        f.fly.t += dt; const u = clamp(f.fly.t / 1.2, 0, 1), e = smooth01(Math.min(1, u * 2.2));
        f.g.position.set(lerp(f.fly.x0, me.x, e), lerp(f.fly.y0, gy + me.height + 0.5 + me.y, e) + Math.sin(Math.min(1, u * 2.2) * Math.PI) * 0.6, lerp(f.fly.z0, me.z, e));
        f.model.rotation.y += dt * 6; f.g.scale.setScalar(u > 0.75 ? 1 - (u - 0.75) * 4 : 1);
        if (u >= 1) f.g.visible = false;
      }
    }
    // birds fly off when you come close, and settle somewhere else later
    for (const b of birds) {
      if (b.state === 'sit') {
        b.g.position.set(b.x, height(b.x, b.z) + Math.abs(Math.sin(T * 3 + b.x)) * 0.04, b.z);
        if (area === 'out' && Math.hypot(me.x - b.x, me.z - b.z) < 3.4) { b.state = 'fly'; b.t = 0; const a = Math.atan2(b.x - me.x, b.z - me.z) + (Math.random() - 0.5); b.vx = Math.sin(a) * 7; b.vz = Math.cos(a) * 7; b.g.rotation.y = a; S.play('whoosh', { gain: 0.25, rate: 1.8 }); }
      } else {
        b.t += dt; b.x += b.vx * dt; b.z += b.vz * dt; b.y += (3 + b.t * 2) * dt; b.g.position.set(b.x, height(clamp(b.x, -20, 20), clamp(b.z, -30, 30)) + b.y, b.z);
        const flap = Math.sin(T * 26) * 0.9; b.wl.rotation.z = flap; b.wr.rotation.z = -flap;
        if (b.t > 9) { b.wl.rotation.z = b.wr.rotation.z = 0; perch(b); }
      }
    }
    // the humming stones: step into the ring and they chime, one after another
    const inRing = area === 'out' && Math.hypot(me.x - RING.x, me.z - RING.z) < 1.5;
    if (inRing && !ring.in && T > ring.at + 12) { ring.at = T; ring.step = 0; ring.playing = true; if (!ring.said) { ring.said = true; setTimeout(() => say(me, 'they’re… humming?', 2200), 900); } }
    ring.in = inRing;
    if (ring.playing) { const k = Math.floor((T - ring.at) / 0.34); while (ring.step <= k && ring.step < 6) { ring.stones[ring.step].lit = 1; S.play('chime', { gain: 0.55, rate: [1, 1.125, 1.25, 1.5, 1.667, 2][ring.step] }); ring.step++; } if (ring.step >= 6) ring.playing = false; }
    for (const s of ring.stones) { s.lit = Math.max(0, s.lit - dt * 0.3); s.m.emissiveIntensity = s.lit * 1.4; }
    lamp.beams.rotation.y = T * 0.45;
    for (const c of clouds) { c.g.position.x += c.v * dt * (1 + WX.wind * 2); if (c.g.position.x > 230) c.g.position.x = -230; }
    for (const s of wash) s.rotation.x = Math.sin(T * (1.4 + WX.wind * 3) + s.userData.sway) * (0.12 + WX.wind * 0.4);
    if (fall) {
      const p = fall.geometry.attributes.position, { snow, n, at } = fall.userData, sp = snow ? 2.6 : 24, lean = WX.wind * 0.25;
      for (let i = 0; i < n; i++) {
        let y = at[i * 3 + 1] - sp * dt; if (y < 0) y += 22; at[i * 3 + 1] = y;
        const x = at[i * 3] + (snow ? Math.sin(T * 0.8 + i) * 0.4 : 0), z = at[i * 3 + 2];
        if (snow) p.setXYZ(i, x, y, z); else { p.setXYZ(i * 2, x, y, z); p.setXYZ(i * 2 + 1, x + lean, y + 0.7, z); }
      }
      p.needsUpdate = true; fall.position.set(camLook.x, floorY(me.x, me.z) - 2, camLook.z);
    }
  } else if (stove.fire) { const f = 1.3 + Math.sin(T * 9) * 0.2 + Math.sin(T * 23) * 0.12; stove.fire.emissiveIntensity = f; stoveLight.intensity = 0.55 + f * 0.3; }

  for (const f of shelfG.children) if (f.userData.pop > 0) { f.userData.pop = Math.max(0, f.userData.pop - dt * 1.6); f.position.y = f.userData.y0 + Math.sin(f.userData.pop * Math.PI) * 0.3; f.rotation.y += dt * 6 * f.userData.pop; }
  aimCamera(dt); fadeBlockers(dt);
  showAction();
  placeBubble(me); if (gloam) placeBubble(gloam);
  dinnerTick(dt);
  renderer.render(scene, camera);
}

/* ---------------- start ---------------- */
function showCenter(title, text, button, href) {
  $('centerTitle').textContent = title; $('centerText').textContent = text; $('centerBtn').textContent = button; $('centerBtn').href = href; $('center').hidden = false; $('fade').classList.add('clear');
}
addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
(S.bindPanel || S.bindToggle)($('soundBtn'));
if (S.music) S.music(true, { mood: () => (NIGHT > 0.5 ? 'night' : GOLD > 0.3 ? 'golden' : 'morning') });
if (!window.BudSound) $('soundBtn').hidden = true;
S.onChange(() => S.ambient(!S.muted)); S.ambient(true);

(async () => {
  let world;
  try {
    const res = await fetch('/api/world?away=1');
    if (res.status === 401) { showCenter('Sign in first', 'The ferry only takes islanders.', 'Go to bud', '/'); return; }
    world = await res.json();
    if (!res.ok) throw new Error(world.error || 'load failed');
  } catch (e) { console.error(e); showCenter('The ferry couldn’t make the crossing', 'Something went wrong on the way over. Try again in a moment.', 'Back to bud island', '/world'); return; }
  if (!world.bud) { showCenter('You’ll need a bud for this trip', 'Make your bud first, then catch the ferry from the dock.', 'Make my bud', '/'); return; }
  away = world.away; shelf = world.shelf || []; myId = world.me && world.me.id; drawShelf();
  const fond = params.get('fond'); if (fond != null && /^\d+$/.test(fond)) { away.fond = Number(fond); away.level = fondLevel(away.fond); away.met = away.met || away.fond > 0; }   // preview only: nothing is saved
  buildTerrain(); buildDecor(); buildSky(); buildDock(); buildLighthouse(away.level); buildRoom(); buildFarTree();
  buildFinds(away.taken); buildBirds();
  me = await makeBud(world.bud);
  await makeGloam();
  if (dinnerOn() || params.get('dinner') === '1') await buildDinner(world.guests || []);
  buildAtmosphere(); placeGloam();
  gloam.mood = away.level >= 2 ? null : 'annoyed';
  setArea('out'); updateFindsPill();
  mode = 'arrive'; cut = { kind: 'arrive', t: 0, gy: 13 }; runCut(0); snapCam = true; aimCamera(0);
  post({ do: 'arrive' }).then((r) => { if (r.away) away.trips = r.away.trips; });
  setTimeout(() => $('fade').classList.add('clear'), 80);
  /*TEST*/
})();
requestAnimationFrame(frame);
</script>
